<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking Sectorial del PIB · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root{
      --populi:#C71E1D;--populi-dark:#6B0300;--populi-light:#E8706B;--populi-gold:#EE9B00;
      --cream:#F5EFE0;--brown:#5C3D1E;--brown-dark:#3D2B1F;
      --navy:#0D1B2A;--navy-light:#1A2940;
      --slate:#475569;--slate-light:#64748B;
      --warm-white:#FAF8F3;--light-gray:#F1EDE5;
      --border:#E2DDD3;--dark-border:#2A3A50;
      --bg:var(--warm-white);--card:#FFFFFF;--text:var(--brown-dark);--muted:var(--slate-light);
      --accent:#0A9396;--radius:12px;
      --shadow:0 1px 3px rgba(13,27,42,.04),0 4px 16px rgba(13,27,42,.06);
    }
    [data-theme="dark"]{--bg:#080808;--card:#141414;--text:#E2E8F0;--muted:#64748B;--border:#2A3A50;--light-gray:#1A1A1A;--cream:#1A2940;--shadow:0 2px 8px rgba(0,0,0,.5),0 6px 24px rgba(0,0,0,.4)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
    .embed-container{max-width:1200px;margin:0 auto;padding:20px 16px}
    .section-header{margin-bottom:16px}
    .section-title{font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px;line-height:1.15}
    [data-theme="dark"] .section-title{color:#fff}
    .accent-bar{width:4px;height:26px;background:var(--accent);border-radius:2px;flex-shrink:0}
    .section-subtitle{font-size:.78rem;color:var(--muted);padding-left:14px;margin-top:2px}
    [data-theme="dark"] .section-subtitle{color:rgba(255,255,255,.4)}

    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    @media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
    .kpi-card{background:var(--warm-white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden;cursor:default;transition:transform .2s,box-shadow .2s}
    [data-theme="dark"] .kpi-card{background:#141414;border-color:var(--dark-border)}
    .kpi-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
    .kpi-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
    .kpi-card[data-s="ref"]::after{background:var(--accent)}
    .kpi-card[data-s="best"]::after{background:#0A9396}
    .kpi-card[data-s="worst"]::after{background:#C71E1D}
    .kpi-card[data-s="spread"]::after{background:#EE9B00}
    .kpi-label{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
    [data-theme="dark"] .kpi-label{color:rgba(255,255,255,.4)}
    .kpi-value{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700}
    .kpi-sub{font-size:.58rem;color:var(--muted);margin-top:2px}

    .main-grid{display:grid;grid-template-columns:3fr 2fr;grid-template-rows:580px;gap:16px}
    @media(max-width:900px){.main-grid{grid-template-columns:1fr;grid-template-rows:480px auto}}
    @media(max-width:500px){.main-grid{grid-template-rows:400px auto}.section-title{font-size:1.2rem}.kpi-value{font-size:1rem}}

    .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;height:100%;overflow:hidden}
    [data-theme="dark"] .chart-card{background:#141414;border-color:var(--dark-border)}
    .chart-controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;margin-bottom:10px}
    .view-btn{padding:4px 14px;border:1.5px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:.65rem;font-weight:600;color:var(--muted);transition:all .2s}
    [data-theme="dark"] .view-btn{border-color:var(--dark-border);color:#64748B}
    .view-btn:hover,.view-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(10,147,150,.06)}
    [data-theme="dark"] .view-btn:hover,[data-theme="dark"] .view-btn.active{border-color:#0A9396;color:#0A9396;background:rgba(10,147,150,.1)}
    .chart-area{flex:1;min-height:0}
    .chart-source{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:0 2px}
    .chart-source-text{font-size:.58rem;color:var(--muted);opacity:.6}
    .chart-source-text a{color:var(--populi);font-weight:600;text-decoration:none}
    .chart-source-text a:hover{text-decoration:underline}
    .watermark{height:15px;width:auto;opacity:.18}
    [data-theme="dark"] .watermark{opacity:.10}

    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:100%}
    [data-theme="dark"] .panel{background:#141414;border-color:var(--dark-border)}
    .panel-header{background:var(--navy);padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
    [data-theme="dark"] .panel-header{background:var(--navy-light)}
    .panel-header-title{font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.8)}
    .panel-header-date{font-family:'JetBrains Mono',monospace;font-size:.56rem;font-weight:600;color:var(--populi-light);background:rgba(199,30,29,.15);padding:2px 8px;border-radius:5px}
    .panel-body{padding:14px;flex:1;overflow-y:auto}
    .panel-block{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    [data-theme="dark"] .panel-block{border-color:var(--dark-border)}
    .panel-block:last-of-type{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .panel-label{display:inline-flex;align-items:center;gap:4px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;padding:2px 9px 2px 6px;border-radius:4px;border-left:3px solid}
    .panel-val{font-family:'JetBrains Mono',monospace;font-size:.92rem;font-weight:700;margin-bottom:3px}
    .panel-desc{font-size:.66rem;line-height:1.55;color:var(--slate-light)}
    [data-theme="dark"] .panel-desc{color:rgba(255,255,255,.45)}
    .panel-desc strong{color:var(--navy)}
    [data-theme="dark"] .panel-desc strong{color:#E2E8F0}
    .delta-tag{font-family:'JetBrains Mono',monospace;font-weight:600;padding:1px 5px;border-radius:4px;font-size:.82em;white-space:nowrap}
    .dt-teal{background:rgba(10,147,150,.08);color:#0A9396}
    .dt-gray{background:rgba(100,116,139,.08);color:#64748B}
    .dt-red{background:rgba(199,30,29,.08);color:#C71E1D}
    .dt-green{background:rgba(10,147,150,.08);color:#0A9396}
    .dt-amber{background:rgba(238,155,0,.08);color:#EE9B00}

    .ctx-box{background:var(--cream);border-radius:6px;padding:8px 10px;border-left:3px solid var(--populi);margin-top:6px}
    [data-theme="dark"] .ctx-box{background:var(--navy-light)}
    .ctx-box p{font-size:.66rem;line-height:1.55;color:var(--slate-light)}
    [data-theme="dark"] .ctx-box p{color:#64748B}
    .ctx-box p strong{color:var(--navy)}
    [data-theme="dark"] .ctx-box p strong{color:#E2E8F0}

    .rank-list{list-style:none;margin:6px 0 0}
    .rank-item{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)}
    [data-theme="dark"] .rank-item{border-color:var(--dark-border)}
    .rank-item:last-child{border-bottom:none}
    .rank-pos{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:600;color:var(--muted);width:14px;text-align:right}
    .rank-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .rank-name{font-size:.62rem;font-weight:600;color:var(--text);flex:1}
    [data-theme="dark"] .rank-name{color:#E2DDD3}
    .rank-val{font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:700}

    .panel-footer{padding:10px 14px;border-top:1px solid var(--border)}
    [data-theme="dark"] .panel-footer{border-color:var(--dark-border)}
    .ampliar-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px 0;border-radius:8px;font-family:'Inter',sans-serif;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--populi);background:rgba(199,30,29,.06);border:1.5px solid rgba(199,30,29,.15);transition:all .2s;text-decoration:none;cursor:pointer}
    [data-theme="dark"] .ampliar-btn{background:rgba(232,112,107,.08);border-color:rgba(232,112,107,.2);color:var(--populi-light)}
    .ampliar-btn:hover{background:rgba(199,30,29,.12);border-color:rgba(199,30,29,.3);transform:translateY(-1px);box-shadow:0 2px 8px rgba(199,30,29,.1)}
    .ampliar-btn svg{width:13px;height:13px}

    .edu-box{background:var(--cream);border-radius:8px;padding:10px 12px;border-left:3px solid var(--populi);margin-top:4px;cursor:pointer;transition:all .2s}
    [data-theme="dark"] .edu-box{background:var(--navy-light)}
    .edu-box:hover{transform:translateY(-1px)}
    .edu-box-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .edu-box-title{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--populi)}
    [data-theme="dark"] .edu-box-title{color:var(--populi-light)}
    .edu-box-arrow{font-size:.6rem;color:var(--muted);transition:transform .2s}
    .edu-box.open .edu-box-arrow{transform:rotate(180deg)}
    .edu-box-content{display:none;margin-top:8px}
    .edu-box.open .edu-box-content{display:block}
    .edu-box-content p{font-size:.66rem;line-height:1.6;color:var(--slate-light);margin-bottom:6px}
    .edu-box-content p:last-child{margin-bottom:0}
    [data-theme="dark"] .edu-box-content p{color:#64748B}
    .edu-box-content p strong{color:var(--navy)}
    [data-theme="dark"] .edu-box-content p strong{color:#E2E8F0}
  </style>
</head>
<body>
<div class="embed-container" id="app"></div>
<script>
(function(){
  var params=new URLSearchParams(window.location.search);
  if(params.get('theme')==='dark') document.documentElement.dataset.theme='dark';
  window.addEventListener('message',function(e){if(e.data&&e.data.theme) document.documentElement.dataset.theme=e.data.theme});

  /* Alto real hacia el contenedor (mismo protocolo que los embeds generados) */
  var _lastH=0;
  function reportHeight(force){
    if(window.parent===window) return;
    /* Medir el CONTENIDO, no el documento: scrollHeight nunca baja del alto del propio
       iframe, asi que reportaba el min-height vigente y el ajuste no hacia nada. */
    var bottom=0, kids=document.body.children;
    for(var i=0;i<kids.length;i++){
      var r=kids[i].getBoundingClientRect();
      if(r.height>0) bottom=Math.max(bottom, r.bottom);
    }
    var pad=parseFloat(getComputedStyle(document.body).paddingBottom)||0;
    var h=Math.ceil(bottom + window.scrollY + pad);
    if(h>0 && (force===true || Math.abs(h-_lastH)>2)){
      _lastH=h; window.parent.postMessage({populiEmbed:'height', height:h},'*');
    }
  }
  /* Reintentos: el primer aviso puede salir antes de que el contenedor escuche, y el
     grafico todavia puede crecer al montar ECharts o al cargar las fuentes. */
  window.addEventListener('load',function(){reportHeight(true)});
  [0,150,600,1600].forEach(function(ms){setTimeout(function(){reportHeight(true)},ms)});
  window.addEventListener('resize',function(){reportHeight(false)});
  window.addEventListener('message',function(e){
    if(e.data&&e.data.populiEmbed==='ask-height') reportHeight(true);
  });
  if(window.ResizeObserver) new ResizeObserver(function(){reportHeight(false)}).observe(document.body);
  function dk(){return document.documentElement.dataset.theme==='dark'}

  var QTR='IV Trim. 2025';
  var PIB={ia:-1.14,m12:-1.58,acum:-1.58};

  var S=[
    {n:'Agricultura',       c:'#0A9396',ia:12.19, m12:6.66,  acum:6.66},
    {n:'Extractiva',        c:'#EE9B00',ia:4.71,  m12:-4.32, acum:-4.32},
    {n:'Manufactura',       c:'#005F73',ia:0.50,  m12:0.74,  acum:0.74},
    {n:'Electricidad',      c:'#9B2226',ia:-0.75, m12:-0.23, acum:-0.23},
    {n:'Construcción',      c:'#C71E1D',ia:-17.66,m12:-13.57,acum:-13.57},
    {n:'Comercio',          c:'#94D2BD',ia:-6.05, m12:-0.87, acum:-0.87},
    {n:'Transporte',        c:'#005F73',ia:-1.37, m12:-0.90, acum:-0.90},
    {n:'Alojamiento',       c:'#DF5D25',ia:2.45,  m12:3.58,  acum:3.58},
    {n:'Financieras',       c:'#EE9B00',ia:0.21,  m12:-3.45, acum:-3.45},
    {n:'Adm. Pública',      c:'#64748B',ia:-1.47, m12:1.96,  acum:1.96},
    {n:'Comunales',         c:'#0A9396',ia:-3.71, m12:0.53,  acum:0.53}
  ];

  var VIEWS=[
    {key:'ia',  label:'Interanual',desc:'Trimestre vs. mismo trimestre año anterior'},
    {key:'m12', label:'12 Meses',  desc:'Suma 4 trim. / suma 4 trim. anteriores − 1'},
    {key:'acum',label:'Acumulada', desc:'Acumulado desde el I trimestre del año'}
  ];
  var curView=0;
  var chart=null;

  function fp(v){return(v>=0?'+':'')+v.toFixed(1)+'%'}
  function fp2(v){return(v>=0?'+':'')+v.toFixed(2)+'%'}

  function sorted(dir){
    var k=VIEWS[curView].key;
    if(dir==='desc') return S.slice().sort(function(a,b){return b[k]-a[k]});
    return S.slice().sort(function(a,b){return a[k]-b[k]});
  }

  function init(){
    document.getElementById('app').innerHTML=buildHTML();
    buildControls();
    render();
    buildEdu();
    window.addEventListener('resize',function(){if(chart)chart.resize()});
    new MutationObserver(function(){render()})
      .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }

  function buildHTML(){
    var d=dk();
    return '<div class="section-header">'
      +'<h2 class="section-title"><span class="accent-bar"></span>Ranking Sectorial del PIB</h2>'
      +'<p class="section-subtitle" id="sub">'+QTR+' · Variación interanual en %</p></div>'
      +'<div class="kpi-grid" id="kpis"></div>'
      +'<div class="main-grid">'
      +  '<div class="chart-card">'
      +    '<div class="chart-controls" id="views"></div>'
      +    '<div class="chart-area" id="main-chart"></div>'
      +    '<div class="chart-source"><span class="chart-source-text">'
      +      'Fuente: <a href="https://www.ine.gob.bo" target="_blank">INE Bolivia</a> · '
      +      'Elaboración: <a href="https://populi.org.bo" target="_blank">Centro de Estudios POPULI</a></span>'
      +      '<svg viewBox="0 0 310 130" xmlns="http://www.w3.org/2000/svg" class="watermark">'
      +        '<text x="6" y="112" font-family="\'Playfair Display\',Georgia,serif" font-size="145" font-weight="700" fill="'+(d?'#E8706B':'#C71E1D')+'">P</text>'
      +        '<text x="92" y="87" font-family="\'Playfair Display\',Georgia,serif" font-size="55" font-weight="400" font-style="italic" letter-spacing="1" fill="'+(d?'#F5EFE0':'#3D2B1F')+'">opuli</text></svg></div>'
      +  '</div>'
      +  '<div class="panel">'
      +    '<div class="panel-header">'
      +      '<span class="panel-header-title">Lectura del indicador</span>'
      +      '<span class="panel-header-date">'+QTR+'</span>'
      +    '</div>'
      +    '<div class="panel-body" id="panel-body"></div>'
      +    '<div class="panel-footer">'
      +      '<a href="https://populi.org.bo/monitor-actividad-economica" target="_blank" class="ampliar-btn">'
      +        '<span>Ampliar análisis</span>'
      +        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      +          '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
      +          '<polyline points="15 3 21 3 21 9"/>'
      +          '<line x1="10" y1="14" x2="21" y2="3"/>'
      +        '</svg>'
      +      '</a>'
      +    '</div>'
      +  '</div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px" id="edu"></div>';
  }

  function buildControls(){
    var el=document.getElementById('views');
    VIEWS.forEach(function(v,i){
      var b=document.createElement('button');
      b.className='view-btn'+(i===curView?' active':'');
      b.textContent=v.label;b.title=v.desc;
      b.addEventListener('click',function(){
        curView=i;
        document.querySelectorAll('.view-btn').forEach(function(x){x.classList.remove('active')});
        b.classList.add('active');
        document.getElementById('sub').textContent=QTR+' · '+v.desc;
        render();
      });
      el.appendChild(b);
    });
  }

  function render(){buildKPIs();buildChart();buildPanel()}

  function buildKPIs(){
    var k=VIEWS[curView].key;
    var desc=sorted('desc');
    var best=desc[0],worst=desc[desc.length-1];
    var above=S.filter(function(s){return s[k]>PIB[k]}).length;
    document.getElementById('kpis').innerHTML=
      '<div class="kpi-card" data-s="ref"><div class="kpi-label">PIB Total</div>'
      +'<div class="kpi-value" style="color:var(--accent)">'+fp(PIB[k])+'</div>'
      +'<div class="kpi-sub">'+VIEWS[curView].label+' · '+QTR+'</div></div>'
      +'<div class="kpi-card" data-s="best"><div class="kpi-label">Mejor sector</div>'
      +'<div class="kpi-value" style="color:'+best.c+'">'+fp(best[k])+'</div>'
      +'<div class="kpi-sub">'+best.n+'</div></div>'
      +'<div class="kpi-card" data-s="worst"><div class="kpi-label">Mayor caída</div>'
      +'<div class="kpi-value" style="color:'+worst.c+'">'+fp(worst[k])+'</div>'
      +'<div class="kpi-sub">'+worst.n+'</div></div>'
      +'<div class="kpi-card" data-s="spread"><div class="kpi-label">Sobre PIB total</div>'
      +'<div class="kpi-value" style="color:#EE9B00">'+above+' <span style="font-size:.7rem;font-weight:400">de 11</span></div>'
      +'<div class="kpi-sub">Sectores por encima del promedio</div></div>';
  }

  function buildChart(){
    var d=dk();
    var k=VIEWS[curView].key;
    var asc=sorted('asc');
    var names=asc.map(function(s){return s.n});
    var pv=PIB[k];

    if(chart)chart.dispose();
    chart=echarts.init(document.getElementById('main-chart'));

    var data=asc.map(function(s){
      var v=s[k];
      return{
        value:v,
        itemStyle:{
          color:new echarts.graphic.LinearGradient(v>=0?0:1,0,v>=0?1:0,0,[
            {offset:0,color:s.c+'28'},{offset:1,color:s.c}
          ]),
          borderRadius:v>=0?[0,4,4,0]:[4,0,0,4]
        },
        label:{
          show:true,
          position:v>=0?'right':'left',
          fontFamily:'JetBrains Mono',fontSize:11,fontWeight:700,
          color:d?(v>=0?'#34D399':'#E8706B'):(v>=0?'#0A9396':'#C71E1D'),
          formatter:function(p){return fp(p.value)}
        }
      };
    });

    chart.setOption({
      backgroundColor:'transparent',
      animationDuration:600,animationEasing:'cubicOut',
      grid:{top:36,right:68,bottom:28,left:105},
      tooltip:{
        trigger:'axis',
        axisPointer:{type:'shadow',shadowStyle:{color:d?'rgba(255,255,255,.03)':'rgba(0,0,0,.04)'}},
        backgroundColor:d?'#080808':'rgba(13,27,42,.96)',
        borderColor:d?'#2A3A50':'#1A2940',
        textStyle:{fontFamily:'Inter',fontSize:11,color:'#fff'},
        padding:[10,14],
        extraCssText:'border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);',
        formatter:function(params){
          if(!params.length)return'';
          var p=params[0];var s=asc[p.dataIndex];
          var v=s[k];var diff=v-pv;
          return '<div style="font-weight:700;margin-bottom:6px;color:#E9D8A6;font-size:12px">'+s.n+'</div>'
            +'<div style="display:flex;gap:10px;align-items:center;margin:3px 0">'
            +'<span style="width:8px;height:8px;border-radius:50%;background:'+s.c+';display:inline-block"></span>'
            +'<span style="font-size:10px;color:rgba(255,255,255,.6)">'+VIEWS[curView].label+'</span>'
            +'<span style="font-family:\'JetBrains Mono\';font-weight:700;font-size:12px;margin-left:auto;color:'+(v>=0?'#34D399':'#E8706B')+'">'+fp(v)+'</span></div>'
            +'<div style="border-top:1px solid rgba(255,255,255,.1);margin:6px 0;padding-top:6px">'
            +'<div style="font-size:10px;color:rgba(255,255,255,.5)">vs PIB Total ('+fp(pv)+')</div>'
            +'<div style="font-family:\'JetBrains Mono\';font-weight:700;font-size:11px;color:'+(diff>=0?'#34D399':'#E8706B')+'">'+fp(diff)+' pp</div></div>';
        }
      },
      xAxis:{
        type:'value',
        splitLine:{lineStyle:{color:d?'#141414':'#F1F5F9',type:'dashed'}},
        axisLine:{show:false},axisTick:{show:false},
        axisLabel:{fontFamily:'JetBrains Mono',fontSize:10,color:d?'#64748B':'#64748B',formatter:function(v){return v+'%'}}
      },
      yAxis:{
        type:'category',data:names,
        axisLine:{lineStyle:{color:d?'#2A3A50':'#E2DDD3'}},
        axisTick:{show:false},
        axisLabel:{fontFamily:'Inter',fontSize:11,fontWeight:600,color:d?'#E2DDD3':'#3D2B1F',width:95,overflow:'truncate'}
      },
      graphic:[{
        type:'group',
        left:'center',top:6,
        children:[{
          type:'rect',
          shape:{width:160,height:22,r:5},
          style:{fill:d?'rgba(10,147,150,.18)':'rgba(10,147,150,.1)'}
        },{
          type:'text',
          style:{
            text:'◆  PIB Total: '+fp(pv),
            x:80,y:11,
            textAlign:'center',textVerticalAlign:'middle',
            fontFamily:'JetBrains Mono',fontSize:10,fontWeight:700,
            fill:d?'#0A9396':'#0A9396'
          }
        }]
      }],
      series:[{
        type:'bar',data:data,barWidth:26,
        emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(0,0,0,.15)'}},
        markLine:{
          silent:true,symbol:'none',animation:false,
          data:[
            {xAxis:0,lineStyle:{type:'solid',width:1.5,color:d?'#333':'#E2DDD3'},label:{show:false}},
            {xAxis:pv,
             lineStyle:{type:[6,4],width:2,color:d?'rgba(10,147,150,.5)':'rgba(10,147,150,.45)'},
             label:{show:false}
            }
          ]
        }
      }]
    },true);
  }

  function buildPanel(){
    var k=VIEWS[curView].key;
    var d=dk();
    var desc=sorted('desc');
    var best=desc[0],worst=desc[desc.length-1],best2=desc[1];
    var growing=S.filter(function(s){return s[k]>=0}).length;
    var above=S.filter(function(s){return s[k]>PIB[k]}).length;
    var spread=(best[k]-worst[k]).toFixed(1);

    var html='';

    html+='<div class="panel-block">'
      +'<div class="panel-label" style="color:#0A9396;background:rgba(10,147,150,.08);border-left-color:#0A9396">PIB Total — Referencia</div>'
      +'<div class="panel-val" style="color:#0A9396">'+fp2(PIB[k])+'</div>'
      +'<p class="panel-desc">Crecimiento '+VIEWS[curView].label.toLowerCase()+' del PIB agregado en el '+QTR+'. <strong>'+above+' de 11 sectores</strong> crecen por encima de este nivel.</p>'
      +'</div>';

    html+='<div class="panel-block">'
      +'<div class="panel-label" style="color:'+best.c+';background:'+best.c+'14;border-left-color:'+best.c+'">'+best.n+'</div>'
      +'<div class="panel-val" style="color:'+best.c+'">'+fp2(best[k])+'</div>'
      +'<p class="panel-desc">Sector más dinámico. Diferencial de <span class="delta-tag dt-green">'+(best[k]-PIB[k]).toFixed(1)+' pp</span> sobre el PIB total. Seguido por <strong>'+best2.n+'</strong> (<span class="delta-tag dt-teal">'+fp(best2[k])+'</span>).</p>'
      +'</div>';

    html+='<div class="panel-block">'
      +'<div class="panel-label" style="color:'+worst.c+';background:'+worst.c+'14;border-left-color:'+worst.c+'">'+worst.n+'</div>'
      +'<div class="panel-val" style="color:'+worst.c+'">'+fp2(worst[k])+'</div>'
      +'<p class="panel-desc">Mayor contracción. Brecha de <span class="delta-tag dt-red">'+spread+' pp</span> respecto al sector líder.</p>'
      +'</div>';

    var analysis='';
    if(growing<=4){
      analysis='<strong>Debilidad generalizada.</strong> Solo '+growing+' de 11 sectores muestran crecimiento positivo en la medida '+VIEWS[curView].label.toLowerCase()+'. La contracción es amplia y refleja un deterioro extendido de la actividad económica.';
    } else if(growing<=6){
      analysis='<strong>Economía dividida.</strong> '+growing+' sectores crecen mientras '+(11-growing)+' se contraen. La heterogeneidad sectorial es marcada, con una brecha de <span class="delta-tag dt-amber">'+spread+' pp</span> entre el mejor y peor sector.';
    } else {
      analysis='<strong>Dinamismo amplio.</strong> '+growing+' de 11 sectores registran crecimiento positivo, señalando una recuperación extendida. Sin embargo, la brecha de <span class="delta-tag dt-amber">'+spread+' pp</span> indica que la expansión no es homogénea.';
    }

    html+='<div class="ctx-box"><p>'+analysis+'</p></div>';

    html+='<div style="margin-top:10px"><div style="font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px">Ranking completo</div>'
      +'<ul class="rank-list">';
    desc.forEach(function(s,i){
      var v=s[k];
      html+='<li class="rank-item">'
        +'<span class="rank-pos">'+(i+1)+'</span>'
        +'<span class="rank-dot" style="background:'+s.c+'"></span>'
        +'<span class="rank-name">'+s.n+'</span>'
        +'<span class="rank-val" style="color:'+(v>=0?(d?'#34D399':'#0A9396'):(d?'#E8706B':'#C71E1D'))+'">'+fp(v)+'</span>'
        +'</li>';
    });
    html+='</ul></div>';

    document.getElementById('panel-body').innerHTML=html;
  }

  function buildEdu(){
    var items=[
      {t:'¿Qué muestra este gráfico?',
       c:'<p>Muestra los <strong>11 sectores del PIB boliviano</strong> ordenados de mayor a menor crecimiento en el último trimestre. Permite identificar rápidamente qué sectores impulsan y cuáles frenan la economía.</p>'},
      {t:'La línea de referencia del PIB',
       c:'<p>La línea punteada indica el <strong>crecimiento del PIB total</strong>. Los sectores a la derecha de esta línea crecen más que el promedio; los que están a la izquierda, menos. Un sector puede crecer y aún estar por debajo del PIB total.</p>'},
      {t:'¿Por qué tres medidas?',
       c:'<p><strong>Interanual</strong> captura la dinámica puntual del trimestre pero puede ser volátil por efectos base. <strong>12 Meses</strong> suaviza la serie y es la referencia del BCB. <strong>Acumulada</strong> muestra el desempeño en lo que va del año: en T1 coincide con la interanual; en T4, es el crecimiento anual.</p>'}
    ];
    document.getElementById('edu').innerHTML=items.map(function(e){
      return '<div class="edu-box" onclick="this.classList.toggle(\'open\')">'
        +'<div class="edu-box-toggle"><span class="edu-box-title">'+e.t+'</span>'
        +'<span class="edu-box-arrow">&#9660;</span></div>'
        +'<div class="edu-box-content">'+e.c+'</div></div>';
    }).join('');
  }

  init();
})();
</script>
</body>
</html>
