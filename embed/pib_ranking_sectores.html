<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Ranking of GDP activities · Populi">Ranking de actividades del PIB · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <!-- doce filas (el PIB y las 11 actividades) de ~30 px: el alto del lienzo sale de las filas, no del molde -->
  <style>
    #chart { height: 400px; }
    @media (max-width: 900px) { #chart { height: 378px; } }
    @media (max-width: 640px) { #chart { height: 366px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title" data-en='<span class="accent-bar"></span>Ranking of economic activities'><span class="accent-bar"></span>Ranking de actividades económicas</div>
      <div class="sec-sub" id="sub" data-en="Year-on-year change in GDP by economic activity, from the fastest-growing to the steepest-falling (%)">Variación interanual del PIB por actividad económica, de la que más crece a la que más cae (%)</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl" data-en="Measure">Medida</span><div class="hz-grp" id="b-medida"></div></div>
      <div class="hz-item"><span class="hz-lbl" data-en="Quarter">Trimestre</span><div class="hz-grp" id="b-trim"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span data-en="Loading the ranking of activities…">Cargando el ranking de actividades…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t" data-en="Reading the indicator">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    var tr = PM.t;   // tr('castellano', 'inglés'): con ?lang=en el gráfico sale en inglés (acá T son los trimestres)
    // ── Nombres de los datos en inglés (actividades del INE): UN solo diccionario, idéntico en los cuatro gráficos
    // sectoriales del PIB. Las claves son los nombres exactos de data/pib_actividad.json (nombre, nombre_largo y los
    // grandes sectores). N() se aplica sólo donde el nombre se MUESTRA; los datos se buscan siempre por su clave (k). ──
    var EN = {
      'PIB': 'GDP',
      'Producto interno bruto (a precios de mercado)': 'Gross domestic product (at market prices)',
      'Impuestos': 'Taxes',
      'Derechos sobre importaciones, IVA no deducible, IT y otros impuestos indirectos': 'Import duties, non-deductible VAT, transactions tax (IT) and other indirect taxes',
      'VAB': 'GVA',
      'Valor agregado bruto': 'Gross value added',
      'Agropecuaria': 'Agriculture',
      'Agricultura, ganadería, silvicultura y pesca': 'Agriculture, livestock, forestry and fishing',
      'Extractiva': 'Extractive industries',
      'Actividad extractiva (hidrocarburos y minería)': 'Extractive activity (hydrocarbons and mining)',
      'Manufactura': 'Manufacturing',
      'Industrias manufactureras': 'Manufacturing industries',
      'Electricidad y agua': 'Electricity and water',
      'Suministro de electricidad, gas, agua y recolección de desechos': 'Electricity, gas and water supply and waste collection',
      'Construcción': 'Construction',
      'Comercio': 'Commerce',
      'Transporte': 'Transport',
      'Transporte y comunicaciones': 'Transport and communications',
      'Alojamiento': 'Accommodation',
      'Actividades de alojamiento y servicio de comidas': 'Accommodation and food service activities',
      'Financieras': 'Financial services',
      'Actividades financieras y de seguros, inmobiliarias y servicios a las empresas': 'Financial and insurance activities, real estate and business services',
      'Adm. pública': 'Public admin.',
      'Administración pública, salud y educación de no mercado': 'Public administration, non-market health and education',
      'Comunales': 'Community services',
      'Actividades comunales, sociales y personales': 'Community, social and personal activities',
      'Primario': 'Primary',
      'Secundario': 'Secondary',
      'Terciario': 'Tertiary'
    };
    var N = function (s) { return PM.en && EN[s] != null ? EN[s] : s; };
    // ── Colores de las actividades: UN solo mapa, idéntico en los cuatro gráficos sectoriales del PIB ──
    // Por familia de gran sector: primario en oro, secundario en rojo, terciario en turquesa/petróleo y
    // tierra; la administración pública (no de mercado) y los impuestos en gris. Las actividades grandes
    // conservan su tono en los dos temas; en el oscuro sólo suben de paso los tonos hondos (manufactura,
    // transporte) y la electricidad, la más chica, toma el tinte rojo. Validado con el script de la marca,
    // vecinos de la pila en el orden del INE: ΔE ≥ 15,3 en visión normal y ≥ 9,9 con daltonismo en los
    // dos temas. Son colores de RELLENO; una cifra en ese color pasa por PM.tx (≥ 3:1 contra el fondo).
    var COLOR = {
      agro: '#EE9B00', extractiva: '#A86E00',
      manufactura: { claro: '#8B1A1A', oscuro: '#E8706B' }, electricidad: { claro: '#E8706B', oscuro: '#F8E5E3' },
      construccion: '#C71E1D',
      comercio: '#0A9396', transporte: { claro: '#005F73', oscuro: '#D9EAE6' },
      alojamiento: '#E57D22', financieras: '#94D2BD',
      administracion: { claro: '#8A9699', oscuro: '#6E7A7D' }, comunales: '#DF5D25',
      impuestos: { claro: '#C9CDCE', oscuro: '#3A4549' },
      primario: '#EE9B00', secundario: '#C71E1D', terciario: '#0A9396', pib: '#001219'
    };
    // Ranking de barras divergentes: una fila por actividad, el puesto y el nombre en una columna propia a
    // la izquierda (fuera del área de barras), barras desde el cero por SIGNO (turquesa crece o suma, rojo
    // cae o resta, el código de los paneles de actividad) y la cifra en el extremo de cada barra, afuera, con
    // fondo del color de la tarjeta para que ninguna raya la cruce. El PIB es la primera fila, en tinta,
    // separada por un filete; su raya vertical tenue corre sólo por detrás de las barras. Sin grilla
    // vertical: las cifras dicen el valor. Todo se dibuja en una serie «custom» con las actividades en un
    // orden FIJO: al cambiar de trimestre o de medida cada fila se desliza a su nuevo puesto.
    var ARRIBA = { claro: '#0A9396', oscuro: '#94D2BD' }, ABAJO = { claro: '#C71E1D', oscuro: '#E8706B' };
    var signo = function (v) { return v >= 0 ? ARRIBA : ABAJO; };
    var PIB = COLOR.pib, NB = ' ';
    var MED = { var: { nombre: tr('Interanual', 'Year-on-year'), serie: 'var', pp: false },
                acum: { nombre: tr('Acumulada en el año', 'Year-to-date'), serie: 'var_acum', pp: false },
                contrib: { nombre: tr('Contribución', 'Contribution'), serie: 'contrib', pp: true } };
    var estado = { medida: 'var', t: null, fila: null };
    var D, M, T, NOM = {}, LARGO = {}, filas = [], grafico;

    PM.cargar(['pib_actividad.json']).then(function (r) {
      D = r[0]; M = D.metadata; T = D.trimestres;
      D.rubros.forEach(function (x) { NOM[x.k] = N(x.nombre); LARGO[x.k] = N(x.nombre_largo); });
      estado.t = T.length - 1;
      PM.botonera(document.getElementById('b-medida'), [['var', tr('Interanual', 'Year-on-year')], ['acum', tr('Acumulada', 'Year-to-date')], ['contrib', tr('Contribución', 'Contribution')]],
        estado.medida, function (v) { estado.medida = v; todo(); });
      // los cuatro últimos trimestres publicados
      var ult = []; for (var i = Math.max(0, T.length - 4); i < T.length; i++) ult.push([String(i), PM.fecha(T[i])]);
      PM.botonera(document.getElementById('b-trim'), ult, String(estado.t), function (v) { estado.t = +v; todo(); });
      ordenar(); cifras(); subtitulo();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { var x = ITEMS[p.dataIndex]; if (x && x.k !== 'pib') panel(x.k); });
      // la fila bajo el cursor: banda tenue (el puntero del eje) y el nombre en negrita
      grafico.chart.on('updateAxisPointer', function (e) {
        var info = (e.axesInfo || []).filter(function (a) { return a.axisDim === 'y'; })[0];
        var j = info ? casillero(+info.value) : null;
        if (j === hover) return;
        if (hover != null) grafico.chart.dispatchAction({ type: 'downplay', seriesIndex: 0, dataIndex: hover });
        hover = j;
        if (j != null) grafico.chart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: j });
      });
      var soltar = function () {
        if (hover != null) grafico.chart.dispatchAction({ type: 'downplay', seriesIndex: 0, dataIndex: hover });
        hover = null;
      };
      grafico.chart.on('globalout', soltar);
      grafico.chart.on('hidetip', soltar);
      panel(filas[filas.length - 1].k);
      PM.alCambiarTema(function () { cifras(); panel(estado.fila); });
      PM.preguntas(document.getElementById('preguntas'), preguntas());
      document.getElementById('fuente').innerHTML = tr(
        'Fuente: <a href="' + M.url + '" target="_blank" rel="noopener">INE — PIB trimestral por actividad económica (referencia 2017)</a> · Elaboración: Centro de Estudios POPULI · Datos al: ',
        'Source: <a href="' + M.url + '" target="_blank" rel="noopener">INE (National Statistics Institute) — Quarterly GDP by economic activity (reference year 2017)</a> · Analysis: Centro de Estudios POPULI · Data as of: ') + PM.fecha(M.ultimo);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    // Al cambiar de trimestre o de medida, la opción se FUSIONA (no se reemplaza, como hace el molde al
    // redibujar): así ECharts conserva la serie y cada fila se desliza de su puesto viejo al nuevo.
    // (animation:true explícito: un redibujo quieto del molde —tema, ancho, fuentes— la dejó en false y la fusión la conservaría)
    function todo() {
      ordenar(); subtitulo(); cifras();
      var o = opciones(); o.animation = true;
      grafico.chart.setOption(o); PM.programarAlto(); panel(estado.fila);
    }

    var med = function () { return MED[estado.medida]; };
    function valor(k, i, m) { var s = D[(m || med()).serie][k]; return s ? s[i] : null; }
    function fmt(v, m) { return (m || med()).pp ? PM.pp(v, 2) : PM.pct(v, 1, true); }
    // el período que se compara: «T4 2025» o, acumulada, «T1–T4 2025»
    function per(i) { var p = PM.periodo(T[i]); return estado.medida === 'acum' && p.t > 1 ? tr('T1–T' + p.t + NB + p.a, 'Q1–Q' + p.t + NB + p.a) : PM.fecha(T[i]); }
    // el mismo trimestre del año anterior, buscado por FECHA
    function haceUnAnio(i) { return T.indexOf((+T[i].slice(0, 4) - 1) + T[i].slice(4)); }

    function ordenar() {
      var i = estado.t;
      filas = D.sectores.map(function (k) { return { k: k, v: valor(k, i) }; })
        .filter(function (x) { return x.v != null; })
        .sort(function (a, b) { return b.v - a.v; });
    }
    function pibDe(i, m) { return valor('pib', i, m); }

    function subtitulo() {
      var i = estado.t, m = estado.medida;
      document.getElementById('sub').textContent = (m === 'contrib'
        ? tr('Puntos porcentuales (pp) del crecimiento del PIB que aporta cada actividad en el ' + per(i) + ': a la derecha del cero suma, a la izquierda resta.',
          'Percentage points (pp) of GDP growth contributed by each activity in ' + per(i) + ': to the right of zero it adds, to the left it subtracts.')
        : tr('Cuánto cambió cada actividad en ' + (m === 'acum' ? per(i) + ' frente al mismo período' : 'el ' + per(i) + ' frente al mismo trimestre') +
          ' del año anterior (%): a la derecha del cero crece, a la izquierda cae.',
          'How much each activity changed in ' + per(i) + (m === 'acum' ? ' versus the same period' : ' versus the same quarter') +
          ' of the previous year (%): to the right of zero it grows, to the left it falls.')) + tr(' La raya vertical marca el PIB.', ' The vertical line marks GDP.');
    }

    function cifras() {
      var i = estado.t, pib = pibDe(i), pp = med().pp, alto = filas[0], bajo = filas[filas.length - 1];
      var caen = filas.filter(function (x) { return x.v < 0; }).length;
      // minilíneas: los 12 trimestres hasta el elegido
      var serie = function (f) { var out = []; for (var j = Math.max(0, i - 11); j <= i; j++) out.push(f(j)); return out; };
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: PIB, rotulo: tr('PIB · ' + per(i), 'GDP · ' + per(i)), valor: PM.pct(pib, 1, true), delta: pp ? tr('suma de los aportes', 'sum of the contributions') : (estado.medida === 'acum' ? tr('acumulada en el año', 'year-to-date') : tr('interanual', 'year-on-year')),
          tono: pib < 0 ? 'malo' : 'bueno', serie: serie(function (j) { return pibDe(j); }) }) +
        PM.kpi({ color: signo(alto.v), rotulo: pp ? tr('Mayor aporte', 'Largest contribution') : alto.v < 0 ? tr('Menor caída', 'Smallest fall') : tr('Mayor alza', 'Largest rise'), valor: fmt(alto.v), delta: NOM[alto.k],
          tono: alto.v >= 0 ? 'bueno' : 'malo', serie: serie(function (j) { return valor(alto.k, j); }) }) +
        PM.kpi({ color: signo(bajo.v), rotulo: pp ? tr('Mayor resta', 'Largest drag') : bajo.v > 0 ? tr('Menor alza', 'Smallest rise') : tr('Mayor caída', 'Largest fall'), valor: fmt(bajo.v), delta: NOM[bajo.k],
          tono: bajo.v < 0 ? 'malo' : 'bueno', serie: serie(function (j) { return valor(bajo.k, j); }) }) +
        PM.kpi({ color: C.rojo, rotulo: pp ? tr('Actividades que restan', 'Activities that subtract') : tr('Actividades en caída', 'Activities in decline'), valor: tr(caen + ' de ' + filas.length, caen + ' of ' + filas.length),
          delta: pp ? tr('restan ' + PM.pp(filas.reduce(function (z, x) { return z + (x.v < 0 ? x.v : 0); }, 0), 2), 'they subtract ' + PM.pp(filas.reduce(function (z, x) { return z + (x.v < 0 ? x.v : 0); }, 0), 2))
            : tr(filas.filter(function (x) { return x.v > pib; }).length + ' crecen más que el PIB', filas.filter(function (x) { return x.v > pib; }).length + ' grow faster than GDP'), tono: caen > filas.length / 2 ? 'malo' : 'neutro',
          serie: serie(function (j) { return D.sectores.filter(function (k) { var v = valor(k, j); return v != null && v < 0; }).length; }) });
    }

    var medidor;
    function ancho(t, fuente) { medidor = medidor || document.createElement('canvas').getContext('2d'); medidor.font = fuente; return medidor.measureText(t).width; }
    // en el teléfono, el nombre largo se acorta para no comerse el ancho de las barras
    var CORTO = { electricidad: tr('Electricidad', 'Electricity') };
    function nombre(k, chico) { return k === 'pib' ? tr('PIB', 'GDP') : chico && CORTO[k] ? CORTO[k] : NOM[k]; }
    var ITEMS = [], hover = null;   // ITEMS: el PIB y las 11 actividades, en el orden FIJO del INE
    // casillero del eje (0 = PIB, 1…11 = puesto) → índice en ITEMS
    function casillero(c) {
      if (c === 0) return 0;
      var f = filas[c - 1];
      return f ? 1 + D.sectores.indexOf(f.k) : null;
    }

    function opciones() {
      var el = document.getElementById('chart'), i = estado.t, pib = pibDe(i), chico = PM.pequeno(), dk = PM.dk(), pp = med().pp;
      var W = el.clientWidth, izq = chico ? 12 : 6, der = chico ? 12 : 8;
      var pz = dk ? '#8A9699' : '#5C6B70', tinta = PM.col(C.tinta), card = PM.var('--card') || '#ffffff';
      var fN = chico ? 11 : 12, fV = chico ? 10.5 : 11.5, fR = chico ? 9.5 : 10;
      var mono = PM.mono(), inter = PM.inter();
      var puesto = {}; filas.forEach(function (x, j) { puesto[x.k] = j + 1; });
      ITEMS = [{ k: 'pib', v: pib }].concat(D.sectores.map(function (k) { return { k: k, v: valor(k, i) }; }));
      // columna de nombres: medida con el nombre más ancho EN NEGRITA (el resaltado no debe empujar nada)
      var rankW = Math.ceil(ancho('11', '500 ' + fR + 'px ' + mono)) + 8;
      var nameW = Math.ceil(Math.max.apply(null, ITEMS.map(function (x) { return ancho(nombre(x.k, chico), '700 ' + fN + 'px ' + inter); })));
      var gut = rankW + nameW + 12, plotL = izq + gut, plotW = W - izq - der - gut;
      // Escala horizontal: el cero y todas las barras adentro, y lugar para que la cifra de cada barra entre
      // afuera de su extremo sin salirse del área de barras. Se despeja en unas vueltas (el lugar que necesita
      // una cifra en píxeles depende de la escala, y la escala del lugar reservado).
      var vals = ITEMS.map(function (x) { return x.v; }), lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals));
      // la cifra de cada fila: el PIB siempre en % (en la contribución es la suma de los aportes en pp, que es su variación)
      var cifra = function (x) { return x.k === 'pib' ? PM.pct(x.v, 1, true) : fmt(x.v); };
      var PAD = 3, GAP = 4, lw = function (x) { return ancho(cifra(x), '600 ' + fV + 'px ' + mono) + 2 * PAD; };
      var span = (hi - lo) || 1, k = plotW / span, pxL = 4, pxR = 4;
      for (var n = 0; n < 5; n++) {
        pxL = 4; pxR = 4;
        ITEMS.forEach(function (x) { var v = x.v; if (v < 0) pxL = Math.max(pxL, GAP + lw(x) - (v - lo) * k); else pxR = Math.max(pxR, GAP + lw(x) - (hi - v) * k); });
        k = (plotW - pxL - pxR) / span;
      }
      var X = function (v) { return plotL + pxL + (v - lo) * k; };
      var cero = X(0), xp = X(pib);
      var lineaCero = dk ? 'rgba(226,232,240,.55)' : 'rgba(0,18,25,.5)', filete = dk ? '#2A3A50' : '#E2DDD3';
      var colB = function (x) { return x.k === 'pib' ? tinta : PM.col(signo(x.v)); };
      var colT = function (x) { return x.k === 'pib' ? tinta : PM.tx(signo(x.v)); };
      return {
        animationDurationUpdate: 650, animationEasingUpdate: 'cubicInOut',
        grid: { left: izq, right: der, top: 4, bottom: 4, containLabel: false },
        // eje X oculto: el dibujo usa su propia escala (X), pero el eje cubre los valores para que el tooltip
        // pueda ubicar cada dato (showTip por índice)
        xAxis: { type: 'value', min: lo, max: hi, show: false },
        // doce casilleros: el 0 es el PIB y del 1 al 11 el puesto de cada actividad
        yAxis: { type: 'category', inverse: true, data: ITEMS.map(function (x, j) { return String(j); }),
          axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false }, splitLine: { show: false } },
        tooltip: PM.tooltip(function (ps) {
          if (!ps.length) return '';
          var x = ITEMS[ps[0].dataIndex];
          if (!x) return '';
          if (x.k === 'pib') return PM.ttTitulo(tr('PIB', 'GDP'), med().nombre + ' · ' + per(i)) + PM.ttFila(PIB, tr('PIB', 'GDP'), PM.pct(pib, 1, true), 'area') +
            PM.ttTotal(pp ? tr('Actividades que restan', 'Activities that subtract') : tr('Actividades en caída', 'Activities in decline'), tr(filas.filter(function (f) { return f.v < 0; }).length + ' de ' + filas.length, filas.filter(function (f) { return f.v < 0; }).length + ' of ' + filas.length));
          panel(x.k);
          var h = PM.ttTitulo(NOM[x.k], med().nombre + ' · ' + per(i));
          // en la contribución, la actividad se lee con su variación y su peso (la resta contra el PIB no tiene sentido: pp contra %)
          if (pp) return h + PM.ttFila(signo(x.v), tr('Aporte', 'Contribution'), fmt(x.v), 'area') + PM.ttFila(null, tr('Variación interanual', 'Year-on-year change'), PM.pct(D.var[x.k][i], 1, true)) +
            PM.ttFila(null, tr('Peso en el PIB', 'Share of GDP'), PM.pct(D.estructura[x.k][i], 1)) + PM.ttTotal(tr('PIB', 'GDP'), PM.pct(pib, 1, true));
          return h + PM.ttFila(signo(x.v), NOM[x.k], fmt(x.v), 'area') + PM.ttFila(PIB, tr('PIB', 'GDP'), PM.pct(pib, 1, true), 'area') +
            PM.ttTotal(tr('Diferencia', 'Difference'), PM.pp(x.v - pib, 1));
        }, { axisPointer: { type: 'shadow', shadowStyle: { color: dk ? 'rgba(226,232,240,.07)' : 'rgba(0,18,25,.05)' } } }),
        series: [{
          type: 'custom', id: 'ranking', name: med().nombre, coordinateSystem: 'cartesian2d',
          encode: { x: 0, y: 1, tooltip: 0 }, emphasis: { focus: 'none' },
          // cada dato lleva el id de su actividad: sin él ECharts toma como nombre (y clave para animar) el
          // casillero del eje de categorías, y al reordenar actualizaba cada casillero en su lugar en vez de
          // mover la fila de la actividad
          data: ITEMS.map(function (x) { return { id: x.k, value: [x.v, x.k === 'pib' ? 0 : puesto[x.k]] }; }),
          renderItem: function (params, api) {
            // Cada fila es un grupo ubicado en la altura de su puesto (y = centro de la fila) con sus piezas en
            // coordenadas relativas: al cambiar el puesto, ECharts anima la «y» del grupo y la fila entera
            // (barra, cifra, nombre y puesto) se desliza junta. Con las piezas en coordenadas absolutas, los
            // textos saltaban al lugar nuevo mientras las barras viajaban.
            var x = ITEMS[params.dataIndex], cs = params.coordSys, cy = api.coord([0, api.value(1)])[1], rh = api.size([0, 1])[1];
            var bh = Math.round(Math.min(20, rh * 0.6)), x1 = X(x.v), neg = x.v < 0, esPib = x.k === 'pib';
            var hijos = [
              // la barra, desde el cero
              { type: 'rect', z2: 2, shape: { x: Math.min(cero, x1), y: -bh / 2, width: Math.max(1, Math.abs(x1 - cero)), height: bh }, style: { fill: colB(x) } },
              // la cifra en el extremo, afuera, con fondo de la tarjeta: ninguna raya la cruza
              { type: 'text', z2: 5, x: neg ? x1 - GAP : x1 + GAP, y: 0, transition: ['x'],
                style: { text: cifra(x), fontFamily: mono, fontSize: fV, fontWeight: 600, fill: colT(x), align: neg ? 'right' : 'left', verticalAlign: 'middle',
                  backgroundColor: card, padding: [1, PAD] } },
              // el nombre, alineado a la derecha y pegado al área de barras; en negrita bajo el cursor
              { type: 'text', z2: 5, x: plotL - 12, y: 0,
                style: { text: nombre(x.k, chico), fontFamily: inter, fontSize: fN, fontWeight: esPib ? 700 : 500, fill: tinta, align: 'right', verticalAlign: 'middle' },
                emphasis: { style: { fontWeight: 700 } } }
            ];
            if (!esPib) hijos.push({ type: 'text', z2: 5, x: cs.x, y: 0,
              style: { text: String(puesto[x.k]), fontFamily: mono, fontSize: fR, fontWeight: 500, fill: pz, align: 'left', verticalAlign: 'middle' } });
            else {
              var abajo = rh / 2, fin = cs.y + cs.height - cy;
              // el filete bajo el PIB, la línea del cero y la raya del PIB (por detrás de las barras de las actividades)
              hijos.push({ type: 'line', z2: 1, silent: true, shape: { x1: cs.x, y1: abajo, x2: cs.x + cs.width, y2: abajo }, style: { stroke: filete, lineWidth: 1 } });
              hijos.push({ type: 'line', z2: 1, silent: true, shape: { x1: cero, y1: cs.y + 2 - cy, x2: cero, y2: fin - 2 }, style: { stroke: lineaCero, lineWidth: 1 } });
              hijos.push({ type: 'line', z2: 0, silent: true, shape: { x1: xp, y1: abajo + 3, x2: xp, y2: fin - 2 }, style: { stroke: pz, lineWidth: 1.25, lineDash: [4, 3], opacity: 0.8 } });
            }
            return { type: 'group', y: cy, transition: ['y'], children: hijos };
          }
        }]
      };
    }

    // Umbrales de la lectura: con 8 o más de las 11 actividades en caída la caída es «extendida»; con 3 o
    // menos, «la mayoría crece»; en el medio, «dividida». En la contribución: un rubro «concentra» si explica
    // el 40% o más de lo que restaron (o sumaron) todos juntos.
    var EXTENDIDA = 8, POCAS = 3, CONCENTRA = 0.4;
    function lectura(i) {
      var pib = pibDe(i), n = filas.length, caen = filas.filter(function (x) { return x.v < 0; }).length;
      var alto = filas[0], bajo = filas[n - 1], t;
      if (med().pp) {
        var imp = valor('impuestos', i), todos = filas.concat([{ k: 'impuestos', v: imp }]);
        var neg = todos.filter(function (x) { return x.v < 0; }).sort(function (a, b) { return a.v - b.v; });
        var pos = todos.filter(function (x) { return x.v > 0; }).sort(function (a, b) { return b.v - a.v; });
        var s = function (a) { return a.reduce(function (z, x) { return z + x.v; }, 0); }, sN = s(neg), sP = s(pos);
        var lado = pib < 0 ? neg : pos, tot = pib < 0 ? sN : sP;
        t = tr('El PIB ' + (pib < 0 ? 'cae' : 'crece') + ' <strong>' + PM.pct(Math.abs(pib), 1) + '</strong>: sumaron ' + PM.pp(sP, 2) + ' y restaron ' + PM.pp(sN, 2) + '. ',
          'GDP ' + (pib < 0 ? 'falls' : 'grows') + ' <strong>' + PM.pct(Math.abs(pib), 1) + '</strong>: ' + PM.pp(sP, 2) + ' was added and ' + PM.pp(sN, 2) + ' subtracted. ');
        t += lado.length && lado[0].v / tot >= CONCENTRA
          ? tr('Lo concentra sobre todo <strong>' + NOM[lado[0].k] + '</strong>, con ' + PM.pct(lado[0].v / tot * 100, 0) + ' de lo que ' + (pib < 0 ? 'restó.' : 'sumó.'),
            'It is concentrated above all in <strong>' + NOM[lado[0].k] + '</strong>, with ' + PM.pct(lado[0].v / tot * 100, 0) + ' of what was ' + (pib < 0 ? 'subtracted.' : 'added.'))
          : tr('Ningún rubro concentra el 40% o más de lo que ' + (pib < 0 ? 'restó.' : 'sumó.'), 'No single item accounts for 40% or more of what was ' + (pib < 0 ? 'subtracted.' : 'added.'));
        return t + tr(' Los impuestos, fuera del ranking, aportaron ' + PM.pp(imp, 2) + '.', ' Taxes, outside the ranking, contributed ' + PM.pp(imp, 2) + '.');
      }
      if (caen >= EXTENDIDA) t = tr('La caída es <strong>extendida</strong>: ' + caen + ' de ' + n + ' actividades retroceden.', 'The decline is <strong>widespread</strong>: ' + caen + ' of ' + n + ' activities are contracting.');
      else if (caen === 0) t = tr('<strong>Las ' + n + ' actividades crecen</strong>.', '<strong>All ' + n + ' activities are growing</strong>.');
      else if (caen <= POCAS) t = tr('<strong>La mayoría crece</strong>: sólo ' + caen + ' de ' + n + ' actividades retroceden.', '<strong>Most are growing</strong>: only ' + caen + ' of ' + n + ' activities are contracting.');
      else t = tr('La economía está <strong>dividida</strong>: ' + (n - caen) + ' actividades crecen y ' + caen + ' caen.', 'The economy is <strong>split</strong>: ' + (n - caen) + ' activities are growing and ' + caen + ' are falling.');
      return t + tr(' Entre <strong>' + NOM[alto.k] + '</strong> (' + fmt(alto.v) + ') y <strong>' + NOM[bajo.k] + '</strong> (' + fmt(bajo.v) + ') hay ' +
        PM.num(alto.v - bajo.v, 1) + NB + 'pp de distancia; ' + filas.filter(function (x) { return x.v > pib; }).length + ' actividades superan al PIB (' + PM.pct(pib, 1, true) + ').',
        ' Between <strong>' + NOM[alto.k] + '</strong> (' + fmt(alto.v) + ') and <strong>' + NOM[bajo.k] + '</strong> (' + fmt(bajo.v) + ') there is a gap of ' +
        PM.num(alto.v - bajo.v, 1) + NB + 'pp; ' + filas.filter(function (x) { return x.v > pib; }).length + ' activities outpace GDP (' + PM.pct(pib, 1, true) + ').');
    }

    function panel(k) {
      if (!k || !D) return;
      estado.fila = k;
      var i = estado.t, pib = pibDe(i), x = filas.filter(function (f) { return f.k === k; })[0];
      if (!x) return;
      var r = filas.indexOf(x) + 1, a = haceUnAnio(i), antes = a >= 0 ? valor(k, a) : null;
      var peso = D.estructura[k][i], aporte = D.contrib[k][i], vi = D.var[k][i];
      var desc = tr('Puesto <strong>' + r + ' de ' + filas.length + '</strong>. ' + (med().pp
        ? (vi >= 0 ? 'Creció ' : 'Cayó ') + PM.pct(Math.abs(vi), 1) + ' interanual y pesa ' + PM.pct(peso, 1) + ' del PIB a precios corrientes.'
        : 'Diferencia con el PIB: <strong>' + PM.pp(x.v - pib, 1) + '</strong>. Pesa ' + PM.pct(peso, 1) + ' del PIB y aportó ' + PM.pp(aporte, 2) + ' a su variación interanual.') +
        (antes != null ? ' Un año antes: ' + fmt(antes) + '.' : ''),
        'Ranked <strong>' + r + ' of ' + filas.length + '</strong>. ' + (med().pp
        ? (vi >= 0 ? 'It grew ' : 'It fell ') + PM.pct(Math.abs(vi), 1) + ' year-on-year and accounts for ' + PM.pct(peso, 1) + ' of GDP at current prices.'
        : 'Difference from GDP: <strong>' + PM.pp(x.v - pib, 1) + '</strong>. It accounts for ' + PM.pct(peso, 1) + ' of GDP and contributed ' + PM.pp(aporte, 2) + ' to its year-on-year change.') +
        (antes != null ? ' A year earlier: ' + fmt(antes) + '.' : ''));
      document.getElementById('panel-fecha').textContent = per(i);
      document.getElementById('panel').innerHTML =
        PM.pb(PIB, tr('PIB', 'GDP'), PM.pct(pib, 1, true), med().pp ? tr('Variación interanual: la suma de los aportes de las 11 actividades y de los impuestos.', 'Year-on-year change: the sum of the contributions of the 11 activities and of taxes.') : tr('Variación ' + (estado.medida === 'acum' ? 'acumulada en el año, ' : 'interanual del ') + per(i) + '.', (estado.medida === 'acum' ? 'Year-to-date change, ' : 'Year-on-year change in ') + per(i) + '.')) +
        PM.pb(signo(x.v), NOM[k], fmt(x.v), (LARGO[k] !== NOM[k] ? '<span style="display:block">' + LARGO[k] + '.</span>' : '') + desc) +
        PM.ctx(lectura(i));
    }

    // Imagen y CSV: el eje de categorías son las actividades, no el tiempo
    PM.leyendaImagen = function () {
      var pp = med().pp;
      return [{ name: pp ? tr('Suma', 'Adds') : tr('Crece', 'Growing'), color: PM.col(ARRIBA), forma: 'area' }, { name: pp ? tr('Resta', 'Subtracts') : tr('Cae', 'Falling'), color: PM.col(ABAJO), forma: 'area' },
              { name: tr('PIB: ' + PM.pct(pibDe(estado.t), 1, true), 'GDP: ' + PM.pct(pibDe(estado.t), 1, true)), color: PM.dk() ? '#8A9699' : '#5C6B70', forma: 'punteada' }];
    };
    PM.tablaDatos = function () {
      var i = estado.t, fila = function (k) {
        return [NOM[k], T[i], D.var[k][i], D.var_acum[k][i], D.contrib[k][i], D.estructura[k][i]];
      };
      return { cols: [tr('Actividad', 'Activity'), tr('Trimestre', 'Quarter'), tr('Variación interanual (%)', 'Year-on-year change (%)'), tr('Variación acumulada en el año (%)', 'Year-to-date change (%)'), tr('Contribución interanual (pp)', 'Year-on-year contribution (pp)'), tr('Peso en el PIB a precios corrientes (%)', 'Share of GDP at current prices (%)')],
        filas: filas.map(function (x) { return fila(x.k); }).concat([fila('impuestos'), fila('pib')]) };
    };

    function preguntas() {
      return [
        [tr('¿Qué muestra el ranking?', 'What does the ranking show?'), tr('Las <strong>11 actividades</strong> en que el INE divide el PIB, ordenadas de la que más crece a la que más cae en el trimestre elegido. La primera fila es el PIB y su raya vertical baja por detrás de las barras: las actividades cuya barra termina a su derecha crecen más que la economía en su conjunto.',
          'The <strong>11 activities</strong> into which the INE divides GDP, sorted from the fastest-growing to the steepest-falling in the chosen quarter. The first row is GDP and its vertical line runs down behind the bars: the activities whose bar ends to its right are growing faster than the economy as a whole.')],
        [tr('¿Por qué las actividades no suman el PIB?', 'Why don’t the activities add up to GDP?'), tr('Las variaciones se calculan sobre <strong>medidas de volumen encadenadas</strong> (referencia 2017), que el INE advierte que <strong>no son aditivas</strong>: la suma de las actividades no iguala el PIB. Para ver cuánto pesa cada una en el resultado está la <strong>contribución</strong>, que sí suma: las 11 actividades y los impuestos dan la variación del PIB.',
          'The changes are calculated on <strong>chained volume measures</strong> (reference year 2017), which the INE warns <strong>are not additive</strong>: the sum of the activities does not equal GDP. To see how much each one weighs in the result there is the <strong>contribution</strong>, which does add up: the 11 activities and taxes give the change in GDP.')],
        [tr('Interanual, acumulada y contribución', 'Year-on-year, year-to-date and contribution'), tr('<strong>Interanual</strong>: el trimestre frente al mismo trimestre del año anterior. <strong>Acumulada</strong>: lo que va del año frente al mismo período del año anterior (en el cuarto trimestre es el crecimiento del año). <strong>Contribución</strong>: cuántos puntos porcentuales del cambio del PIB corresponden a cada actividad, según lo que crece y lo que pesa.',
          '<strong>Year-on-year</strong>: the quarter versus the same quarter of the previous year. <strong>Year-to-date</strong>: the year so far versus the same period of the previous year (in the fourth quarter it is the growth for the year). <strong>Contribution</strong>: how many percentage points of the change in GDP correspond to each activity, according to how much it grows and how much it weighs.')],
        [tr('¿Qué es una contribución en puntos porcentuales?', 'What is a contribution in percentage points?'), tr('Es la variación de una actividad multiplicada por su peso en el PIB del año anterior. Por eso una actividad chica que crece mucho (o cae mucho) pesa menos en la cuenta del PIB que una grande que cambia poco.',
          'It is the change in an activity multiplied by its share of the previous year’s GDP. That is why a small activity that grows a lot (or falls a lot) weighs less in the GDP arithmetic than a large one that changes little.')],
        [tr('La contribución no explica causas', 'Contribution does not explain causes'), tr('<p>La contribución reparte el cambio del PIB entre las actividades según su peso: es aritmética de una <strong>identidad contable</strong> (el PIB es la suma del valor agregado de las actividades más los impuestos) y se cumple siempre. Dice dónde se registró el cambio, no por qué ocurrió.</p>' +
          '<p>Que una actividad «reste» puntos no muestra la causa: la misma causa —un problema de combustible, de divisas o de demanda— mueve a varias actividades a la vez, y una arrastra a otras (el transporte y el comercio viven de lo que se produce). Para explicar hay que identificar qué cambió y seguir la cadena preguntando «¿y después qué?». Lo explica Brian Albrecht en <a href="https://www.economicforces.xyz/p/never-reason-from-an-accounting-identity-c4f" target="_blank" rel="noopener">«Never Reason from an Accounting Identity»</a> (Economic Forces, 2026).</p>',
          '<p>The contribution splits the change in GDP among the activities according to their weight: it is the arithmetic of an <strong>accounting identity</strong> (GDP is the sum of the value added of the activities plus taxes) and it always holds. It says where the change was recorded, not why it happened.</p>' +
          '<p>That an activity “subtracts” points does not reveal the cause: the same cause—a fuel, foreign exchange or demand problem—moves several activities at once, and one drags others along (transport and commerce live off what is produced). To explain, one has to identify what changed and follow the chain by asking “and then what?”. Brian Albrecht explains it in <a href="https://www.economicforces.xyz/p/never-reason-from-an-accounting-identity-c4f" target="_blank" rel="noopener">“Never Reason from an Accounting Identity”</a> (Economic Forces, 2026).</p>')],
        [tr('Los colores', 'The colors'), tr('<strong>Turquesa</strong>: la actividad crece (o, en la contribución, suma al PIB). <strong>Rojo</strong>: cae (o resta). El PIB va en tinta, en la primera fila. Es el mismo código de los paneles de actividad.',
          '<strong>Turquoise</strong>: the activity is growing (or, in the contribution view, adds to GDP). <strong>Red</strong>: it is falling (or subtracts). GDP is shown in ink, in the first row. It is the same code as in the activity panels.')],
        [tr('¿Son cifras definitivas?', 'Are these final figures?'), tr('No. El INE publica el PIB trimestral como <strong>cifras preliminares</strong>, sujetas a revisión: un trimestre puede cambiar en publicaciones posteriores.',
          'No. The INE publishes quarterly GDP as <strong>preliminary figures</strong>, subject to revision: a quarter may change in later releases.')]
      ];
    }
  })();
  </script>
</body>
</html>
