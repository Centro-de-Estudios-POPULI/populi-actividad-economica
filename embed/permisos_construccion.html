<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Building Permits · Populi">Permisos de Construcción · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <script src="ind_mensual.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title" data-en='<span class="accent-bar"></span>Building Permits'><span class="accent-bar"></span>Permisos de Construcción</div>
      <div class="sec-sub" id="sub" data-en="Permits registered per month, one year per line">Permisos registrados por mes, un año por línea</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl" data-en="Series">Serie</span><div class="hz-grp" id="b-serie"></div></div>
      <div class="hz-item"><span class="hz-lbl" data-en="View">Vista</span><div class="hz-grp" id="b-vista"></div></div>
      <div class="hz-item"><span class="hz-lbl" data-en="Measure">Medida</span><div class="hz-grp" id="b-extra"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span data-en="Loading building permits…">Cargando permisos de construcción…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t" data-en="Reading the indicator">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  var T = PM.t;   // T('castellano', 'inglés'): con ?lang=en el gráfico sale en inglés
  IND.armar({
    archivo: 'ind_permisos.json',
    tipo: 'flujo',
    umbrales: [5, 15],
    fuente: T('INE — Permisos de construcción', 'INE (National Statistics Institute) — Building permits'),
    series: [
      { k: 'numero', unidad: 'permisos', boton: T('Permisos', 'Permits'), corto: T('Permisos', 'Permits'), mide: T('Permisos de construcción registrados', 'Building permits registered'), acum: T('se registraron {v} de construcción', '{v} for construction were registered') },
      { k: 'superficie', unidad: 'm2', boton: T('Superficie', 'Floor area'), corto: T('Superficie', 'Floor area'), mide: T('Metros cuadrados autorizados para construir', 'Square meters authorized for construction'), acum: T('los permisos autorizaron {v}', 'the permits authorized {v}') }
    ],
    preguntas: function (A) {
      // qué parte de los permisos del año son obra nueva (aprobación de planos): sale del dato
      var D = A.D, f = A.fin(), tot = 0, apr = 0;
      D.meses.forEach(function (k, i) {
        if (+k.slice(0, 4) !== f.y || D.series.numero[i] == null) return;
        tot += D.series.numero[i]; apr += D.series.numero_aprobacion[i] || 0;
      });
      var cuota = tot ? PM.pct(apr / tot * 100, 0) : null;
      return [
        [T('¿Qué mide?', 'What does it measure?'), T('<p>Los <strong>permisos de construcción</strong> que registran los gobiernos municipales cada mes y la <strong>superficie</strong> que autorizan, en metros cuadrados.</p>' +
          '<p>Incluye obras residenciales (vivienda) y no residenciales (comercios, oficinas, fábricas, escuelas) y todos los trámites: aprobación de planos (obra nueva, ampliaciones, remodelaciones), legalización y regularización de obras ya hechas, y otros.</p>',
          '<p>The <strong>building permits</strong> registered by municipal governments each month and the <strong>floor area</strong> they authorize, in square meters.</p>' +
          '<p>It includes residential (housing) and non-residential works (shops, offices, factories, schools) and all types of procedures: approval of plans (new construction, extensions, remodeling), legalization and regularization of works already built, and others.</p>')],
        [T('¿Por qué adelanta al PIB?', 'Why is it a leading indicator of GDP?'), T('El permiso se pide <strong>antes</strong> de construir: la superficie autorizada hoy es obra que se levantará en los meses siguientes. Por eso anticipa la actividad de la <strong>construcción</strong> y la demanda de cemento, fierro y mano de obra. La superficie dice más que el número: un edificio y una ampliación cuentan igual como permiso.',
          'A permit is requested <strong>before</strong> building: the floor area authorized today is work that will go up in the following months. That is why it anticipates activity in <strong>construction</strong> and the demand for cement, steel and labor. Floor area says more than the number: a building and an extension count the same as a permit.')],
        [T('¿Qué ciudades cubre?', 'Which cities does it cover?'), T('No es todo el país. Reportan las ciudades capitales Sucre, Oruro, Potosí, Tarija, Trinidad y Cobija, y las conurbaciones de La Paz (con El Alto, Achocalla, Mecapaca, Viacha y Palca), Cochabamba (con Quillacollo, Sacaba, Colcapirhua, Sipe Sipe, Punata, Vinto y Tiquipaya) y Santa Cruz (con Montero, La Guardia, Warnes, Porongo, Cotoca y El Torno).',
          'It is not the whole country. The reporting areas are the capital cities Sucre, Oruro, Potosí, Tarija, Trinidad and Cobija, and the metropolitan areas of La Paz (with El Alto, Achocalla, Mecapaca, Viacha and Palca), Cochabamba (with Quillacollo, Sacaba, Colcapirhua, Sipe Sipe, Punata, Vinto and Tiquipaya) and Santa Cruz (with Montero, La Guardia, Warnes, Porongo, Cotoca and El Torno).')],
        [T('Notas del INE', 'INE notes'), T('Una parte de los permisos <strong>legaliza obras ya construidas</strong>: esa parte no adelanta obra nueva. ' +
          (cuota ? 'En ' + f.y + ', el ' + cuota + ' de los permisos fueron aprobaciones de planos (la parte que mira hacia adelante). ' : '') +
          'Las cifras ' + (A.prelim ? 'de ' + A.prelim + ' en adelante ' : '') + 'son <strong>preliminares</strong> (p): los municipios pueden completar sus registros y el INE revisarlas.',
          'Some of the permits <strong>legalize works already built</strong>: that part does not anticipate new construction. ' +
          (cuota ? 'In ' + f.y + ', ' + cuota + ' of the permits were approvals of plans (the forward-looking part). ' : '') +
          'The figures ' + (A.prelim ? 'from ' + A.prelim + ' onward ' : '') + 'are <strong>preliminary</strong> (p): municipalities may complete their records and the INE may revise them.')]
      ];
    }
  });
  </script>
</body>
</html>
