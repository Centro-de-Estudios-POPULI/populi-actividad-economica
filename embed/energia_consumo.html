<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consumo de Energía Eléctrica · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <script src="ind_mensual.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Consumo de Energía Eléctrica</div>
      <div class="sec-sub" id="sub">Índice de volumen del consumo (2017 = 100), un año por línea</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Categoría</span><div class="hz-grp" id="b-serie"></div></div>
      <div class="hz-item"><span class="hz-lbl">Vista</span><div class="hz-grp" id="b-vista"></div></div>
      <div class="hz-item"><span class="hz-lbl">Medida</span><div class="hz-grp" id="b-extra"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando consumo de energía eléctrica…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  IND.armar({
    archivo: 'ind_energia.json',
    tipo: 'indice',
    unidad: 'indice',
    umbrales: [1, 4],
    fuente: 'INE — Índice de consumo de energía eléctrica',
    series: [
      { k: 'general', boton: 'Total', corto: 'Índice general', mide: 'Consumo de electricidad (índice: 100 = promedio de 2017)', acum: 'el consumo promedió {v}' },
      { k: 'domestico', boton: 'Hogares', corto: 'Hogares', mide: 'Consumo de electricidad de los hogares (índice: 100 = promedio de 2017)', acum: 'el consumo de los hogares promedió {v}' },
      { k: 'comercial', boton: 'Comercio', corto: 'Comercio y servicios', mide: 'Consumo de electricidad de comercio y servicios (índice: 100 = promedio de 2017)', acum: 'el consumo de comercio y servicios promedió {v}' },
      { k: 'industria', boton: 'Industria', corto: 'Industria', mide: 'Consumo de electricidad de la industria (índice: 100 = promedio de 2017)', acum: 'el consumo de la industria promedió {v}' },
      { k: 'mineria', boton: 'Minería', corto: 'Minería', mide: 'Consumo de electricidad de la minería (índice: 100 = promedio de 2017)', acum: 'el consumo de la minería promedió {v}' }
    ],
    preguntas: function (A) {
      return [
        ['¿Qué mide?', '<p>El <strong>volumen de electricidad</strong> que consumen los usuarios del sistema, expresado como índice: el promedio de 2017 vale 100, así que 120 es 20% más consumo que en 2017.</p>' +
          '<p>Las categorías: <strong>Doméstico</strong> (hogares), <strong>General</strong> (comercio, servicios y entidades sin fines de lucro de mediana demanda), <strong>Industria</strong>, <strong>Minería</strong>, alumbrado público y otros (riego, servicios temporales, caminos). Los grandes consumidores no regulados se suman a la categoría de su actividad.</p>'],
        ['¿Por qué adelanta al PIB?', 'La electricidad acompaña casi toda la producción y no se almacena: lo que se consume en el mes es actividad de ese mes. El consumo de la <strong>industria</strong> y de la <strong>minería</strong> sigue de cerca a esos sectores del PIB; el de comercio y servicios, al sector terciario. Y se publica meses antes que el PIB trimestral.'],
        ['¿Por qué ver cada categoría?', 'El índice general mezcla hogares y empresas. Cuando los hogares consumen más (por ejemplo, por el calor) el total puede subir aunque las fábricas consuman menos: la categoría <strong>Industria</strong> es la que mejor muestra la actividad productiva.'],
        ['Notas del INE', 'Índice de volumen con año de referencia 2017 (base móvil), elaborado con datos de la Autoridad de Fiscalización de Electricidad y Tecnología Nuclear (AETN). Las cifras ' + (A.prelim ? 'de ' + A.prelim + ' en adelante ' : '') + 'son <strong>preliminares</strong> (p). Las variaciones de este gráfico se calculan desde el índice publicado.']
      ];
    }
  });
  </script>
</body>
</html>
