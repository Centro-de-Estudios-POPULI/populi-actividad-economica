<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="GDP activities against their starting point · Populi">Actividades del PIB frente a su punto de partida · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <style>
    /* Ranking del trimestre en el panel de lectura: barras que salen de la base (100 o 0) hacia cada lado */
    .rk { margin: 4px 0 10px; }
    .rk-t { font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
    .rk-f { display: grid; grid-template-columns: minmax(0, 1fr) 38% 3.9rem; align-items: center; gap: 8px; padding: 2px 4px; }
    .rk-f.pib { border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 3px; }
    .rk-f.sel { background: var(--suave); box-shadow: inset 2px 0 0 var(--acento); }
    .rk-n { font-size: .68rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rk-f.pib .rk-n { font-weight: 700; color: var(--tinta); }
    .rk-b { position: relative; height: 9px; }
    .rk-b::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--tenue); }
    .rk-b i { position: absolute; top: 0; bottom: 0; }
    .rk-v { font: 600 .68rem/1.3 'JetBrains Mono', monospace; text-align: right; white-space: nowrap; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title" data-en='<span class="accent-bar"></span>Each activity against its starting point'><span class="accent-bar"></span>Cada actividad frente a su punto de partida</div>
      <div class="sec-sub" id="sub" data-en="Volume of the last four quarters of each activity versus the base year (= 100)">Volumen de los últimos cuatro trimestres de cada actividad frente al año base (= 100)</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl" data-en="Measure">Medida</span><div class="hz-grp" id="b-medida"></div></div>
      <div class="hz-item" id="it-base"><span class="hz-lbl" data-en="Base year">Año base</span><div class="hz-grp" id="b-base"></div></div>
      <div class="hz-item"><span class="hz-lbl" data-en="Scale">Escala</span><div class="hz-grp" id="b-escala"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span data-en="Loading GDP activities…">Cargando las actividades del PIB…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t" data-en="Reading the indicator">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    var tr = PM.t;   // tr('castellano', 'inglés'): con ?lang=en el gráfico sale en inglés (acá T son los trimestres)
    // ── Nombres de los datos en inglés (actividades del INE): UN solo diccionario, idéntico en los cuatro gráficos
    // sectoriales del PIB. Las claves son los nombres exactos de data/pib_actividad.json (nombre, nombre_largo y los
    // grandes sectores). N() se aplica sólo donde el nombre se MUESTRA; los datos se buscan siempre por su clave (k). ──
    var EN = {
      'PIB': 'GDP',
      'Producto interno bruto (a precios de mercado)': 'Gross domestic product (at market prices)',
      'Impuestos': 'Taxes',
      'Derechos sobre importaciones, IVA no deducible, IT y otros impuestos indirectos': 'Import duties, non-deductible VAT, transactions tax (IT) and other indirect taxes',
      'VAB': 'GVA',
      'Valor agregado bruto': 'Gross value added',
      'Agropecuaria': 'Agriculture',
      'Agricultura, ganadería, silvicultura y pesca': 'Agriculture, livestock, forestry and fishing',
      'Extractiva': 'Extractive industries',
      'Actividad extractiva (hidrocarburos y minería)': 'Extractive activity (hydrocarbons and mining)',
      'Manufactura': 'Manufacturing',
      'Industrias manufactureras': 'Manufacturing industries',
      'Electricidad y agua': 'Electricity and water',
      'Suministro de electricidad, gas, agua y recolección de desechos': 'Electricity, gas and water supply and waste collection',
      'Construcción': 'Construction',
      'Comercio': 'Commerce',
      'Transporte': 'Transport',
      'Transporte y comunicaciones': 'Transport and communications',
      'Alojamiento': 'Accommodation',
      'Actividades de alojamiento y servicio de comidas': 'Accommodation and food service activities',
      'Financieras': 'Financial services',
      'Actividades financieras y de seguros, inmobiliarias y servicios a las empresas': 'Financial and insurance activities, real estate and business services',
      'Adm. pública': 'Public admin.',
      'Administración pública, salud y educación de no mercado': 'Public administration, non-market health and education',
      'Comunales': 'Community services',
      'Actividades comunales, sociales y personales': 'Community, social and personal activities',
      'Primario': 'Primary',
      'Secundario': 'Secondary',
      'Terciario': 'Tertiary'
    };
    var N = function (s) { return PM.en && EN[s] != null ? EN[s] : s; };
    // ── Colores de las actividades: UN solo mapa, idéntico en los cuatro gráficos sectoriales del PIB ──
    // Por familia de gran sector: primario en oro, secundario en rojo, terciario en turquesa/petróleo y
    // tierra; la administración pública (no de mercado) y los impuestos en gris. Las actividades grandes
    // conservan su tono en los dos temas; en el oscuro sólo suben de paso los tonos hondos (manufactura,
    // transporte) y la electricidad, la más chica, toma el tinte rojo. Validado con el script de la marca,
    // vecinos de la pila en el orden del INE: ΔE ≥ 15,3 en visión normal y ≥ 9,9 con daltonismo en los
    // dos temas. Son colores de RELLENO; una cifra en ese color pasa por PM.tx (≥ 3:1 contra el fondo).
    var COLOR = {
      agro: '#EE9B00', extractiva: '#A86E00',
      manufactura: { claro: '#8B1A1A', oscuro: '#E8706B' }, electricidad: { claro: '#E8706B', oscuro: '#F8E5E3' },
      construccion: '#C71E1D',
      comercio: '#0A9396', transporte: { claro: '#005F73', oscuro: '#D9EAE6' },
      alojamiento: '#E57D22', financieras: '#94D2BD',
      administracion: { claro: '#8A9699', oscuro: '#6E7A7D' }, comunales: '#DF5D25',
      impuestos: { claro: '#C9CDCE', oscuro: '#3A4549' },
      primario: '#EE9B00', secundario: '#C71E1D', terciario: '#0A9396', pib: '#001219'
    };
    // El lenguaje de los paneles es el de la lámina «Cada actividad contra su punto de partida» del deck
    // RIPoM y de los paneles del blog: la línea en TINTA, el relleno por signo contra la base (turquesa
    // arriba, rojo abajo, con el cruce interpolado), el PIB gris punteado y la cifra grande bajo el nombre.
    // Acá los colores de sector no se usan en el dibujo: el color dice arriba o abajo de la base.
    var ARRIBA = { claro: '#0A9396', oscuro: '#94D2BD' }, ABAJO = { claro: '#C71E1D', oscuro: '#E8706B' };
    var PIB = COLOR.pib, NB = ' ', BASES = ['2017', '2019', null];   // la tercera: el último año completo antes del dato más reciente
    // Medidas. Todas salen del NIVEL encadenado (cada actividad se compara sólo consigo misma, que es lo
    // que el encadenado permite). La suma de cuatro trimestres quita la estacionalidad.
    var MED = {
      nivel: { nombre: tr('Nivel', 'Level'), ref: 100, pct: false },
      crec: { nombre: tr('Crecimiento (4 trimestres)', 'Growth (4 quarters)'), ref: 0, pct: true },
      ia: { nombre: tr('Interanual del trimestre', 'Year-on-year for the quarter'), ref: 0, pct: true }
    };
    var estado = { medida: 'nivel', base: '2019', escala: 'propia', idx: null, k: null };
    var D, M, T, X, NOM = {}, S = {}, ORDEN = [], I = [], grafico, geo = [], hoverG = null;
    // la pastilla de «Comparar con el PIB» es UNA sola: el molde no deja apagar la última pastilla
    // encendida, así que el conjunto lleva una clave fija que no tiene pastilla
    var activas = new Set(['pib', '_fija']);
    PM.imagen = { proporcion: 1 };   // doce paneles: la imagen cuadrada les da alto

    PM.cargar(['pib_actividad.json']).then(function (r) {
      D = r[0]; M = D.metadata; T = D.trimestres;
      BASES[2] = String(+T[T.length - 1].slice(0, 4) - 1);   // 2024 con T4 2025; 2025 con T2 2026
      D.rubros.forEach(function (x) { NOM[x.k] = N(x.nombre); });
      // cada trimestre en el eje X como año decimal: «2025-T4» → 2025,75 (permite el cruce interpolado)
      X = T.map(function (t) { var p = PM.periodo(t); return p.a + (p.t - 1) / 4; });
      var bases = BASES.filter(function (a) { return T.filter(function (t) { return t.slice(0, 4) === a; }).length === 4; });
      if (bases.indexOf(estado.base) < 0) estado.base = bases[0];
      estado.idx = T.length - 1;
      PM.botonera(document.getElementById('b-medida'), [['nivel', tr('Nivel (año base = 100)', 'Level (base year = 100)')], ['crec', tr('Crecimiento', 'Growth')], ['ia', tr('Interanual', 'Year-on-year')]],
        estado.medida, function (v) { estado.medida = v; todo(); });
      PM.botonera(document.getElementById('b-base'), bases.map(function (a) { return [a, a]; }),
        estado.base, function (v) { estado.base = v; todo(); });
      PM.botonera(document.getElementById('b-escala'), [['propia', tr('Por panel', 'Per panel')], ['comun', tr('Común', 'Shared')]],
        estado.escala, function (v) { estado.escala = v; grafico.redibujar(); });
      PM.pastillas(document.getElementById('pastillas'), [{ k: 'pib', nombre: tr('Comparar con el PIB', 'Compare with GDP'), color: { claro: C.pizarra, oscuro: C.gris }, forma: 'punteada' }],
        activas, function () { grafico.redibujar(); });
      medidas(); textos(); cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      // ¿sobre qué panel está el cursor? Se mide en la fase de captura, antes de que ECharts arme el tooltip
      var donde = function (e) {
        var b = el.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
        hoverG = null;
        geo.forEach(function (g, j) { if (x >= g.x0 && x <= g.x1 && y >= g.y0 && y <= g.y1) hoverG = j; });
      };
      el.addEventListener('pointermove', donde, true);
      el.addEventListener('pointerdown', donde, true);
      panel(estado.idx, null);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx, estado.k); });
      PM.preguntas(document.getElementById('preguntas'), preguntas());
      document.getElementById('fuente').innerHTML = tr(
        'Fuente: <a href="' + M.url + '" target="_blank" rel="noopener">INE — PIB trimestral por actividad económica (referencia 2017)</a> · Elaboración: Centro de Estudios POPULI · Datos al: ',
        'Source: <a href="' + M.url + '" target="_blank" rel="noopener">INE (National Statistics Institute) — Quarterly GDP by economic activity (reference year 2017)</a> · Analysis: Centro de Estudios POPULI · Data as of: ') + PM.fecha(M.ultimo);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function todo() { medidas(); textos(); cifras(); grafico.redibujar(); panel(estado.idx, estado.k); }

    // Las tres medidas, alineadas a T. Las sumas de cuatro trimestres exigen trimestres SEGUIDOS: se
    // comprueba por fecha, no por posición.
    function medidas() {
      var ord = T.map(function (t) { var p = PM.periodo(t); return p.a * 4 + p.t; });
      var seguidos = function (i, n) { return i - n + 1 >= 0 && ord[i] - ord[i - n + 1] === n - 1; };
      var ib = T.map(function (t, i) { return t.slice(0, 4) === estado.base ? i : -1; }).filter(function (i) { return i >= 0; });
      S = {};
      ['pib'].concat(D.sectores).forEach(function (k) {
        var nv = D.nivel[k], suma = function (i) { return nv[i] + nv[i - 1] + nv[i - 2] + nv[i - 3]; };
        var base = ib.reduce(function (s, i) { return s + nv[i]; }, 0);
        S[k] = T.map(function (t, i) {
          if (estado.medida === 'ia') return D.var[k][i];
          if (estado.medida === 'nivel') return seguidos(i, 4) ? suma(i) / base * 100 : null;
          return seguidos(i, 8) ? (suma(i) / suma(i - 4) - 1) * 100 : null;
        });
      });
      // el orden de los paneles: el PIB primero (el ancla) y las actividades por su último valor, de mayor a menor
      var n = T.length - 1;
      ORDEN = ['pib'].concat(D.sectores.slice().sort(function (a, b) { return S[b][n] - S[a][n]; }));
    }
    var med = function () { return MED[estado.medida]; };
    function fmt(v) { return v == null ? '—' : med().pct ? PM.pct(v, 1, true) : PM.num(v, 1); }
    function lado(v) { return v == null ? PIB : v >= med().ref ? ARRIBA : ABAJO; }
    var primero = function () { var i = 0; while (i < T.length && S.pib[i] == null) i++; return i; };

    function textos() {
      document.getElementById('it-base').style.display = estado.medida === 'nivel' ? '' : 'none';
      document.getElementById('sub').textContent = {
        nivel: tr('Volumen de los últimos cuatro trimestres de cada actividad frente al de ' + estado.base + ' (= 100): sobre la raya punteada, produce más que ese año. Ordenadas de mayor a menor.',
          'Volume of the last four quarters of each activity versus that of ' + estado.base + ' (= 100): above the dashed line, it produces more than in that year. Sorted from highest to lowest.'),
        crec: tr('Crecimiento de los últimos cuatro trimestres frente a los cuatro anteriores (%): sobre el cero, la actividad crece. Ordenadas de mayor a menor.',
          'Growth of the last four quarters versus the previous four (%): above zero, the activity is growing. Sorted from highest to lowest.'),
        ia: tr('Variación de cada trimestre frente al mismo trimestre del año anterior (%), la que publica el INE. Ordenadas de mayor a menor.',
          'Change in each quarter versus the same quarter of the previous year (%), the one published by the INE. Sorted from highest to lowest.')
      }[estado.medida];
    }

    function cifras() {
      var n = T.length - 1, m = med(), pib = S.pib[n], nivel = estado.medida === 'nivel';
      var fil = D.sectores.map(function (k) { return { k: k, v: S[k][n] }; }).sort(function (a, b) { return b.v - a.v; });
      var alto = fil[0], bajo = fil[fil.length - 1], debajo = fil.filter(function (x) { return x.v < m.ref; }).length;
      var p0 = primero(), serie = function (f) { var out = []; for (var i = Math.max(p0, n - 11); i <= n; i++) out.push(f(i)); return out; };
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: PIB, rotulo: tr('PIB · ' + PM.fecha(T[n]), 'GDP · ' + PM.fecha(T[n])), valor: fmt(pib),
          delta: nivel ? tr(PM.pct(pib - 100, 1, true) + ' frente a ' + estado.base, PM.pct(pib - 100, 1, true) + ' versus ' + estado.base) : estado.medida === 'crec' ? tr('cuatro trimestres', 'four quarters') : tr('interanual', 'year-on-year'),
          tono: pib < m.ref ? 'malo' : 'bueno', serie: serie(function (i) { return S.pib[i]; }) }) +
        PM.kpi({ color: C.rojo, rotulo: nivel ? tr('Bajo su nivel de ' + estado.base, 'Below their ' + estado.base + ' level') : tr('Actividades en caída', 'Activities in decline'), valor: tr(debajo + ' de ' + fil.length, debajo + ' of ' + fil.length),
          delta: nivel ? tr((fil.length - debajo) + ' lo superan', (fil.length - debajo) + ' exceed it') : tr((fil.length - debajo) + ' crecen', (fil.length - debajo) + ' are growing'), tono: debajo > fil.length / 2 ? 'malo' : 'neutro',
          serie: serie(function (i) { return D.sectores.filter(function (k) { return S[k][i] != null && S[k][i] < m.ref; }).length; }) }) +
        PM.kpi({ color: lado(alto.v), rotulo: (nivel ? tr('Más arriba · ', 'Highest · ') : tr('Mayor alza · ', 'Largest rise · ')) + NOM[alto.k], valor: fmt(alto.v),
          delta: nivel ? tr(PM.pct(alto.v - 100, 1, true) + ' frente a ' + estado.base, PM.pct(alto.v - 100, 1, true) + ' versus ' + estado.base) : PM.fecha(T[n]), tono: alto.v >= m.ref ? 'bueno' : 'malo', serie: serie(function (i) { return S[alto.k][i]; }) }) +
        PM.kpi({ color: lado(bajo.v), rotulo: (nivel ? tr('Más abajo · ', 'Lowest · ') : tr('Mayor caída · ', 'Largest fall · ')) + NOM[bajo.k], valor: fmt(bajo.v),
          delta: nivel ? tr(PM.pct(bajo.v - 100, 1, true) + ' frente a ' + estado.base, PM.pct(bajo.v - 100, 1, true) + ' versus ' + estado.base) : PM.fecha(T[n]), tono: bajo.v < m.ref ? 'malo' : 'bueno', serie: serie(function (i) { return S[bajo.k][i]; }) });
    }

    // Escala redondeada (la del deck): poco aire y más divisiones en la común; con el 12% de holgura de un
    // panel suelto el redondeo no se come el rango.
    function escala(vals, base, aire, divs) {
      var v = vals.filter(function (x) { return x != null; });
      var lo = Math.min.apply(null, v.concat([base])), hi = Math.max.apply(null, v.concat([base])), r = (hi - lo) || 1;
      lo -= r * aire; hi += r * aire;
      var paso = Math.pow(10, Math.floor(Math.log10((hi - lo) / divs)));
      [1, 2, 2.5, 5, 10].some(function (m) { if ((hi - lo) / (paso * m) <= divs) { paso *= m; return true; } return false; });
      return { lo: Math.floor(lo / paso + 1e-9) * paso, hi: Math.ceil(hi / paso - 1e-9) * paso, paso: paso };
    }
    // Corta la serie por el signo respecto de la base e inserta el cruce interpolado: sin eso el relleno
    // inventa un escalón en el trimestre en que la línea atraviesa la base.
    function cortar(pts, base) {
      var aug = [];
      for (var i = 0; i < pts.length; i++) {
        aug.push(pts[i]);
        if (i < pts.length - 1) {
          var y0 = pts[i][1], y1 = pts[i + 1][1];
          if ((y0 - base) * (y1 - base) < 0) { var t = (base - y0) / (y1 - y0); aug.push([pts[i][0] + t * (pts[i + 1][0] - pts[i][0]), base]); }
        }
      }
      return { arriba: aug.map(function (p) { return [p[0], Math.max(p[1], base)]; }), abajo: aug.map(function (p) { return [p[0], Math.min(p[1], base)]; }) };
    }
    var medidor;
    function ancho(t, fuente) { medidor = medidor || document.createElement('canvas').getContext('2d'); medidor.font = fuente; return medidor.measureText(t).width; }

    function opciones() {
      var el = document.getElementById('chart'), ch = echarts.getInstanceByDom(el);
      // Durante la descarga el molde dibuja el lienzo fuera de pantalla con un tamaño fijo: se usa ESE tamaño
      // y no se toca el alto del div (lo restaura el molde). Se reconoce por el corrimiento a −40000 px: el
      // «position:fixed» que pone el molde no sirve de señal, ECharts lo pisa con «relative».
      var exp = el.style.left === '-40000px', chico = PM.pequeno(), dk = PM.dk(), m = med(), ref = m.ref;
      // columnas por el ancho REAL del lienzo: con el panel de lectura al costado (PC) el lienzo mide ~670 px y
      // cuatro columnas dejaban paneles de ~150 px con la cifra pegada al eje: van tres (~210 px); dos en el
      // teléfono; cuatro sólo en un lienzo ancho (la imagen de descarga, 800 px lógicos)
      var W = el.clientWidth, cols = exp || W >= 900 ? 4 : W >= 470 ? 3 : 2;
      var n = ORDEN.length, filas = Math.ceil(n / cols);
      // cabeza de cada panel: el nombre y DEBAJO la cifra grande (como la lámina del deck)
      var fN = chico ? 11 : 11.5, fC = chico ? 16 : 18, CAB = Math.round(fN + 4 + fC + 15);   // +15: aire entre la cifra y el primer rótulo del eje
      var EJE = 18, SEPY = chico ? 14 : 16, SEPX = chico ? 14 : 18, izq = chico ? 10 : 2, der = chico ? 12 : 8, alto;
      if (exp) alto = Math.floor((el.clientHeight - filas * (CAB + EJE) - (filas - 1) * SEPY) / filas);
      else {
        // ⛔ ECharts no agranda el lienzo si sólo cambia el alto del div: se fija el alto y se llama resize()
        alto = cols === 2 ? 92 : cols === 3 ? 108 : 96;
        var H = filas * (CAB + alto + EJE) + (filas - 1) * SEPY;
        if (Math.abs(el.clientHeight - H) > 1) el.style.height = H + 'px';
        if (ch && Math.abs(ch.getHeight() - el.clientHeight) > 1) ch.resize();
      }
      var p0 = primero(), u = T.length - 1;
      I = []; for (var i = p0; i <= u; i++) I.push(i);
      var conPib = activas.has('pib');
      var pts = {};
      ORDEN.forEach(function (k) { pts[k] = I.map(function (i) { return [X[i], S[k][i]]; }).filter(function (p) { return p[1] != null; }); });
      var todos = []; ORDEN.forEach(function (k) { pts[k].forEach(function (p) { todos.push(p[1]); }); });
      var comun = escala(todos, ref, 0.05, 5);
      var esc = ORDEN.map(function (k) {
        if (estado.escala === 'comun') return comun;
        var v = pts[k].map(function (p) { return p[1]; });
        if (conPib && k !== 'pib') v = v.concat(pts.pib.map(function (p) { return p[1]; }));
        return escala(v, ref, 0.12, 3);
      });
      // margen del eje Y: el número más ancho de TODOS los paneles (todos miden lo mismo); ese número queda
      // al ras del nombre del panel y los números van alineados a la derecha, pegados al dibujo
      var fA = chico ? 9.5 : 10, fuenteEje = '500 ' + fA + 'px ' + PM.mono(), MARG = 6, gut = 0;
      var dec = function (s) { return Math.abs(s.paso - Math.round(s.paso)) > 1e-9 ? 1 : 0; };
      esc.forEach(function (s) { for (var v = s.lo; v <= s.hi + s.paso / 2; v += s.paso) gut = Math.max(gut, ancho(PM.num(v, dec(s)), fuenteEje)); });
      gut = Math.ceil(gut) + MARG;
      var cw = (W - izq - der - (cols - 1) * SEPX) / cols, plotW = cw - gut;
      // años del eje: el paso que deja un rótulo cada ~38 px del ancho real del panel
      var x0a = X[p0], x1a = X[u], span = Math.floor(x1a) - Math.ceil(x0a), caben = Math.max(2, Math.floor(plotW / 38));
      var paso = [1, 2, 3, 4, 5].filter(function (t) { return Math.floor(span / t) + 1 <= caben; })[0] || 5;
      var pz = dk ? '#8A9699' : '#5C6B70', tinta = PM.col(C.tinta), card = PM.var('--card') || '#ffffff';
      var grilla = dk ? '#2A3A50' : '#E2DDD3', lineaEje = dk ? '#3A4549' : '#C9CDCE';
      var fNom = '700 ' + fN + 'px ' + PM.inter(), fCif = '700 ' + fC + 'px ' + PM.mono();
      var anual = estado.medida !== 'ia';   // en las sumas de 4 trimestres, el T4 es el dato del año: lleva su punto
      geo = [];
      var grid = [], xAxis = [], yAxis = [], series = [], graphic = [];
      ORDEN.forEach(function (k, g) {
        var r = Math.floor(g / cols), c = g % cols, x0 = izq + c * (cw + SEPX), y0 = r * (CAB + alto + EJE + SEPY);
        geo.push({ k: k, x0: x0, x1: x0 + cw, y0: y0, y1: y0 + CAB + alto + EJE });
        grid.push({ left: Math.round(x0 + gut), top: y0 + CAB, width: Math.floor(plotW), height: alto, containLabel: false });
        // marcas cada trimestre (la serie empieza en un T4: con paso 1 ninguna caería en un año entero); sólo
        // se rotulan los años del paso elegido
        xAxis.push({ type: 'value', gridIndex: g, min: x0a, max: x1a, interval: 0.25,
          axisLine: { onZero: false, lineStyle: { color: lineaEje } }, axisTick: { show: false }, splitLine: { show: false },
          axisLabel: { fontFamily: PM.mono(), fontSize: fA, fontWeight: 600, color: dk ? 'rgba(226,232,240,.75)' : 'rgba(0,18,25,.7)', margin: 6,
            // sin la regla de los extremos: ECharts escondía el rótulo de 2018 por «chocar» con el mínimo (2017,75), vacío
            showMinLabel: false, showMaxLabel: false,
            formatter: function (v) { var y = Math.round(v); return Math.abs(v - y) < 1e-6 && y % paso === 0 ? String(y) : ''; } },
          axisPointer: { show: true, type: 'line', snap: true, label: { show: false }, lineStyle: { color: dk ? 'rgba(226,232,240,.32)' : 'rgba(0,18,25,.22)', width: 1 } } });
        var s = esc[g], d = dec(s);
        yAxis.push({ type: 'value', gridIndex: g, min: s.lo, max: s.hi, interval: s.paso,
          axisLine: { show: false }, axisTick: { show: false },
          splitLine: { lineStyle: { color: grilla, type: [3, 3], opacity: dk ? 0.7 : 1 } },
          axisLabel: { color: pz, fontFamily: PM.mono(), fontSize: fA, fontWeight: 500, margin: MARG, align: 'right', formatter: function (v) { return PM.num(v, d); } } });
        var dat = pts[k], cut = cortar(dat, ref);
        // áreas por signo: el color va acá, no en la línea
        var area = function (datos, col, id) {
          return { type: 'line', id: id + g, xAxisIndex: g, yAxisIndex: g, data: datos, silent: true, symbol: 'none', z: 1,
            lineStyle: { width: 0 }, areaStyle: { origin: ref, color: PM.tinte(col === C.turquesa), opacity: 1 }, tooltip: { show: false }, emphasis: { disabled: true } };
        };
        series.push(area(cut.arriba, C.turquesa, 'arr'), area(cut.abajo, C.rojo, 'aba'));
        if (conPib && k !== 'pib') series.push({ type: 'line', id: 'pib' + g, name: '_pib' + g, xAxisIndex: g, yAxisIndex: g, data: pts.pib, silent: true, z: 2,
          symbol: 'none', lineStyle: { width: 1, color: pz, type: [5, 4] }, tooltip: { show: false }, emphasis: { disabled: true } });
        // la serie: TINTA, con el punto hueco en el cierre de cada año y en el último dato
        var ult = dat.length - 1;
        series.push({ type: 'line', id: 'l' + g, name: NOM[k], xAxisIndex: g, yAxisIndex: g, z: 4,
          data: dat.map(function (p, j) {
            var cierre = (anual && Math.abs(p[0] % 1 - 0.75) < 1e-6) || j === ult;
            return cierre ? { value: p, symbol: 'circle', symbolSize: j === ult ? 7 : 5 } : { value: p, symbol: 'none' };
          }),
          showSymbol: true, symbol: 'none', lineStyle: { width: 1.5, color: tinta, cap: 'round', join: 'round' },   // más fino (pedido de Carlos): era 2
          itemStyle: { color: card, borderColor: tinta, borderWidth: 1.25 }, emphasis: { disabled: true },
          markLine: { silent: true, symbol: 'none', animation: false, label: { show: false },
            lineStyle: { color: dk ? 'rgba(226,232,240,.7)' : 'rgba(0,18,25,.65)', width: 0.9, type: [4, 3] }, data: [{ yAxis: ref }] } });
        // cabeza: el nombre en tinta y, debajo, la cifra del último dato en el color de su lado de la base
        var nom = NOM[k] === N('PIB') ? tr('Producto interno bruto', 'Gross domestic product') : NOM[k];
        if (ancho(nom, fNom) > cw) nom = NOM[k];
        var v = dat[ult][1];
        graphic.push({ type: 'text', silent: true, x: x0, y: y0, style: { text: nom, font: fNom, fill: tinta, align: 'left', verticalAlign: 'top' } });
        graphic.push({ type: 'text', silent: true, x: x0, y: y0 + fN + 4, style: { text: fmt(v), font: fCif, fill: PM.col(lado(v)), align: 'left', verticalAlign: 'top' } });
      });
      return {
        animationDuration: 450,
        grid: grid, xAxis: xAxis, yAxis: yAxis, series: series, graphic: graphic,
        // el cursor en un panel marca el mismo trimestre en los doce
        axisPointer: { link: [{ xAxisIndex: 'all' }] },
        tooltip: PM.tooltip(function (ps) {
          var g = hoverG != null ? hoverG : 0, k = ORDEN[g];
          var p = ps.filter(function (q) { return q.seriesId === 'l' + g; })[0] || ps.filter(function (q) { return /^l\d+$/.test(q.seriesId); })[0];
          if (!p) return '';
          var i = I[0] + Math.round((p.value[0] - X[I[0]]) * 4), v = S[k][i], pv = S.pib[i];
          if (v == null) return '';
          panel(i, k);
          var h = PM.ttTitulo(NOM[k] + ' · ' + PM.fecha(T[i]), estado.medida === 'nivel' ? tr('Cuatro trimestres · ' + estado.base + ' = 100', 'Four quarters · ' + estado.base + ' = 100') : med().nombre);
          h += PM.ttFila(PIB, NOM[k], fmt(v), 'linea');
          if (k !== 'pib' && pv != null) h += PM.ttFila(pz, tr('PIB', 'GDP'), fmt(pv), 'punteada');
          var dif = v - med().ref;
          return h + PM.ttTotal(estado.medida === 'nivel' ? tr('Frente a ' + estado.base, 'Versus ' + estado.base) : (dif >= 0 ? tr('Crece', 'Growing') : tr('Cae', 'Falling')),
            estado.medida === 'nivel' ? PM.pct(dif, 1, true) : PM.pct(Math.abs(dif), 1));
        }, chico ? {
          axisPointer: { type: 'line' },
          // en el teléfono el lienzo es más alto que la pantalla: el vidrio va justo encima del panel tocado
          // (o debajo, en la primera fila), no arriba de todo el lienzo, donde quedaría fuera de la vista
          position: function (pt, params, dom, rect, size) {
            var w = size.contentSize[0], h = size.contentSize[1], Wv = size.viewSize[0], g = geo[hoverG != null ? hoverG : 0];
            var y = g.y0 - h - 6 >= 0 ? g.y0 - h - 6 : g.y1 + 6;
            return [Math.min(Math.max(pt[0] - w / 2, 4), Math.max(4, Wv - w - 4)), y];
          }
        } : { axisPointer: { type: 'line' } })
      };
    }

    // Umbrales de la lectura: con 8 o más de las 11 actividades debajo de la base (por debajo del año base, o
    // en caída) el retroceso es «extendido»; con 3 o menos, «la mayoría está arriba»; en el medio, «dividido».
    // El PIB a menos de 1% de la base está «prácticamente igual».
    var EXTENDIDA = 8, POCAS = 3, IGUAL = 1;
    function lectura(i) {
      var m = med(), fil = D.sectores.map(function (k) { return { k: k, v: S[k][i] }; }).filter(function (x) { return x.v != null; })
        .sort(function (a, b) { return b.v - a.v; });
      var n = fil.length, bajo = fil.filter(function (x) { return x.v < m.ref; }).length, pib = S.pib[i], a = fil[0], z = fil[n - 1];
      if (estado.medida === 'nivel') {
        var d = pib - 100, t = tr('En los cuatro trimestres hasta el ' + PM.fecha(T[i]) + ' el PIB ' +
          (Math.abs(d) < IGUAL ? 'está <strong>prácticamente en su nivel de ' + estado.base + '</strong> (' + PM.pct(d, 1, true) + ')'
            : 'está <strong>' + PM.pct(Math.abs(d), 1) + (d > 0 ? ' arriba' : ' abajo') + '</strong> de su nivel de ' + estado.base) + '. ',
          'In the four quarters to ' + PM.fecha(T[i]) + ', GDP ' +
          (Math.abs(d) < IGUAL ? 'is <strong>practically at its ' + estado.base + ' level</strong> (' + PM.pct(d, 1, true) + ')'
            : 'is <strong>' + PM.pct(Math.abs(d), 1) + (d > 0 ? ' above' : ' below') + '</strong> its ' + estado.base + ' level') + '. ');
        if (bajo === 0) t += tr('Las ' + n + ' actividades producen más que en ' + estado.base + '.', 'All ' + n + ' activities produce more than in ' + estado.base + '.');
        else t += tr('<strong>' + bajo + ' de ' + n + '</strong> actividades producen menos que en ' + estado.base + (bajo >= EXTENDIDA ? ': el retroceso es <strong>extendido</strong>.' : bajo <= POCAS ? '; el resto ya lo superó.' : '.'),
          '<strong>' + bajo + ' of ' + n + '</strong> activities produce less than in ' + estado.base + (bajo >= EXTENDIDA ? ': the setback is <strong>widespread</strong>.' : bajo <= POCAS ? '; the rest have already surpassed it.' : '.'));
        return t + tr(' La más arriba: <strong>' + NOM[a.k] + '</strong> (' + fmt(a.v) + '); la más abajo: <strong>' + NOM[z.k] + '</strong> (' + fmt(z.v) + ').',
          ' The highest: <strong>' + NOM[a.k] + '</strong> (' + fmt(a.v) + '); the lowest: <strong>' + NOM[z.k] + '</strong> (' + fmt(z.v) + ').');
      }
      var q = estado.medida === 'crec' ? tr(' en los últimos cuatro trimestres', ' over the last four quarters') : tr(' en el trimestre', ' in the quarter');
      var r = bajo === 0 ? tr('<strong>Las ' + n + ' actividades crecen</strong>' + q + '.', '<strong>All ' + n + ' activities are growing</strong>' + q + '.')
        : bajo >= EXTENDIDA ? tr('La caída es <strong>extendida</strong>' + q + ': ' + bajo + ' de ' + n + ' actividades retroceden.', 'The decline is <strong>widespread</strong>' + q + ': ' + bajo + ' of ' + n + ' activities are contracting.')
        : bajo <= POCAS ? tr('<strong>La mayoría crece</strong>' + q + ': sólo ' + bajo + ' de ' + n + ' actividades retroceden.', '<strong>Most are growing</strong>' + q + ': only ' + bajo + ' of ' + n + ' activities are contracting.')
        : tr('La economía está <strong>dividida</strong>' + q + ': ' + (n - bajo) + ' actividades crecen y ' + bajo + ' caen.', 'The economy is <strong>split</strong>' + q + ': ' + (n - bajo) + ' activities are growing and ' + bajo + ' are falling.');
      return r + tr(' El PIB: <strong>' + fmt(pib) + '</strong>. Entre ' + NOM[a.k] + ' (' + fmt(a.v) + ') y ' + NOM[z.k] + ' (' + fmt(z.v) + ') hay ' + PM.num(a.v - z.v, 1) + NB + 'pp.',
        ' GDP: <strong>' + fmt(pib) + '</strong>. Between ' + NOM[a.k] + ' (' + fmt(a.v) + ') and ' + NOM[z.k] + ' (' + fmt(z.v) + ') there is a gap of ' + PM.num(a.v - z.v, 1) + NB + 'pp.');
    }

    // Panel de lectura: el RANKING de los doce en el trimestre bajo el cursor, con barras que salen de la base
    function panel(i, k) {
      if (i == null || !D || S.pib[i] == null) return;
      estado.idx = i; estado.k = k && k !== 'pib' ? k : null;
      var ref = med().ref;
      var fil = D.sectores.map(function (s) { return { k: s, v: S[s][i] }; }).filter(function (x) { return x.v != null; }).sort(function (a, b) { return b.v - a.v; });
      var filas = [{ k: 'pib', v: S.pib[i] }].concat(fil);
      var tope = Math.max.apply(null, filas.map(function (x) { return Math.abs(x.v - ref); })) || 1;
      var titulo = estado.medida === 'nivel' ? tr('Nivel · ' + estado.base + ' = 100', 'Level · ' + estado.base + ' = 100') : estado.medida === 'crec' ? tr('Crecimiento de 4 trimestres', '4-quarter growth') : tr('Variación interanual', 'Year-on-year change');
      var html = '<div class="rk"><div class="rk-t">' + titulo + '</div>' + filas.map(function (x) {
        var dv = x.v - ref, w = Math.abs(dv) / tope * 50, col = PM.col(lado(x.v));
        var barra = '<i style="background:' + (x.k === 'pib' ? PM.col(PIB) : col) + ';' + (dv >= 0 ? 'left:50%' : 'left:' + (50 - w) + '%') + ';width:' + w + '%"></i>';
        return '<div class="rk-f' + (x.k === 'pib' ? ' pib' : '') + (x.k === estado.k ? ' sel' : '') + '"><span class="rk-n">' + NOM[x.k] +
          '</span><span class="rk-b">' + barra + '</span><span class="rk-v" style="color:' + (x.k === 'pib' ? PM.col(PIB) : PM.tx(lado(x.v))) + '">' + fmt(x.v) + '</span></div>';
      }).join('') + '</div>';
      document.getElementById('panel-fecha').textContent = PM.fecha(T[i]);
      document.getElementById('panel').innerHTML = html + PM.ctx(lectura(i));
    }

    // Imagen: los paneles llevan su nombre; la leyenda explica los rellenos y la raya del PIB
    PM.leyendaImagen = function () {
      var b = estado.medida === 'nivel' ? estado.base : null;
      return [{ name: b ? tr('Sobre ' + b, 'Above ' + b) : tr('Crece', 'Growing'), color: PM.tinte(true), forma: 'area' },
              { name: b ? tr('Bajo ' + b, 'Below ' + b) : tr('Cae', 'Falling'), color: PM.tinte(false), forma: 'area' }]
        .concat(activas.has('pib') ? [{ name: tr('PIB', 'GDP'), color: PM.dk() ? '#8A9699' : '#5C6B70', forma: 'punteada' }] : []);
    };
    // Datos: el eje X es numérico (años decimales), así que la tabla se declara
    PM.tablaDatos = function () {
      var u = { nivel: tr('índice de volumen de 4 trimestres, ' + estado.base + ' = 100', '4-quarter volume index, ' + estado.base + ' = 100'), crec: tr('crecimiento de 4 trimestres, %', '4-quarter growth, %'), ia: tr('variación interanual, %', 'year-on-year change, %') }[estado.medida];
      return { cols: [tr('Período (' + u + ')', 'Period (' + u + ')')].concat(ORDEN.map(function (k) { return NOM[k]; })),
        filas: I.map(function (i) { return [T[i]].concat(ORDEN.map(function (k) { return S[k][i] == null ? null : +S[k][i].toFixed(3); })); }) };
    };

    function preguntas() {
      // cuánto pesa la estacionalidad: el mejor y el peor trimestre de la agropecuaria en 2019
      var ag = T.map(function (t, i) { return t.slice(0, 4) === '2019' ? D.nivel.agro[i] : null; }).filter(function (v) { return v != null; });
      var veces = Math.max.apply(null, ag) / Math.min.apply(null, ag);
      var c = D.var.construccion, ok = c.filter(function (v) { return v != null; });
      var imin = c.indexOf(Math.min.apply(null, ok)), imax = c.indexOf(Math.max.apply(null, ok));
      return [
        [tr('¿Cómo se lee?', 'How do you read it?'), tr('Cada panel es una actividad, con el <strong>PIB primero</strong>. La línea es la actividad; el relleno <strong>turquesa</strong> marca cuándo está sobre la base (100, o el cero en el crecimiento) y el <strong>rojo</strong> cuándo está debajo. La raya gris punteada repite el PIB. La cifra grande es el último dato, y los paneles van ordenados por ella. <p>El cursor sobre un trimestre lo marca en los doce paneles, y la lectura de la derecha los ordena para ese trimestre.</p>',
          'Each panel is one activity, with <strong>GDP first</strong>. The line is the activity; the <strong>turquoise</strong> fill marks when it is above the base (100, or zero for growth) and the <strong>red</strong> fill when it is below. The dashed gray line repeats GDP. The large figure is the latest data point, and the panels are sorted by it. <p>Hovering over a quarter marks it in all twelve panels, and the reading on the right ranks them for that quarter.</p>')],
        [tr('¿Qué es el nivel con año base = 100?', 'What is the level with base year = 100?'), tr('El volumen producido en los <strong>últimos cuatro trimestres</strong> frente al de los cuatro trimestres del año base. Con base 2019, un panel en 90 produce 10% menos que antes de la pandemia. <p>Se suman cuatro trimestres porque la producción tiene estación: en 2019 la agropecuaria produjo en su mejor trimestre ' + PM.num(veces, 1) + ' veces lo de su peor trimestre.</p>',
          'The volume produced in the <strong>last four quarters</strong> versus that of the four quarters of the base year. With a 2019 base, a panel at 90 produces 10% less than before the pandemic. <p>Four quarters are added up because output is seasonal: in 2019 agriculture produced ' + PM.num(veces, 1) + ' times as much in its best quarter as in its worst.</p>')],
        [tr('¿Qué año base conviene?', 'Which base year is best?'), tr('<strong>2019</strong>: el último año antes de la pandemia, la vara de la recuperación. <strong>2017</strong>: el año de referencia de las cuentas nacionales del INE. <strong>' + BASES[2] + '</strong>: el último año completo antes del dato más reciente, para ver el cambio reciente.',
          '<strong>2019</strong>: the last year before the pandemic, the yardstick for the recovery. <strong>2017</strong>: the reference year of the INE national accounts. <strong>' + BASES[2] + '</strong>: the last full year before the most recent data point, to see the recent change.')],
        [tr('Crecimiento o interanual', 'Growth or year-on-year'), tr('El <strong>crecimiento</strong> compara los últimos cuatro trimestres con los cuatro anteriores: en el cuarto trimestre es el crecimiento del año. La <strong>interanual</strong> es la que publica el INE para cada trimestre y salta mucho más: la construcción marcó ' + PM.pct(c[imin], 1, true) + ' en el ' + PM.fecha(T[imin]) + ' y ' + PM.pct(c[imax], 1, true) + ' en el ' + PM.fecha(T[imax]) + '.',
          '<strong>Growth</strong> compares the last four quarters with the previous four: in the fourth quarter it is the growth for the year. The <strong>year-on-year</strong> rate is the one the INE publishes for each quarter and it jumps around much more: construction posted ' + PM.pct(c[imin], 1, true) + ' in ' + PM.fecha(T[imin]) + ' and ' + PM.pct(c[imax], 1, true) + ' in ' + PM.fecha(T[imax]) + '.')],
        [tr('¿Por qué las actividades no suman el PIB?', 'Why don’t the activities add up to GDP?'), tr('Porque el INE las mide en <strong>volumen encadenado</strong> (referencia 2017), y esas medidas <strong>no son aditivas</strong>: la suma de las actividades no iguala el PIB. Por eso acá cada actividad se compara sólo consigo misma; cuánto explica cada una del PIB está en el gráfico de contribuciones.',
          'Because the INE measures them in <strong>chained volume</strong> terms (reference year 2017), and those measures <strong>are not additive</strong>: the sum of the activities does not equal GDP. That is why each activity is compared here only with itself; how much of GDP each one accounts for is in the contributions chart.')],
        [tr('¿Son cifras definitivas?', 'Are these final figures?'), tr('No. El INE publica el PIB trimestral como <strong>cifras preliminares</strong>, sujetas a revisión: un trimestre puede cambiar en publicaciones posteriores.',
          'No. The INE publishes quarterly GDP as <strong>preliminary figures</strong>, subject to revision: a quarter may change in later releases.')]
      ];
    }
  })();
  </script>
</body>
</html>
