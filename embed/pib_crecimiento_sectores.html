    :root{

      --accent:#0D9488;--radius:12px;
    }
    [data-theme="dark"]{--bg:#080808;--card:#141414;--text:#E2E8F0;--muted:#64748B;--border:#2A3A50;--light-gray:#1A1A1A;--cream:#1A2940}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
    .embed-container{max-width:1200px;margin:0 auto;padding:20px 16px}
    .section-header{margin-bottom:16px}
    .section-title{font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px;line-height:1.15}
    [data-theme="dark"] .section-title{color:#fff}
    .accent-bar{width:4px;height:26px;background:var(--accent);border-radius:2px;flex-shrink:0}
    .section-subtitle{font-size:.78rem;color:var(--muted);padding-left:14px;margin-top:2px}
    [data-theme="dark"] .section-subtitle{color:rgba(255,255,255,.4)}

    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    @media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
    .kpi-card{background:var(--warm-white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
    [data-theme="dark"] .kpi-card{background:#141414;border-color:var(--dark-border)}
    .kpi-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
    .kpi-card[data-s="up"]::after{background:#059669}
    .kpi-card[data-s="down"]::after{background:#C71E1D}
    .kpi-card[data-s="best"]::after{background:var(--accent)}
    .kpi-card[data-s="worst"]::after{background:#D97706}
    .kpi-label{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
    [data-theme="dark"] .kpi-label{color:rgba(255,255,255,.4)}
    .kpi-value{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700}
    .kpi-sub{font-size:.58rem;color:var(--muted);margin-top:2px}

    .controls-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .range-group{display:flex;gap:4px}
    .range-btn,.view-btn{padding:4px 10px;border:1.5px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:.65rem;font-weight:600;color:var(--muted);transition:all .2s}
    [data-theme="dark"] .range-btn,[data-theme="dark"] .view-btn{border-color:var(--dark-border);color:#94A3B8}
    .range-btn:hover,.range-btn.active{border-color:var(--populi);color:var(--populi)}
    [data-theme="dark"] .range-btn:hover,[data-theme="dark"] .range-btn.active{border-color:var(--populi-light);color:var(--populi-light)}
    .view-btn:hover,.view-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(13,148,136,.06)}
    [data-theme="dark"] .view-btn:hover,[data-theme="dark"] .view-btn.active{border-color:#14B8A6;color:#14B8A6;background:rgba(13,148,136,.1)}
    .controls-divider{width:1px;height:18px;background:var(--border)}
    [data-theme="dark"] .controls-divider{background:var(--dark-border)}

    .sectors-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media(max-width:900px){.sectors-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:500px){.sectors-grid{grid-template-columns:1fr}}
    .sector-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;overflow:hidden;position:relative}
    [data-theme="dark"] .sector-card{background:#141414;border-color:var(--dark-border)}
    .sector-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
    .sector-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
    .sector-name{font-size:.68rem;font-weight:700;color:var(--text);line-height:1.2;max-width:60%}
    [data-theme="dark"] .sector-name{color:#E2E8F0}
    .sector-badge{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
    .sector-chart{width:100%;height:140px}

    .chart-source{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:0 2px}
    .chart-source-text{font-size:.58rem;color:var(--muted);opacity:.6}
    .chart-source-text a{color:var(--populi);font-weight:600;text-decoration:none}
    .watermark{height:15px;width:auto;opacity:.18}
    [data-theme="dark"] .watermark{opacity:.10}

    .edu-box{background:var(--cream);border-radius:8px;padding:10px 12px;border-left:3px solid var(--populi);margin-top:4px;cursor:pointer;transition:all .2s}
    [data-theme="dark"] .edu-box{background:var(--navy-light)}
    .edu-box:hover{transform:translateY(-1px)}
    .edu-box-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .edu-box-title{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--populi)}
    [data-theme="dark"] .edu-box-title{color:var(--populi-light)}
    .edu-box-arrow{font-size:.6rem;color:var(--muted);transition:transform .2s}
    .edu-box.open .edu-box-arrow{transform:rotate(180deg)}
    .edu-box-content{display:none;margin-top:8px}
    .edu-box.open .edu-box-content{display:block}
    .edu-box-content p{font-size:.66rem;line-height:1.6;color:var(--slate-light);margin-bottom:6px}
    .edu-box-content p:last-child{margin-bottom:0}
    [data-theme="dark"] .edu-box-content p{color:#94A3B8}
    .edu-box-content p strong{color:var(--navy)}
    [data-theme="dark"] .edu-box-content p strong{color:#E2E8F0}
  </style>
</head>

    {key:'ia',label:'Interanual',desc:'Trimestre vs. mismo trimestre del año anterior'},
    {key:'m12',label:'12 Meses',desc:'Suma 4 trim. / suma 4 trim. anteriores − 1'},
    {key:'acum',label:'Acumulada',desc:'Acumulado desde el I trimestre del año'}
  ];
  var RANGES=[{label:'3A',trim:12},{label:'5A',trim:20},{label:'Todo',trim:0}];
  var curView=0,curRange=2;
  var charts=[];

  function fpct(v){return (v>=0?'+':'')+v.toFixed(1)+'%'}
  function fquarter(lbl){var p=lbl.split('-');var r={T1:'I',T2:'II',T3:'III',T4:'IV'};return r[p[1]]+' Trim. '+p[0]}

  function init(){
    document.getElementById('app').innerHTML=buildHTML();
    buildKPIs();
    buildControls();
    buildAllCharts();
    buildEduBoxes();
    window.addEventListener('resize',function(){charts.forEach(function(c){c&&c.resize()})});
    new MutationObserver(function(){buildAllCharts();buildKPIs()})
      .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }

  function buildHTML(){
    var d=dk();
    var html='<div class="section-header">'
      +'<h2 class="section-title"><span class="accent-bar"></span>Crecimiento del PIB por Sector</h2>'
      +'<p class="section-subtitle">Medidas de volumen encadenadas · Base 2017 · Variación en %</p>'
      +'</div>'
      +'<div class="kpi-grid" id="kpis"></div>'
      +'<div class="controls-bar"><div class="range-group" id="views"></div><div style="display:flex;gap:10px;align-items:center"><div class="controls-divider"></div><div class="range-group" id="ranges"></div></div></div>'
      +'<div class="sectors-grid" id="sectors">';
    SECTORS.forEach(function(s,i){
      html+='<div class="sector-card"><style>.sector-card:nth-child('+(i+1)+')::before{background:'+s.color+'}</style>'
        +'<div class="sector-header"><span class="sector-name">'+s.short+'</span>'
        +'<span class="sector-badge" id="badge-'+s.key+'"></span></div>'
        +'<div class="sector-chart" id="chart-'+s.key+'"></div></div>';
    });
    html+='</div><div class="chart-source"><span class="chart-source-text">'
      +'Fuente: <a href="https://www.ine.gob.bo" target="_blank">INE Bolivia</a> · '
      +'Elaboración: <a href="https://populi.org.bo" target="_blank">Centro de Estudios POPULI</a></span>'
      +'<svg viewBox="0 0 310 130" xmlns="http://www.w3.org/2000/svg" class="watermark">'
      +'<text x="6" y="112" font-family="\'Playfair Display\',Georgia,serif" font-size="145" font-weight="700" fill="'+(d?'#C00000':'#8B1A1A')+'">P</text>'
      +'<text x="92" y="87" font-family="\'Playfair Display\',Georgia,serif" font-size="55" font-weight="400" font-style="italic" letter-spacing="1" fill="'+(d?'#F5EFE0':'#3D2B1F')+'">opuli</text></svg></div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px" id="edu-boxes"></div>';
    return html;
  }

  function buildKPIs(){
    var vk=VIEWS[curView].key;
    var lastIdx=LABELS.length-1;
    var growing=0,contracting=0,bestS=null,bestV=-999,worstS=null,worstV=999;
    SECTORS.forEach(function(s){
      var v=s[vk][lastIdx];
      if(v==null) return;
      if(v>=0) growing++; else contracting++;
      if(v>bestV){bestV=v;bestS=s}
      if(v<worstV){worstV=v;worstS=s}
    });
    document.getElementById('kpis').innerHTML=
      '<div class="kpi-card" data-s="up"><div class="kpi-label">En crecimiento</div>'
      +'<div class="kpi-value" style="color:#059669">'+growing+'</div>'
      +'<div class="kpi-sub">de 11 sectores · '+VIEWS[curView].label+'</div></div>'
      +'<div class="kpi-card" data-s="down"><div class="kpi-label">En contracción</div>'
      +'<div class="kpi-value" style="color:#C71E1D">'+contracting+'</div>'
      +'<div class="kpi-sub">de 11 sectores · '+fquarter(LABELS[lastIdx])+'</div></div>'
      +'<div class="kpi-card" data-s="best"><div class="kpi-label">Más dinámico</div>'
      +'<div class="kpi-value" style="color:'+(bestS?bestS.color:'#000')+'">'+fpct(bestV)+'</div>'
      +'<div class="kpi-sub">'+(bestS?bestS.short:'—')+'</div></div>'
      +'<div class="kpi-card" data-s="worst"><div class="kpi-label">Mayor caída</div>'
      +'<div class="kpi-value" style="color:'+(worstS?worstS.color:'#000')+'">'+fpct(worstV)+'</div>'
      +'<div class="kpi-sub">'+(worstS?worstS.short:'—')+'</div></div>';
  }

  function buildControls(){
    var vEl=document.getElementById('views');
    VIEWS.forEach(function(v,i){
      var btn=document.createElement('button');
      btn.className='view-btn'+(i===curView?' active':'');
      btn.textContent=v.label;
      btn.title=v.desc;
      btn.addEventListener('click',function(){
        curView=i;
        document.querySelectorAll('.view-btn').forEach(function(b){b.classList.remove('active')});
        btn.classList.add('active');
        document.querySelector('.section-subtitle').textContent='Medidas de volumen encadenadas · Base 2017 · '+v.desc;
        buildAllCharts();buildKPIs();
      });
      vEl.appendChild(btn);
    });
    var rEl=document.getElementById('ranges');
    RANGES.forEach(function(r,i){
      var btn=document.createElement('button');
      btn.className='range-btn'+(i===curRange?' active':'');
      btn.textContent=r.label;
      btn.addEventListener('click',function(){
        curRange=i;
        document.querySelectorAll('.range-btn').forEach(function(b){b.classList.remove('active')});
        btn.classList.add('active');
        buildAllCharts();buildKPIs();
      });
      rEl.appendChild(btn);
    });
  }

  function buildAllCharts(){
    charts.forEach(function(c){if(c) c.dispose()});
    charts=[];
    var vk=VIEWS[curView].key;
    var trim=RANGES[curRange].trim;
    var si=trim>0?Math.max(0,LABELS.length-trim):0;
    var labels=LABELS.slice(si);
    var pibSlice=PIB[vk].slice(si);

    SECTORS.forEach(function(s){
      var vals=s[vk].slice(si);
      var lastVal=null;
      for(var i=vals.length-1;i>=0;i--){if(vals[i]!=null){lastVal=vals[i];break}}
      var badge=document.getElementById('badge-'+s.key);
      if(badge&&lastVal!=null){
        badge.textContent=fpct(lastVal);
        badge.style.background=lastVal>=0?'rgba(5,150,105,.08)':'rgba(199,30,29,.08)';
        badge.style.color=lastVal>=0?'#059669':'#C71E1D';
      } else if(badge){badge.textContent='—';badge.style.background='transparent';badge.style.color='var(--muted)'}
      var container=document.getElementById('chart-'+s.key);
      if(!container) return;
      var c=echarts.init(container);
      charts.push(c);
      buildMini(c,s,labels,vals,pibSlice);
    });
  }

  function buildMini(chart,sector,labels,vals,pibSlice){
    var d=dk();
    chart.setOption({
      backgroundColor:'transparent',
      grid:{top:8,right:6,bottom:20,left:36},
      tooltip:{
        trigger:'axis',
        backgroundColor:d?'#080808':'rgba(13,27,42,.96)',
        borderColor:d?'#2A3A50':'#1A2940',
        textStyle:{fontFamily:'Inter',fontSize:11,color:'#fff'},
        padding:[8,12],
        extraCssText:'border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.3);',
        formatter:function(params){
          if(!params.length) return '';
          var html='<div style="font-weight:700;margin-bottom:4px;color:#E9D8A6;font-size:11px">'+fquarter(params[0].axisValue)+'</div>';
          params.forEach(function(p){
            if(p.value==null||p.seriesName==='ref') return;
            html+='<div style="display:flex;align-items:center;gap:6px;margin:2px 0">'
              +'<span style="width:6px;height:6px;border-radius:50%;background:'+p.color+';display:inline-block"></span>'
              +'<span style="font-size:10px;color:rgba(255,255,255,.7)">'+p.seriesName+'</span>'
              +'<span style="font-family:\'JetBrains Mono\';font-weight:700;font-size:11px;margin-left:auto">'+fpct(p.value)+'</span></div>';
          });
          return html;
        }
      },
      xAxis:{type:'category',data:labels,boundaryGap:false,
        axisLine:{lineStyle:{color:d?'#2A3A50':'#E2DDD3'}},axisTick:{show:false},
        axisLabel:{fontFamily:'Inter',fontSize:8,color:d?'#475569':'#CBD5E1',
          formatter:function(v,i){return(i===0||i===labels.length-1)?v.split('-')[0]:''},
          showMinLabel:true,showMaxLabel:true}},
      yAxis:{type:'value',
        splitLine:{lineStyle:{color:d?'#1E1E1E':'#F1F5F9',type:'dashed'}},
        axisLine:{show:false},axisTick:{show:false},
        axisLabel:{fontFamily:'JetBrains Mono',fontSize:9,color:d?'#475569':'#CBD5E1',formatter:function(v){return v+'%'}}},
      series:[
        {name:'PIB Total',type:'line',data:pibSlice,symbol:'none',z:1,
         lineStyle:{width:1,color:d?'#333':'#CBD5E1',type:[4,3]},itemStyle:{color:d?'#333':'#CBD5E1'},connectNulls:true},
        {name:sector.short,type:'line',data:vals,symbol:'none',z:3,
         lineStyle:{width:2,color:sector.color},itemStyle:{color:sector.color},connectNulls:true,
         areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
           {offset:0,color:sector.color+(d?'20':'12')},{offset:1,color:'transparent'}])},
         markPoint:{data:[function(){for(var i=vals.length-1;i>=0;i--){if(vals[i]!=null) return{coord:[i,vals[i]]}}return null}()].filter(Boolean),
           symbol:'circle',symbolSize:5,itemStyle:{color:sector.color,borderColor:d?'#141414':'#fff',borderWidth:1.5},label:{show:false}}},
        {name:'ref',type:'line',data:labels.map(function(){return 0}),symbol:'none',z:2,
         lineStyle:{width:1,color:d?'#475569':'#94A3B8',type:'solid'},itemStyle:{color:d?'#475569':'#94A3B8'}}
      ]
    },true);
  }

  function buildEduBoxes(){
    var eduData=[
      {title:'¿Qué muestra este gráfico?',
       content:'<p>Cada panel muestra el <strong>crecimiento de un sector del PIB</strong> en bolivianos encadenados (Base 2017). La línea punteada gris es el PIB total como referencia. Cuando la línea del sector está por encima del PIB, crece más rápido que el promedio.</p>'},
      {title:'Las tres medidas de crecimiento',
       content:'<p><strong>Interanual:</strong> compara cada trimestre contra el mismo trimestre del año anterior. Es la más volátil pero muestra dinámicas puntuales de cada sector.</p>'
        +'<p><strong>12 Meses:</strong> compara la suma de los últimos 4 trimestres contra la suma de los 4 anteriores. Es la medida más suave y la que usa el BCB para el PIB total.</p>'
        +'<p><strong>Acumulada:</strong> crecimiento desde el primer trimestre del año. En T1 coincide con la interanual; en T4, es el crecimiento anual completo.</p>'},
      {title:'¿Qué sectores componen el PIB?',
       content:'<p>El INE de Bolivia desagrega el PIB en <strong>11 grupos de actividad económica</strong> siguiendo la CIIU Rev.4. Los más volátiles son Construcción, Extractiva y Alojamiento. Los más estables son Administración Pública y Electricidad/Agua.</p>'}
    ];
    document.getElementById('edu-boxes').innerHTML=eduData.map(function(e){
      return '<div class="edu-box" onclick="this.classList.toggle(\'open\')">'
        +'<div class="edu-box-toggle"><span class="edu-box-title">'+e.title+'</span>'
        +'<span class="edu-box-arrow">&#9660;</span></div>'
        +'<div class="edu-box-content">'+e.content+'</div></div>';
    }).join('');
  }

  init();
})();
</script>
</body>
</html>
