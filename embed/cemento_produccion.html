<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producción de Cemento · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <script src="ind_mensual.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Producción de Cemento</div>
      <div class="sec-sub" id="sub">Toneladas por mes, un año por línea</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Serie</span><div class="hz-grp" id="b-serie"></div></div>
      <div class="hz-item"><span class="hz-lbl">Vista</span><div class="hz-grp" id="b-vista"></div></div>
      <div class="hz-item"><span class="hz-lbl">Medida</span><div class="hz-grp" id="b-extra"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando producción de cemento…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  IND.armar({
    archivo: 'ind_cemento.json',
    tipo: 'flujo',
    unidad: 't',
    umbrales: [3, 10],
    fuente: 'INE — Producción, venta y consumo de cemento',
    series: [
      { k: 'produccion', boton: 'Producción', corto: 'Producción', mide: 'Toneladas de cemento producidas', acum: 'se produjeron {v} de cemento' },
      { k: 'consumo', boton: 'Consumo', corto: 'Consumo', mide: 'Toneladas de cemento consumidas en el país', acum: 'se consumieron {v} de cemento' }
    ],
    preguntas: function (A) {
      return [
        ['¿Qué mide?', '<p>La <strong>producción</strong> es el cemento que sale de las fábricas del país en el mes, en toneladas métricas. El <strong>consumo</strong> es el cemento demandado en el país, por departamento de destino.</p>' +
          '<p>Las cifras las reportan las empresas productoras al INE. La producción se publica desde ' + A.primeroAnio('produccion') + ' y el consumo, desde ' + A.primeroAnio('consumo') + '.</p>'],
        ['¿Por qué adelanta al PIB?', 'Casi todo el cemento termina en una obra: viviendas, edificios, caminos. No se guarda mucho tiempo, así que lo que se despacha este mes es obra que se está haciendo ahora. Es uno de los primeros datos de la <strong>construcción</strong> y de la <strong>inversión</strong>, que el PIB trimestral recién muestra meses después.'],
        ['¿Producción o consumo?', 'Se mueven juntos y en el largo plazo casi coinciden. El <strong>consumo</strong> se acerca más a la demanda de las obras; la <strong>producción</strong> puede adelantarse o atrasarse respecto de las ventas cuando las fábricas acumulan o reducen inventario, y la afectan las paradas de planta.'],
        ['Notas del INE', 'Las cifras ' + (A.prelim ? 'de ' + A.prelim + ' en adelante ' : '') + 'son <strong>preliminares</strong> (p): el INE puede revisarlas cuando las empresas corrigen sus reportes. Un mes con una caída brusca suele ser una parada de planta o un bloqueo de caminos, no necesariamente un cambio de la demanda.']
      ];
    }
  });
  </script>
</body>
</html>
