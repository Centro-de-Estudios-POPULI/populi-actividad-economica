<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Índice de Transporte · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <script src="ind_mensual.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Índice de Transporte</div>
      <div class="sec-sub" id="sub">Índice general de transporte (2017 = 100), un año por línea</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Modo</span><div class="hz-grp" id="b-serie"></div></div>
      <div class="hz-item"><span class="hz-lbl">Vista</span><div class="hz-grp" id="b-vista"></div></div>
      <div class="hz-item"><span class="hz-lbl">Medida</span><div class="hz-grp" id="b-extra"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando índice de transporte…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  IND.armar({
    archivo: 'ind_transporte.json',
    tipo: 'indice',
    unidad: 'indice',
    umbrales: [2, 8],
    fuente: 'INE — Índice general de transporte',
    series: [
      { k: 'general', boton: 'Total', corto: 'Índice general', mide: 'Volumen de transporte de carga y pasajeros (índice: 100 = promedio de 2017)', acum: 'el índice promedió {v}' },
      { k: 'carretero', boton: 'Carretera', corto: 'Carretero', mide: 'Transporte por carretera (índice: 100 = promedio de 2017)', acum: 'el transporte carretero promedió {v}' },
      { k: 'aereo', boton: 'Aéreo', corto: 'Aéreo', mide: 'Transporte aéreo (índice: 100 = promedio de 2017)', acum: 'el transporte aéreo promedió {v}' },
      { k: 'ferroviario', boton: 'Tren', corto: 'Ferroviario', mide: 'Transporte por tren (índice: 100 = promedio de 2017)', acum: 'el transporte ferroviario promedió {v}' },
      { k: 'ductos', boton: 'Ductos', corto: 'Ductos', mide: 'Transporte de hidrocarburos por ductos (índice: 100 = promedio de 2017)', acum: 'el transporte por ductos promedió {v}' },
      { k: 'urbano', boton: 'Urbano', corto: 'Urbano', mide: 'Transporte urbano de pasajeros (índice: 100 = promedio de 2017)', acum: 'el transporte urbano promedió {v}' }
    ],
    preguntas: function (A) {
      return [
        ['¿Qué mide?', '<p>El <strong>volumen de transporte</strong> de carga y pasajeros del país como índice: el promedio de 2017 vale 100, así que 90 es 10% menos movimiento que en 2017.</p>' +
          '<p>Combina cinco modalidades: <strong>carretero</strong>, <strong>ferroviario</strong>, <strong>aéreo</strong>, <strong>ductos</strong> (gas y líquidos por tubería) y <strong>urbano</strong> (pasajeros en las ciudades).</p>'],
        ['¿Por qué adelanta al PIB?', 'Casi todo lo que se produce, se importa o se exporta se mueve por camino, tren o ducto antes de venderse. El índice anticipa al sector <strong>Transporte y comunicaciones</strong> del PIB y refleja el pulso del comercio y de la producción; el de ductos sigue a los hidrocarburos.'],
        ['¿Por qué mirar cada modalidad?', 'Cada una cuenta algo distinto. Los <strong>bloqueos de caminos</strong> y la <strong>falta de combustible</strong> se ven primero en el carretero y arrastran al índice general; el aéreo responde al turismo y a los viajes de negocios; el de ductos, a la producción y la exportación de gas.'],
        ['Notas del INE', 'Índice de volumen con año de referencia 2017 (base móvil). Las cifras ' + (A.prelim ? 'de ' + A.prelim + ' en adelante ' : '') + 'son <strong>preliminares</strong> (p), sujetas a revisión.']
      ];
    }
  });
  </script>
</body>
</html>
