<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="GDP structure by activity · Populi">Estructura del PIB por actividad · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <!-- En los apilados la cifra grande va en tinta: el color de la serie es de la rampa y no dice «sube» o «baja»;
       el rojo del protagonista se leía como caída («Consumo +1,1 pp» en rojo). La línea superior de la tarjeta
       sigue marcando a qué serie corresponde, y la pastilla de abajo el tono. -->
  <style>.kpi-val { color: var(--tinta) !important; }</style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title" data-en='<span class="accent-bar"></span>GDP structure by economic activity'><span class="accent-bar"></span>Estructura del PIB por actividad económica</div>
      <div class="sec-sub" id="sub" data-en="Share of each activity in GDP at current prices, by year (%)">Participación de cada actividad en el PIB a precios corrientes, por año (%)</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl" data-en="Measure">Medida</span><div class="hz-grp" id="b-medida"></div></div>
      <div class="hz-item"><span class="hz-lbl" data-en="Grouping">Agrupación</span><div class="hz-grp" id="b-agrup"></div></div>
      <div class="hz-item"><span class="hz-lbl" data-en="Period">Período</span><div class="hz-grp" id="b-frec"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl">
          <div class="tog-grp" id="pastillas-act"></div>
          <div class="tog-grp" id="pastillas-gran" style="display:none"></div>
        </div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span data-en="Loading GDP structure…">Cargando la estructura del PIB…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t" data-en="Reading the indicator">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    var tr = PM.t;   // tr('castellano', 'inglés'): con ?lang=en el gráfico sale en inglés (acá T son los trimestres)
    // ── Nombres de los datos en inglés (actividades del INE): UN solo diccionario, idéntico en los cuatro gráficos
    // sectoriales del PIB. Las claves son los nombres exactos de data/pib_actividad.json (nombre, nombre_largo y los
    // grandes sectores). N() se aplica sólo donde el nombre se MUESTRA; los datos se buscan siempre por su clave (k). ──
    var EN = {
      'PIB': 'GDP',
      'Producto interno bruto (a precios de mercado)': 'Gross domestic product (at market prices)',
      'Impuestos': 'Taxes',
      'Derechos sobre importaciones, IVA no deducible, IT y otros impuestos indirectos': 'Import duties, non-deductible VAT, transactions tax (IT) and other indirect taxes',
      'VAB': 'GVA',
      'Valor agregado bruto': 'Gross value added',
      'Agropecuaria': 'Agriculture',
      'Agricultura, ganadería, silvicultura y pesca': 'Agriculture, livestock, forestry and fishing',
      'Extractiva': 'Extractive industries',
      'Actividad extractiva (hidrocarburos y minería)': 'Extractive activity (hydrocarbons and mining)',
      'Manufactura': 'Manufacturing',
      'Industrias manufactureras': 'Manufacturing industries',
      'Electricidad y agua': 'Electricity and water',
      'Suministro de electricidad, gas, agua y recolección de desechos': 'Electricity, gas and water supply and waste collection',
      'Construcción': 'Construction',
      'Comercio': 'Commerce',
      'Transporte': 'Transport',
      'Transporte y comunicaciones': 'Transport and communications',
      'Alojamiento': 'Accommodation',
      'Actividades de alojamiento y servicio de comidas': 'Accommodation and food service activities',
      'Financieras': 'Financial services',
      'Actividades financieras y de seguros, inmobiliarias y servicios a las empresas': 'Financial and insurance activities, real estate and business services',
      'Adm. pública': 'Public admin.',
      'Administración pública, salud y educación de no mercado': 'Public administration, non-market health and education',
      'Comunales': 'Community services',
      'Actividades comunales, sociales y personales': 'Community, social and personal activities',
      'Primario': 'Primary',
      'Secundario': 'Secondary',
      'Terciario': 'Tertiary'
    };
    var N = function (s) { return PM.en && EN[s] != null ? EN[s] : s; };
    // ── Colores de los APILADOS: la rampa de la marca EN ORDEN (populi-marca/paleta.py, RAMPA_POR_N; README,
    // regla 7). De ABAJO hacia ARRIBA del rojo a la tinta, con un solo paso cálido (el oro) después del rojo:
    // el protagonista abajo y en rojo; lo que completa el PIB arriba, en gris tenue, fuera del recorrido.
    // · «3 grandes sectores»: rampa(3) primario, secundario, terciario; los impuestos arriba en gris tenue.
    // · «Por actividad»: 12 rubros no entran en la rampa. Van las 6 actividades de MAYOR peso promedio en el
    //   PIB (de 2017 al último dato, calculado de la estructura) en rampa(6), de mayor a menor peso, y el
    //   «Resto» arriba en gris tenue: las otras 5 actividades y los impuestos (el tooltip y la lectura dicen
    //   qué hay adentro). Validado con el script de la marca, vecinos de la pila en los dos temas: ΔE ≥ 15,9
    //   en visión normal y ≥ 15,6 con daltonismo. La tinta es un token: en el tema oscuro es #E2E8F0.
    // (El ranking y los paneles de actividad no son apilados: conservan su código por signo.)
    var TINTA = { claro: '#001219', oscuro: '#E2E8F0' }, RESTO = { claro: '#C9CDCE', oscuro: '#3A4549' };
    var RAMPA = { 3: ['#C71E1D', '#EE9B00', '#0A9396'], 6: ['#C71E1D', '#EE9B00', '#94D2BD', '#0A9396', '#005F73', TINTA] };
    var PIB = TINTA, NB = ' ';
    var GRUPOS = {};   // agrupación → piezas de la pila, de abajo hacia arriba: [{k, nombre, color, miembros}]
    function armarGrupos() {
      var n = D.trimestres.length;
      var peso = function (k) { return D.estructura[k].reduce(function (s, v) { return s + v; }, 0) / n; };
      var orden = D.sectores.slice().sort(function (a, b) { return peso(b) - peso(a); });
      GRUPOS.act = orden.slice(0, 6).map(function (k, j) { return { k: k, nombre: NOM[k], color: RAMPA[6][j], miembros: [k] }; })
        .concat([{ k: 'resto', nombre: tr('Resto', 'Other'), color: RESTO, miembros: orden.slice(6).concat(['impuestos']) }]);
      GRUPOS.gran = Object.keys(D.grandes).map(function (g, j) { return { k: g, nombre: NOM[g], color: RAMPA[3][j], miembros: [g] }; })
        .concat([{ k: 'impuestos', nombre: NOM.impuestos, color: RESTO, miembros: ['impuestos'] }]);
      PESO = {}; orden.forEach(function (k) { PESO[k] = peso(k); });
    }
    var PESO = {};
    function comps(g) { return GRUPOS[g || estado.agrup]; }
    // los rubros de la agrupación (las 11 actividades o los 3 grandes sectores, y los impuestos) y la pieza que los contiene
    function rubros() { return (estado.agrup === 'gran' ? Object.keys(D.grandes) : D.sectores.slice()).concat(['impuestos']); }
    function piezaDe(k) { return comps().filter(function (c) { return c.miembros.indexOf(k) >= 0; })[0]; }
    function resto() { return comps().filter(function (c) { return c.miembros.length > 1; })[0]; }
    var estado = { medida: 'pct', agrup: 'act', frec: 'anual', idx: null };
    var D, M, T, NOM = {}, grafico;
    var P = {};          // períodos por frecuencia: {claves, corr: {k: [MM Bs]}, pct: {k: [%]}, vol: {k: [índice]}}
    var activas = { act: null, gran: null };

    PM.cargar(['pib_actividad.json']).then(function (r) {
      D = r[0]; M = D.metadata; T = D.trimestres;
      D.rubros.forEach(function (x) { NOM[x.k] = N(x.nombre); });
      Object.keys(D.grandes).forEach(function (g) { NOM[g] = N(D.grandes[g].nombre); });
      armarGrupos(); armar();
      PM.botonera(document.getElementById('b-medida'), [['pct', tr('% del PIB', '% of GDP')], ['mm', tr('MM Bs corrientes', 'Current Bs M')]],
        estado.medida, function (v) { estado.medida = v; subtitulo(); grafico.redibujar(); panel(estado.idx); });
      PM.botonera(document.getElementById('b-agrup'), [['act', tr('Por actividad', 'By activity')], ['gran', tr('3 grandes sectores', '3 broad sectors')]],
        estado.agrup, function (v) {
          estado.agrup = v;
          document.getElementById('pastillas-act').style.display = v === 'act' ? '' : 'none';
          document.getElementById('pastillas-gran').style.display = v === 'gran' ? '' : 'none';
          subtitulo(); cifras(); grafico.redibujar(); panel(estado.idx);
        });
      PM.botonera(document.getElementById('b-frec'), [['anual', tr('Anual', 'Annual')], ['trim', tr('Trimestral', 'Quarterly')]],
        estado.frec, function (v) {
          estado.frec = v; estado.idx = P[v].claves.length - 1;
          subtitulo(); cifras(); grafico.redibujar(); panel(estado.idx);
        });
      ['act', 'gran'].forEach(function (g) {
        var cs = comps(g);
        activas[g] = new Set(cs.map(function (c) { return c.k; }));
        PM.pastillas(document.getElementById('pastillas-' + g),
          cs.map(function (c) { return { k: c.k, nombre: c.nombre, color: c.color, forma: 'area' }; }),
          activas[g], function () { grafico.redibujar(); });
      });
      estado.idx = P[estado.frec].claves.length - 1;
      // las pastillas visibles son las de la agrupación de entrada (no las que el HTML deja a la vista)
      document.getElementById('pastillas-act').style.display = estado.agrup === 'act' ? '' : 'none';
      document.getElementById('pastillas-gran').style.display = estado.agrup === 'gran' ? '' : 'none';
      subtitulo(); cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(p.dataIndex); });
      panel(estado.idx);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx); });
      PM.preguntas(document.getElementById('preguntas'), preguntas());
      document.getElementById('fuente').innerHTML = tr(
        'Fuente: <a href="' + M.url + '" target="_blank" rel="noopener">INE — PIB trimestral por actividad económica (referencia 2017)</a> · Elaboración: Centro de Estudios POPULI · Datos al: ',
        'Source: <a href="' + M.url + '" target="_blank" rel="noopener">INE (National Statistics Institute) — Quarterly GDP by economic activity (reference year 2017)</a> · Analysis: Centro de Estudios POPULI · Data as of: ') + PM.fecha(M.ultimo);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    // Leyenda de la imagen: la del molde descarta las series cuyo nombre coincide con una pastilla OCULTA, y
    // «Impuestos» (y «PIB») tienen pastilla en las dos agrupaciones: se declara la de la agrupación visible.
    PM.leyendaImagen = function () {
      var act = activas[estado.agrup];
      return comps().filter(function (c) { return act.has(c.k); })
        .map(function (c) { return { name: c.nombre, color: PM.col(c.color), forma: 'area' }; });
    };

    function serieCorr(k) { return D.grandes[k] ? D.grandes[k].corrientes : D.corrientes[k]; }
    function serieEstr(k) { return D.grandes[k] ? D.grandes[k].estructura : D.estructura[k]; }

    // Trimestral: la estructura publicada por el INE. Anual: la suma de los cuatro trimestres a precios
    // corrientes (los montos corrientes sí se suman) dividida por la del PIB; sólo años completos.
    function armar() {
      var todos = Object.keys(D.grandes).concat(D.sectores, ['impuestos', 'pib']);
      P.trim = { claves: T.slice(), corr: {}, pct: {}, vol: {} };
      todos.forEach(function (k) {
        P.trim.corr[k] = serieCorr(k).slice();
        P.trim.pct[k] = k === 'pib' ? T.map(function () { return 100; }) : serieEstr(k).slice();
        if (D.indice[k]) P.trim.vol[k] = D.indice[k].slice();
      });
      var anios = [], pos = {};
      T.forEach(function (t, i) { var a = t.slice(0, 4); if (!pos[a]) { pos[a] = []; anios.push(a); } pos[a].push(i); });
      anios = anios.filter(function (a) { return pos[a].length === 4; });
      P.anual = { claves: anios, corr: {}, pct: {}, vol: {} };
      var suma = function (s, a) { return pos[a].reduce(function (x, i) { return x + s[i]; }, 0); };
      todos.forEach(function (k) {
        P.anual.corr[k] = anios.map(function (a) { return suma(serieCorr(k), a); });
        // índice de volumen del año: el promedio de sus cuatro trimestres (2017 = 100)
        if (D.indice[k]) P.anual.vol[k] = anios.map(function (a) { return suma(D.indice[k], a) / 4; });
      });
      todos.forEach(function (k) {
        P.anual.pct[k] = P.anual.corr[k].map(function (v, j) { return v / P.anual.corr.pib[j] * 100; });
      });
    }

    var pct = function () { return estado.medida === 'pct'; };
    function valorP(c, campo, j) { var Q = P[estado.frec]; return c.miembros.reduce(function (s, m) { return s + Q[campo][m][j]; }, 0); }
    // qué hay adentro de una pieza con varios rubros, del mayor al menor peso
    function adentro(c, j) {
      var Q = P[estado.frec];
      return c.miembros.slice().sort(function (a, b) { return Q.pct[b][j] - Q.pct[a][j]; })
        .map(function (m) { return NOM[m] + NB + (pct() ? PM.pct(Q.pct[m][j], 1) : PM.auto(Q.corr[m][j])); }).join(' · ');
    }
    function etiqueta(j) { var c = P[estado.frec].claves[j]; return estado.frec === 'anual' ? c : PM.fecha(c); }
    // el período de comparación: 2017 en el anual; el MISMO trimestre de 2017 en el trimestral (la estructura
    // trimestral tiene estacionalidad: la agropecuaria pesa más en el T2 de cada año)
    function base(j) {
      var Q = P[estado.frec];
      if (estado.frec === 'anual') return 0;
      var p = PM.periodo(Q.claves[j]), b = Q.claves.indexOf(Q.claves[0].slice(0, 4) + '-T' + p.t);
      return b < 0 ? 0 : b;
    }

    function quien() {
      return estado.agrup === 'gran' ? tr('cada gran sector y cuánto son los impuestos', 'each broad sector and how much taxes amount to') : tr('cada una de las 6 actividades de mayor peso y el resto (las otras 5 y los impuestos)', 'each of the 6 largest activities and the rest (the other 5 and taxes)');
    }
    function subtitulo() {
      document.getElementById('sub').textContent = pct()
        ? tr('Qué parte del PIB genera ' + quien() + ', a precios corrientes: cada barra es el PIB ' + (estado.frec === 'anual' ? 'del año' : 'del trimestre') + ' (100%).',
          'What share of GDP is generated by ' + quien() + ', at current prices: each bar is GDP for the ' + (estado.frec === 'anual' ? 'year' : 'quarter') + ' (100%).')
        : tr('Valor de lo que genera ' + quien() + ', en millones de bolivianos corrientes: cada barra suma el PIB ' + (estado.frec === 'anual' ? 'del año.' : 'del trimestre.'),
          'Value generated by ' + quien() + ', in millions of current bolivianos: each bar adds up to GDP for the ' + (estado.frec === 'anual' ? 'year.' : 'quarter.'));
    }

    function cifras() {
      var Q = P[estado.frec], j = Q.claves.length - 1, b = base(j);
      var lista = rubros().map(function (k) { return { c: { k: k, nombre: NOM[k], color: piezaDe(k).color }, v: Q.pct[k][j], d: Q.pct[k][j] - Q.pct[k][b] }; });
      var porPeso = lista.slice().sort(function (a, b) { return b.v - a.v; });
      var porCambio = lista.slice().sort(function (a, b) { return b.d - a.d; });
      var gana = porCambio[0], pierde = porCambio[porCambio.length - 1];
      var desde = estado.frec === 'anual' ? Q.claves[0] : PM.fecha(Q.claves[b]);
      var serie = function (k) { return PM.ultimos(Q.pct[k], estado.frec === 'anual' ? 12 : 16); };
      var cuando = estado.frec === 'anual' ? tr('en ' + etiqueta(j), 'in ' + etiqueta(j)) : tr('en el ' + etiqueta(j), 'in ' + etiqueta(j));
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: PM.tx(porPeso[0].c.color), rotulo: tr('Mayor peso · ' + porPeso[0].c.nombre, 'Largest share · ' + porPeso[0].c.nombre), valor: PM.pct(porPeso[0].v, 1), delta: tr('del PIB ' + cuando, 'of GDP ' + cuando),
          tono: 'neutro', serie: serie(porPeso[0].c.k) }) +
        PM.kpi({ color: PM.tx(porPeso[1].c.color), rotulo: tr('Segundo peso · ' + porPeso[1].c.nombre, 'Second-largest share · ' + porPeso[1].c.nombre), valor: PM.pct(porPeso[1].v, 1), delta: tr('del PIB ' + cuando, 'of GDP ' + cuando),
          tono: 'neutro', serie: serie(porPeso[1].c.k) }) +
        PM.kpi({ color: PM.tx(gana.c.color), rotulo: tr('Ganó más peso · ' + gana.c.nombre, 'Gained the most share · ' + gana.c.nombre), valor: PM.pp(gana.d, 1), delta: tr('desde ' + desde, 'since ' + desde),
          tono: 'neutro', serie: serie(gana.c.k) }) +
        PM.kpi({ color: PM.tx(pierde.c.color), rotulo: tr('Perdió más peso · ' + pierde.c.nombre, 'Lost the most share · ' + pierde.c.nombre), valor: PM.pp(pierde.d, 1), delta: tr('desde ' + desde, 'since ' + desde),
          tono: 'neutro', serie: serie(pierde.c.k) });
    }

    function opciones() {
      var Q = P[estado.frec], cs = comps(), act = activas[estado.agrup], anual = estado.frec === 'anual';
      var el = document.getElementById('chart');
      // Barras apiladas al 100%: la estructura trimestral tiene 36 barras y la anual 9 (≤ 90: sin modo large).
      var series = cs.filter(function (c) { return act.has(c.k); }).map(function (c) {
        return PM.barra(c.color, { extra: {
          name: c.nombre, stack: 'e', barCategoryGap: anual ? '34%' : '22%', barMaxWidth: anual ? 54 : 22,
          data: Q.claves.map(function (x, j) { return +valorP(c, pct() ? 'pct' : 'corr', j).toFixed(3); })
        } });
      });
      // con todas las piezas a la vista, el 100% es exacto: el eje se cierra ahí
      var todas = cs.every(function (c) { return act.has(c.k); });
      return {
        grid: PM.grid(pct() ? { top: 16 } : null),
        xAxis: PM.ejeTiempo(Q.claves, el, { boundaryGap: true }),
        yAxis: PM.ejeY({ unidad: pct() ? '' : tr('MM Bs', 'Bs M'), fmt: pct() ? 'pct' : null, extra: { max: pct() && todas ? 100 : null } }),
        tooltip: PM.tooltip(function (ps) {
          if (!ps.length) return '';
          var j = ps[0].dataIndex, chico = PM.pequeno();
          panel(j);
          var h = PM.ttTitulo(etiqueta(j), pct() ? tr('Participación en el PIB corriente', 'Share of current-price GDP') : tr('Millones de Bs corrientes', 'Millions of current Bs'));
          var filas = cs.filter(function (c) { return act.has(c.k); }).slice().reverse();   // de arriba hacia abajo, como la pila
          // en el teléfono el vidrio va arriba del lienzo: las cinco piezas más grandes
          if (chico && filas.length > 6) filas = filas.slice().sort(function (a, b) { return valorP(b, 'pct', j) - valorP(a, 'pct', j); }).slice(0, 5);
          filas.forEach(function (c) {
            h += PM.ttFila(c.color, c.nombre, pct() ? PM.pct(valorP(c, 'pct', j), 1) : PM.auto(valorP(c, 'corr', j)), 'area');
          });
          h += PM.ttTotal(tr('PIB', 'GDP'), pct() ? '100%' : PM.mm(Q.corr.pib[j], 'Bs'));
          var r = resto();
          if (r && act.has(r.k)) h += PM.ttPie('<strong style="color:#fff">' + r.nombre + ':</strong> ' + adentro(r, j));
          return h;
        }, { axisPointer: PM.sombraEje() }),
        series: series
      };
    }

    // Umbrales de la lectura: un cambio de peso de 1 pp o más desde el período base es «un cambio». ¿Precio o
    // volumen? El peso a precios corrientes sube si la actividad produce más que el resto o si sus precios suben
    // más que el promedio. Con su volumen relativo (índice de la actividad / índice del PIB) se calcula cuánto
    // pesaría si sus precios hubieran subido como el promedio; lo que falta hasta su peso real es precio
    // relativo. Si eso es la mitad o más de lo que ganó, el texto dice «precio»; si no, «volumen».
    var CAMBIO = 1, MITAD = 0.5;
    function lectura(j, lista) {
      var Q = P[estado.frec], b = base(j), desde = estado.frec === 'anual' ? Q.claves[b] : PM.fecha(Q.claves[b]);
      var orden = lista.slice().sort(function (x, y) { return y.d - x.d; }), g = orden[0], p = orden[orden.length - 1];
      if (j === b) return tr('Es el período base de la comparación: elegí otro para ver cómo cambió el peso de cada ' + (estado.agrup === 'gran' ? 'gran sector' : 'actividad') + '.',
        'This is the base period of the comparison: choose another one to see how the share of each ' + (estado.agrup === 'gran' ? 'broad sector' : 'activity') + ' changed.');
      if (Math.abs(g.d) < CAMBIO && Math.abs(p.d) < CAMBIO) return tr('Frente a ' + desde + ' la estructura casi no cambió: ningún rubro ganó ni perdió 1 pp o más de peso.',
        'Versus ' + desde + ' the structure barely changed: no item gained or lost 1 pp or more of share.');
      var t = tr('Frente a ' + desde + ', <strong>' + g.c.nombre + '</strong> ganó ' + PM.dt(g.c.color, PM.pp(g.d, 1)) + ' de peso y <strong>' + p.c.nombre +
        '</strong> perdió ' + PM.dt(p.c.color, PM.num(-p.d, 1) + NB + 'pp') + '.',
        'Versus ' + desde + ', <strong>' + g.c.nombre + '</strong> gained ' + PM.dt(g.c.color, PM.pp(g.d, 1)) + ' of share and <strong>' + p.c.nombre +
        '</strong> lost ' + PM.dt(p.c.color, PM.num(-p.d, 1) + NB + 'pp') + '.');
      var vg = Q.vol[g.c.k], vp = Q.vol.pib;
      if (vg && g.d >= CAMBIO) {
        var cg = vg[j] / vg[b] * 100 - 100, cp = vp[j] / vp[b] * 100 - 100;
        var s0 = Q.pct[g.c.k][b], sv = s0 * (vg[j] / vg[b]) / (vp[j] / vp[b]), dPre = Q.pct[g.c.k][j] - sv;
        t += tr(' Su volumen ' + (cg >= 0 ? 'creció ' : 'cayó ') + PM.pct(cg, 1, true) + ' (el PIB, ' + PM.pct(cp, 1, true) + '): con precios que subieran como el promedio pesaría ' +
          PM.pct(sv, 1) + '. ' + (dPre >= MITAD * g.d
            ? 'La mayor parte de lo que ganó (' + PM.pp(dPre, 1) + ') es <strong>precio relativo</strong>.'
            : 'La mayor parte de lo que ganó (' + PM.pp(sv - s0, 1) + ') es <strong>volumen</strong>.'),
          ' Its volume ' + (cg >= 0 ? 'grew ' : 'fell ') + PM.pct(cg, 1, true) + ' (GDP, ' + PM.pct(cp, 1, true) + '): with prices rising in line with the average it would account for ' +
          PM.pct(sv, 1) + '. ' + (dPre >= MITAD * g.d
            ? 'Most of what it gained (' + PM.pp(dPre, 1) + ') is <strong>relative price</strong>.'
            : 'Most of what it gained (' + PM.pp(sv - s0, 1) + ') is <strong>volume</strong>.'));
      }
      return t;
    }

    function panel(j) {
      var Q = P[estado.frec];
      if (j == null || !Q || !Q.claves[j]) return;
      estado.idx = j;
      var b = base(j), r = resto();
      var lista = rubros().map(function (k) { return { c: { k: k, nombre: NOM[k], color: piezaDe(k).color }, v: Q.pct[k][j], d: Q.pct[k][j] - Q.pct[k][b] }; });
      var top = lista.slice().sort(function (x, y) { return y.v - x.v; }).slice(0, 3);
      // crecimiento nominal del PIB frente al período anterior comparable (año anterior o mismo trimestre del año anterior)
      var ant = estado.frec === 'anual' ? j - 1 : Q.claves.indexOf((+Q.claves[j].slice(0, 4) - 1) + Q.claves[j].slice(4));
      var nom = ant >= 0 ? Q.corr.pib[j] / Q.corr.pib[ant] * 100 - 100 : null;
      var desde = estado.frec === 'anual' ? Q.claves[b] : PM.fecha(Q.claves[b]);
      document.getElementById('panel-fecha').textContent = etiqueta(j);
      document.getElementById('panel').innerHTML =
        PM.pb(PIB, tr('PIB a precios corrientes', 'GDP at current prices'), PM.mm(Q.corr.pib[j], 'Bs'), nom == null ? tr('Primer período de la serie.', 'First period of the series.') :
          tr('Variación nominal frente a ' + (estado.frec === 'anual' ? Q.claves[ant] : 'el ' + PM.fecha(Q.claves[ant])) + ': <strong>' + PM.pct(nom, 1, true) + '</strong> (volumen y precios juntos).',
            'Nominal change versus ' + (estado.frec === 'anual' ? Q.claves[ant] : PM.fecha(Q.claves[ant])) + ': <strong>' + PM.pct(nom, 1, true) + '</strong> (volume and prices together).')) +
        top.map(function (x, n) {
          return PM.pb(x.c.color, tr((n + 1) + '.º · ' + x.c.nombre, ['1st', '2nd', '3rd'][n] + ' · ' + x.c.nombre), PM.pct(x.v, 1),
            PM.mm(Q.corr[x.c.k][j], 'Bs') + (j !== b ? tr('. Frente a ' + desde + ': <strong>' + PM.pp(x.d, 1) + '</strong>', '. Versus ' + desde + ': <strong>' + PM.pp(x.d, 1) + '</strong>') : '') + '.');
        }).join('') +
        (r && r.miembros.length > 1 ? PM.pb(r.color, tr('Adentro del Resto', 'Inside Other'), PM.pct(valorP(r, 'pct', j), 1), adentro(r, j)) : '') +
        PM.ctx(lectura(j, lista));
    }

    function preguntas() {
      var A = P.anual, n = A.claves.length - 1, imp = A.pct.impuestos;
      return [
        [tr('¿Qué mide la estructura del PIB?', 'What does the GDP structure measure?'), tr('El <strong>peso</strong> de cada actividad en el valor de todo lo que produce la economía, medido a precios corrientes (los de cada período). Las actividades y los impuestos suman el 100%.',
          'The <strong>share</strong> of each activity in the value of everything the economy produces, measured at current prices (those of each period). The activities and taxes add up to 100%.')],
        [tr('¿Por qué a precios corrientes?', 'Why at current prices?'), tr('Porque las medidas de volumen encadenadas del INE <strong>no se pueden sumar</strong>: la suma de las actividades no da el PIB. Los montos a precios corrientes sí se suman, y son los que permiten calcular el peso de cada parte. <p>La contracara: un peso que sube puede ser <strong>precio y no producción</strong>. Si los minerales se encarecen, la extractiva pesa más aunque extraiga lo mismo.</p>',
          'Because the INE’s chained volume measures <strong>cannot be added up</strong>: the sum of the activities does not give GDP. Amounts at current prices do add up, and they are what make it possible to calculate the share of each part. <p>The flip side: a rising share may be <strong>price rather than output</strong>. If minerals become more expensive, extractive industries weigh more even if they extract the same amount.</p>')],
        [tr('Anual o trimestral', 'Annual or quarterly'), tr('El peso <strong>anual</strong> suma los cuatro trimestres de cada año, a precios corrientes, y lo divide por el PIB del año: es el que conviene para comparar años. El <strong>trimestral</strong> es el que publica el INE y tiene estacionalidad (la agropecuaria pesa más en el segundo trimestre, el de la cosecha): por eso cada trimestre se compara con el mismo trimestre de 2017.',
          'The <strong>annual</strong> share adds up the four quarters of each year, at current prices, and divides the result by the year’s GDP: it is the right one for comparing years. The <strong>quarterly</strong> share is the one the INE publishes and it is seasonal (agriculture weighs more in the second quarter, the harvest quarter): that is why each quarter is compared with the same quarter of 2017.')],
        [tr('El peso de los impuestos', 'The share of taxes'), tr('Los impuestos sobre los productos (IVA no deducible, derechos sobre las importaciones, IT y otros) ' + (imp[n] < imp[0] ? 'bajaron' : 'subieron') + ' de <strong>' + PM.pct(imp[0], 1) + '</strong> del PIB en ' + A.claves[0] + ' a <strong>' + PM.pct(imp[n], 1) + '</strong> en ' + A.claves[n] + '. Dependen de cuánto se importa y se consume con factura, no de lo que produce una actividad: su peso puede moverse distinto que el de las actividades.',
          'Taxes on products (non-deductible VAT, import duties, the transactions tax (IT) and others) ' + (imp[n] < imp[0] ? 'fell' : 'rose') + ' from <strong>' + PM.pct(imp[0], 1) + '</strong> of GDP in ' + A.claves[0] + ' to <strong>' + PM.pct(imp[n], 1) + '</strong> in ' + A.claves[n] + '. They depend on how much is imported and consumed with an invoice, not on what an activity produces: their share can move differently from that of the activities.')],
        [tr('¿Qué son los tres grandes sectores?', 'What are the three broad sectors?'), tr('Una agregación de <strong>POPULI</strong>, no del INE. <p><strong>Primario</strong>: agropecuaria y extractiva. <strong>Secundario</strong>: manufactura, electricidad y agua, y construcción. <strong>Terciario</strong>: comercio, transporte, alojamiento, financieras, administración pública y servicios comunales. A precios corrientes los montos se suman: el peso de un gran sector es la suma exacta de los de sus actividades.</p>',
          'An aggregation by <strong>POPULI</strong>, not by the INE. <p><strong>Primary</strong>: agriculture and extractive industries. <strong>Secondary</strong>: manufacturing, electricity and water, and construction. <strong>Tertiary</strong>: commerce, transport, accommodation, financial services, public administration and community services. At current prices the amounts add up: the share of a broad sector is the exact sum of those of its activities.</p>')],
        [tr('¿Qué hay en el «Resto»?', 'What is in “Other”?'), tr('Con las once actividades y los impuestos son doce piezas, y la paleta de la casa sólo distingue seis en una pila. En «Por actividad» van las seis de <strong>mayor peso promedio</strong> en el PIB (' + GRUPOS.act.slice(0, 6).map(function (c) { return c.nombre.toLowerCase() + ' ' + PM.pct(PESO[c.k], 1); }).join(', ') + ') y el resto junto: ' + GRUPOS.act[6].miembros.map(function (k) { return k === 'impuestos' ? 'los impuestos' : NOM[k].toLowerCase(); }).join(', ') + '. <p>El peso de cada uno está en el tooltip y en la lectura.</p>',
          'With the eleven activities and taxes there are twelve pieces, and the house palette only distinguishes six in a stack. “By activity” shows the six with the <strong>largest average share</strong> of GDP (' + GRUPOS.act.slice(0, 6).map(function (c) { return c.nombre.toLowerCase() + ' ' + PM.pct(PESO[c.k], 1); }).join(', ') + ') and groups the rest together: ' + GRUPOS.act[6].miembros.map(function (k) { return k === 'impuestos' ? 'taxes' : NOM[k].toLowerCase(); }).join(', ') + '. <p>Each one’s share is in the tooltip and in the reading.</p>')],
        [tr('¿Son cifras definitivas?', 'Are these final figures?'), tr('No. El INE publica el PIB trimestral como <strong>cifras preliminares</strong>, sujetas a revisión cuando incorpora información más completa.',
          'No. The INE publishes quarterly GDP as <strong>preliminary figures</strong>, subject to revision when it incorporates more complete information.')]
      ];
    }
  })();
  </script>
</body>
</html>
