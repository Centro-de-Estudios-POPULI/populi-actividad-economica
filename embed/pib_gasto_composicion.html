<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="GDP by type of spending · Populi">PIB por tipo de gasto · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <!-- En los apilados la cifra grande va en tinta: el color de la serie es de la rampa y no dice «sube» o «baja»;
       el rojo del protagonista se leía como caída («Consumo +1,1 pp» en rojo). La línea superior de la tarjeta
       sigue marcando a qué serie corresponde, y la pastilla de abajo el tono. -->
  <style>.kpi-val { color: var(--tinta) !important; }</style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title" data-en='<span class="accent-bar"></span>What the economy’s output is used for'><span class="accent-bar"></span>En qué se usa lo que produce la economía</div>
      <div class="sec-sub" id="sub"></div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl" data-en="Measure">Medida</span><div class="hz-grp" id="b-medida"></div></div>
      <div class="hz-item"><span class="hz-lbl" data-en="Period">Período</span><div class="hz-grp" id="b-frec"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span data-en="Loading GDP by type of spending…">Cargando el PIB por tipo de gasto…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t" data-en="Reading the indicator">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C, NB = ' ';
    var tr = PM.t;   // tr('castellano', 'inglés'): con ?lang=en el gráfico sale en inglés (acá T son los trimestres)
    // ── Nombres de los componentes del gasto en inglés: UN solo diccionario, idéntico en los tres gráficos del PIB por
    // tipo de gasto. Las claves son los nombres exactos de data/pib_gasto.json (nombre, nombre_largo) y los que arma
    // cada gráfico (GASTO y BLOQUES). N() se aplica sólo donde el nombre se MUESTRA; los datos se buscan por su clave. ──
    var EN = {
      'PIB': 'GDP',
      'Producto interno bruto (a precios de mercado)': 'Gross domestic product (at market prices)',
      'Consumo de los hogares': 'Household consumption',
      'Gasto de consumo final de los hogares e instituciones sin fines de lucro (ISFLSH)': 'Final consumption expenditure of households and non-profit institutions serving households (NPISH)',
      'Hogares': 'Households',
      'Consumo del gobierno': 'Government consumption',
      'Gasto de consumo final de la administración pública': 'Final consumption expenditure of general government',
      'Gobierno': 'Government',
      'Formación bruta de capital': 'Gross capital formation',
      'Formación bruta de capital (inversión fija + variación de existencias + objetos valiosos)': 'Gross capital formation (fixed investment + change in inventories + valuables)',
      'Inversión fija (FBCF)': 'Fixed investment (GFCF)',
      'Formación bruta de capital fijo': 'Gross fixed capital formation',
      'Inversión fija': 'Fixed investment',
      'Existencias y otros': 'Inventories and other',
      'Variación de existencias y adquisición menos disposición de objetos valiosos (FBK − FBCF)': 'Change in inventories and acquisitions less disposals of valuables (GCF − GFCF)',
      'Existencias': 'Inventories',
      'Exportaciones': 'Exports',
      'Exportaciones de bienes y servicios': 'Exports of goods and services',
      'Importaciones': 'Imports',
      'Importaciones de bienes y servicios': 'Imports of goods and services',
      'Consumo': 'Consumption',
      'Inversión': 'Investment',
      'Sector externo neto': 'Net external sector'
    };
    var N = function (s) { return PM.en && EN[s] != null ? EN[s] : s; };
    // Mapa de colores del PIB por tipo de gasto: IDÉNTICO en composición, crecimiento y contribución, en el ORDEN DE
    // RAMPA de la marca (populi-marca/paleta.py, rampa(6); README, regla 7): de abajo hacia arriba, del rojo a la tinta,
    // siguiendo la identidad del gasto. El protagonista (el consumo de los hogares, ~70% del PIB) en rojo, apoyado en el
    // cero; las importaciones, la tinta, debajo del cero. La tinta es token (en oscuro, #E2E8F0). Vecinos medidos
    // (visión normal / daltonismo, pisos 15 / 8): rojo-oro 26/22 · oro-menta 20/16 · menta-turquesa 22/20 ·
    // turquesa-petróleo 16/16 · petróleo-tinta 28/28 en claro y 49/46 en oscuro.
    var GASTO = {
      hogares: { nombre: N('Consumo de los hogares'), corto: N('Hogares'), color: C.rojo },
      gobierno: { nombre: N('Consumo del gobierno'), corto: N('Gobierno'), color: C.oro },
      fbcf: { nombre: N('Inversión fija'), corto: N('Inversión fija'), color: C.menta },
      existencias: { nombre: N('Existencias y otros'), corto: N('Existencias'), color: C.turquesa },
      exportaciones: { nombre: N('Exportaciones'), corto: N('Exportaciones'), color: C.petroleo },
      importaciones: { nombre: N('Importaciones'), corto: N('Importaciones'), color: C.tinta },
      pib: { nombre: N('PIB'), corto: N('PIB'), color: C.tinta }
    };
    // Pila fija en el orden de la rampa (y de la identidad del gasto). ECharts apila por signo: los positivos suben desde
    // el cero y los negativos (las importaciones, que se restan, y las existencias cuando son negativas) bajan desde el
    // cero en el mismo orden; nada salta de una barra a otra. Pastillas, tooltip, leyenda de la imagen y CSV, igual.
    var PILA = ['hogares', 'gobierno', 'fbcf', 'existencias', 'exportaciones', 'importaciones'];
    var LECTURA = PILA;
    var estado = { medida: 'pct', frec: 'anual', idx: null };
    var activas = new Set(PILA.concat(['pib']));
    var J, M, T, D = {}, A = {}, grafico;
    var bs = function (v) { return PM.mm(v, 'Bs'); };
    var signo = function (k) { return k === 'importaciones' ? -1 : 1; };

    PM.cargar(['pib_gasto.json']).then(function (r) {
      J = r[0]; M = J.metadata; T = J.trimestres;
      armar();
      PM.botonera(document.getElementById('b-medida'), [['pct', tr('% del PIB', '% of GDP')], ['mmbs', tr('Millones de Bs', 'Millions of Bs')]],
        estado.medida, function (v) { estado.medida = v; subtitulo(); grafico.redibujar(); panel(estado.idx); });
      PM.botonera(document.getElementById('b-frec'), [['anual', tr('Anual', 'Annual')], ['trim', tr('Trimestral', 'Quarterly')]],
        estado.frec, function (v) { estado.frec = v; estado.idx = D[v].K.length - 1; subtitulo(); grafico.redibujar(); panel(estado.idx); });
      PM.pastillas(document.getElementById('pastillas'),
        PILA.map(function (k) { return { k: k, nombre: GASTO[k].corto, color: GASTO[k].color, forma: 'area' }; })
          .concat([{ k: 'pib', nombre: tr('PIB', 'GDP'), color: GASTO.pib.color, forma: 'linea' }]),
        activas, function () { grafico.redibujar(); });
      estado.idx = D[estado.frec].K.length - 1;
      subtitulo();
      cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(p.dataIndex); });
      panel(estado.idx);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx); });
      PM.preguntas(document.getElementById('preguntas'), preguntas());
      document.getElementById('fuente').innerHTML = tr(
        'Fuente: <a href="' + M.url + '" target="_blank" rel="noopener">INE — PIB trimestral por tipo de gasto, a precios corrientes</a> · Elaboración: Centro de Estudios POPULI · Datos al: ',
        'Source: <a href="' + M.url + '" target="_blank" rel="noopener">INE (National Statistics Institute) — Quarterly GDP by type of spending, at current prices</a> · Analysis: Centro de Estudios POPULI · Data as of: ') + PM.fecha(M.ultimo);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    // Montos (MM Bs corrientes) y participaciones (% del PIB) por trimestre y por año COMPLETO (suma de sus 4 trimestres)
    function armar() {
      var ks = Object.keys(J.corrientes);
      D.trim = { K: T.slice(), mm: {}, sh: {} };
      ks.forEach(function (k) { D.trim.mm[k] = J.corrientes[k].slice(); D.trim.sh[k] = J.estructura[k].slice(); });
      var por = {};
      T.forEach(function (k, i) { var a = PM.periodo(k).a; (por[a] = por[a] || []).push(i); });
      var anios = Object.keys(por).filter(function (a) { return por[a].length === 4; });
      D.anual = { K: anios, mm: {}, sh: {} };
      ks.forEach(function (k) {
        D.anual.mm[k] = anios.map(function (a) { var s = 0; por[a].forEach(function (i) { s += J.corrientes[k][i]; }); return s; });
      });
      ks.forEach(function (k) { D.anual.sh[k] = D.anual.mm[k].map(function (x, j) { return x / D.anual.mm.pib[j] * 100; }); });
      ['trim', 'anual'].forEach(function (f) { D[f].sh.saldo = D[f].sh.exportaciones.map(function (x, j) { return x - D[f].sh.importaciones[j]; }); });
      A.u = anios.length - 1; A.ult = anios[A.u]; A.pri = anios[0];
    }

    function subtitulo() {
      var pct = estado.medida === 'pct';
      document.getElementById('sub').textContent = pct
        ? tr('De cada 100 bolivianos que produce la economía, cuántos van a consumo, inversión y exportaciones, en % del PIB. Lo importado se resta: va debajo del cero',
          'Out of every 100 bolivianos the economy produces, how many go to consumption, investment and exports, in % of GDP. Imports are subtracted: they go below zero')
        : tr('En qué se usa lo que produce la economía, en millones de bolivianos corrientes' + (estado.frec === 'anual' ? ' por año' : ' por trimestre') + '. Lo importado se resta: va debajo del cero; la línea es el PIB',
          'What the economy’s output is used for, in millions of current bolivianos' + (estado.frec === 'anual' ? ' per year' : ' per quarter') + '. Imports are subtracted: they go below zero; the line is GDP');
    }

    function cifras() {
      var d = D.anual, u = A.u, sh = d.sh, p = 0;
      var linea = function (k) { return tr('en ' + A.pri + ': ' + PM.pct(sh[k][p], 1, k === 'saldo'), 'in ' + A.pri + ': ' + PM.pct(sh[k][p], 1, k === 'saldo')); };
      var tono = function (k, alzaBuena) { var x = sh[k][u] - sh[k][p]; return Math.abs(x) < 0.05 ? 'neutro' : (x > 0) === alzaBuena ? 'bueno' : 'malo'; };
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: GASTO.hogares.color, rotulo: tr('Consumo de hogares · ' + A.ult, 'Household consumption · ' + A.ult), valor: PM.pct(sh.hogares[u], 1), delta: linea('hogares'), tono: 'neutro', serie: sh.hogares }) +
        PM.kpi({ color: GASTO.gobierno.color, rotulo: tr('Consumo del gobierno · ' + A.ult, 'Government consumption · ' + A.ult), valor: PM.pct(sh.gobierno[u], 1), delta: linea('gobierno'), tono: 'neutro', serie: sh.gobierno }) +
        PM.kpi({ color: GASTO.fbcf.color, rotulo: tr('Inversión fija · ' + A.ult, 'Fixed investment · ' + A.ult), valor: PM.pct(sh.fbcf[u], 1), delta: linea('fbcf'), tono: tono('fbcf', true), serie: sh.fbcf }) +
        PM.kpi({ color: GASTO.exportaciones.color, rotulo: tr('Saldo comercial · ' + A.ult, 'Trade balance · ' + A.ult), valor: PM.pct(sh.saldo[u], 1, true),
          delta: linea('saldo'), tono: tono('saldo', true), serie: sh.saldo });
    }

    function opciones() {
      var pct = estado.medida === 'pct', d = D[estado.frec], anual = estado.frec === 'anual', el = document.getElementById('chart');
      var K = d.K, src = pct ? d.sh : d.mm, n = K.length - 1, series = [], card = PM.var('--card') || '#fff', dk = PM.dk(), chico = PM.pequeno();
      PILA.forEach(function (k) {
        if (!activas.has(k)) return;
        series.push(PM.barra(GASTO[k].color, { extra: {
          name: GASTO[k].nombre, stack: 'gasto', barCategoryGap: anual ? '34%' : '26%',
          data: src[k].map(function (v) { return v == null ? null : +(signo(k) * v).toFixed(pct ? 3 : 1); })
        } }));
      });
      if (series.length) series[0].markLine = PM.cero();
      // El total: en millones, la línea del PIB en tinta con un punto por barra; en %, el PIB es siempre 100: una raya
      // fina marca dónde termina lo producido (lo que la pila pasa por encima es lo importado)
      if (activas.has('pib')) {
        var pv = pct ? K.map(function () { return 100; }) : src.pib;
        // La línea del PIB, sutil y sin borde blanco (pedido de Carlos): 1,5 px suavizada (smoothMonotone 'x': la curva no
        // inventa picos entre trimestres), un punto sólido chico por período y la cifra final sobre fondo de tarjeta.
        var nP = pv.length - 1, vP = pv[nP], chicoP = PM.pequeno();
        series.push(PM.linea(GASTO.pib.color, { ancho: 1.5, extra: { name: tr('PIB', 'GDP'), data: pv, z: 6, connectNulls: false,
          smooth: 0.35, smoothMonotone: 'x', showSymbol: !pct, symbolSize: 4, itemStyle: { color: PM.col(GASTO.pib.color), borderWidth: 0 },
          markPoint: pct || vP == null ? undefined : { silent: true, animation: false, symbol: 'circle', symbolSize: 5,
            itemStyle: { color: PM.col(GASTO.pib.color), borderWidth: 0 },
            label: { show: true, formatter: PM.auto(vP), position: vP < 0 ? 'bottom' : 'top', align: 'right', offset: [4, vP < 0 ? 3 : -3],
              backgroundColor: card, padding: [1, 3], color: PM.tx(GASTO.pib.color), fontFamily: PM.mono(), fontSize: chicoP ? 10.5 : 11.5, fontWeight: 700 },
            data: [{ coord: [nP, vP] }] } } }));
      }
      return {
        animationDuration: 450,
        grid: PM.grid({ right: chico ? 16 : 14 }),
        xAxis: PM.ejeTiempo(K, el, { boundaryGap: true }),
        // en millones, el eje va en miles de millones: «600» y no «600.000» (el rótulo ancho le quitaba lugar al trazado);
        // la unidad, alineada a la izquierda: con rótulos cortos, alineada a la derecha se salía del lienzo
        yAxis: PM.ejeY({ unidad: pct ? '' : tr('Miles de MM Bs', 'Bs billion'), fmt: pct ? 'pct' : function (v) { return PM.tick(v / 1000); }, extra: { splitNumber: 4, nameTextStyle: { align: 'left' } } }),
        tooltip: PM.tooltip(function (ps) {
          if (!ps.length) return '';
          var i = ps[0].dataIndex;
          panel(i);
          var h = PM.ttTitulo(PM.fecha(K[i]), pct ? tr('% del PIB, a precios corrientes', '% of GDP, at current prices') : tr('Millones de Bs corrientes', 'Millions of current Bs'));
          LECTURA.forEach(function (k) {
            if (!activas.has(k)) return;
            var v = signo(k) * src[k][i];
            h += PM.ttFila(GASTO[k].color, GASTO[k].nombre, pct ? PM.pct(v, 1) : PM.auto(v), 'area');
          });
          h += PM.ttTotal(tr('PIB', 'GDP'), pct ? '100%' : PM.auto(d.mm.pib[i]));
          h += PM.ttPie(tr('Saldo comercial (exportaciones − importaciones): <strong style="color:#fff">' + PM.pct(d.sh.saldo[i], 1, true) + '</strong> del PIB',
            'Trade balance (exports − imports): <strong style="color:#fff">' + PM.pct(d.sh.saldo[i], 1, true) + '</strong> of GDP'));
          return h;
        }, { axisPointer: PM.sombraEje() }),
        series: series
      };
    }

    // Panel: la historia del período bajo el cursor, «de cada 100 bolivianos»
    function panel(i) {
      var d = D[estado.frec];
      if (i == null || !d || i < 0 || i >= d.K.length) return;
      estado.idx = i;
      var pct = estado.medida === 'pct', f = PM.fecha(d.K[i]), sh = function (k) { return d.sh[k][i]; }, mm = function (k) { return d.mm[k][i]; };
      var inv = sh('fbcf') + sh('existencias'), cons = sh('hogares') + sh('gobierno'), saldo = d.sh.saldo[i];
      var val = function (x, m) { return pct ? PM.pct(x, 1) : bs(m); };
      var h = PM.pb(GASTO.hogares.color, tr('Consumo', 'Consumption'), val(cons, mm('hogares') + mm('gobierno')),
          tr('Hogares <strong>' + PM.pct(sh('hogares'), 1) + '</strong> y gobierno <strong>' + PM.pct(sh('gobierno'), 1) + '</strong> del PIB.',
            'Households <strong>' + PM.pct(sh('hogares'), 1) + '</strong> and government <strong>' + PM.pct(sh('gobierno'), 1) + '</strong> of GDP.')) +
        PM.pb(GASTO.fbcf.color, tr('Inversión', 'Investment'), val(inv, mm('fbcf') + mm('existencias')),
          tr('Inversión fija <strong>' + PM.pct(sh('fbcf'), 1) + '</strong> y existencias <strong>' + PM.pct(sh('existencias'), 1) + '</strong> del PIB.',
            'Fixed investment <strong>' + PM.pct(sh('fbcf'), 1) + '</strong> and inventories <strong>' + PM.pct(sh('existencias'), 1) + '</strong> of GDP.')) +
        PM.pb(GASTO.exportaciones.color, tr('Comercio exterior', 'Foreign trade'), pct ? PM.pct(saldo, 1, true) : bs(mm('exportaciones') - mm('importaciones')),
          tr('Exportaciones <strong>' + PM.pct(sh('exportaciones'), 1) + '</strong> menos importaciones <strong>' + PM.pct(sh('importaciones'), 1) + '</strong> del PIB.',
            'Exports <strong>' + PM.pct(sh('exportaciones'), 1) + '</strong> minus imports <strong>' + PM.pct(sh('importaciones'), 1) + '</strong> of GDP.'));
      // umbrales del saldo: < −1% del PIB déficit · > 1% superávit · en medio, casi equilibrio
      var t = tr('En <strong>' + f + '</strong>, de cada 100 bolivianos producidos, ' + PM.dt(GASTO.hogares.color, PM.num(sh('hogares'), 1)) + ' se fueron en consumo de los hogares, ' +
        PM.dt(GASTO.gobierno.color, PM.num(sh('gobierno'), 1)) + ' en consumo del gobierno y ' + PM.dt(GASTO.fbcf.color, PM.num(inv, 1)) + ' en inversión. ',
        'In <strong>' + f + '</strong>, out of every 100 bolivianos produced, ' + PM.dt(GASTO.hogares.color, PM.num(sh('hogares'), 1)) + ' went to household consumption, ' +
        PM.dt(GASTO.gobierno.color, PM.num(sh('gobierno'), 1)) + ' to government consumption and ' + PM.dt(GASTO.fbcf.color, PM.num(inv, 1)) + ' to investment. ');
      if (saldo < -1) t += tr('Eso suma más de 100: el gasto interno <strong>superó lo producido</strong> y, por identidad, la diferencia (' + PM.num(-saldo, 1) + ') es lo que se importó de más sobre lo exportado. La cuenta no dice cuál de las dos cosas causó la otra.',
        'That adds up to more than 100: domestic spending <strong>exceeded output</strong> and, by identity, the difference (' + PM.num(-saldo, 1) + ') is the excess of imports over exports. The arithmetic does not say which of the two caused the other.');
      else if (saldo > 1) t += tr('Eso suma menos de 100: el resto (' + PM.num(saldo, 1) + ') se vendió afuera en neto, con un <strong>superávit comercial</strong>.',
        'That adds up to less than 100: the rest (' + PM.num(saldo, 1) + ') was sold abroad on a net basis, with a <strong>trade surplus</strong>.');
      else t += tr('Exportaciones e importaciones casi se compensan (saldo de ' + PM.pct(saldo, 1, true) + ' del PIB).', 'Exports and imports almost offset each other (balance of ' + PM.pct(saldo, 1, true) + ' of GDP).');
      if (estado.frec === 'anual' && i > 0) { var f0 = d.sh.fbcf[0]; t += tr(' La inversión fija pasó de ' + PM.pct(f0, 1) + ' del PIB en ' + d.K[0] + ' a ' + PM.pct(sh('fbcf'), 1) + '.', ' Fixed investment went from ' + PM.pct(f0, 1) + ' of GDP in ' + d.K[0] + ' to ' + PM.pct(sh('fbcf'), 1) + '.'); }
      document.getElementById('panel-fecha').textContent = f;
      document.getElementById('panel').innerHTML = h + PM.ctx(t);
    }

    function preguntas() {
      var d = D.anual, u = A.u;
      return [
        [tr('¿Qué es el PIB por tipo de gasto?', 'What is GDP by type of spending?'), tr('<p>Es el PIB visto por el lado de quién compra lo producido: hogares, gobierno, inversión y resto del mundo, menos lo que se compra afuera.</p>' +
          '<p><strong>PIB = consumo de los hogares + consumo del gobierno + inversión (fija y existencias) + exportaciones − importaciones.</strong></p>',
          '<p>It is GDP seen from the side of who buys what is produced: households, government, investment and the rest of the world, minus what is bought abroad.</p>' +
          '<p><strong>GDP = household consumption + government consumption + investment (fixed and inventories) + exports − imports.</strong></p>')],
        [tr('¿Por qué las importaciones van debajo del cero?', 'Why do imports go below zero?'), tr('<p>Lo que compran los hogares, el gobierno y los inversionistas incluye bienes hechos afuera. Esa parte no es producción boliviana y se descuenta: el signo menos corrige la cuenta, no significa que importar haga caer el PIB.</p>' +
          '<p>Por eso en «% del PIB» la pila pasa de 100: lo que sobresale por encima de la raya del PIB es, exactamente, lo importado.</p>',
          '<p>What households, the government and investors buy includes goods made abroad. That part is not Bolivian production and is deducted: the minus sign corrects the arithmetic; it does not mean that importing makes GDP fall.</p>' +
          '<p>That is why in “% of GDP” the stack goes above 100: what sticks out above the GDP line is exactly what was imported.</p>')],
        [tr('Una identidad no explica causas', 'An identity does not explain causes'), tr('<p>Esta descomposición sale de una <strong>identidad contable</strong>: PIB = C + I + G + X − M. Se cumple siempre, por definición, y por eso no dice qué causó qué. Que un componente «sume» o «reste» puntos describe cómo se reparte la cuenta, no qué movió al PIB.</p>' +
          '<p>El caso típico son las importaciones. Llevan signo menos porque lo importado ya está contado dentro del consumo, la inversión y las exportaciones, y no se produjo en el país: el signo sólo evita contarlo como producción nacional. Importar más no resta PIB por sí mismo. Si un arancel recorta las importaciones, también recorta el consumo y la inversión que se hacían con ellas; el efecto neto depende de cómo responda cada componente.</p>' +
          '<p>Ante un cambio, la pregunta útil es qué lo causó (precios, política, un shock externo) y «¿y después qué?», sin suponer que el resto de la identidad queda quieto. Lo explica Brian Albrecht en <a href="https://www.economicforces.xyz/p/never-reason-from-an-accounting-identity-c4f" target="_blank" rel="noopener">«Never Reason from an Accounting Identity»</a> (Economic Forces, 2026).</p>',
          '<p>This breakdown comes from an <strong>accounting identity</strong>: GDP = C + I + G + X − M. It always holds, by definition, and for that reason it does not say what caused what. That a component “adds” or “subtracts” points describes how the arithmetic is split, not what moved GDP.</p>' +
          '<p>The typical case is imports. They carry a minus sign because what is imported is already counted within consumption, investment and exports, and was not produced in the country: the sign merely avoids counting it as domestic production. Importing more does not subtract from GDP by itself. If a tariff cuts imports, it also cuts the consumption and investment that were made with them; the net effect depends on how each component responds.</p>' +
          '<p>Faced with a change, the useful question is what caused it (prices, policy, an external shock) and “and then what?”, without assuming that the rest of the identity stays put. Brian Albrecht explains it in <a href="https://www.economicforces.xyz/p/never-reason-from-an-accounting-identity-c4f" target="_blank" rel="noopener">“Never Reason from an Accounting Identity”</a> (Economic Forces, 2026).</p>')],
        [tr('¿Por qué a precios corrientes?', 'Why at current prices?'), tr('<p>Porque sólo a precios corrientes las partes suman el total: a precios constantes (bolivianos encadenados de 2017) la suma de los componentes no da el PIB.</p>',
          '<p>Because only at current prices do the parts add up to the total: at constant prices (chained 2017 bolivianos) the sum of the components does not give GDP.</p>')],
        [tr('¿Qué son la inversión fija y las existencias?', 'What are fixed investment and inventories?'), tr('<p>La <strong>inversión fija</strong> (formación bruta de capital fijo, FBCF) es construcción, maquinaria y equipo: lo que amplía la capacidad de producir. Las <strong>existencias y otros</strong> son la variación de inventarios y la compra neta de objetos valiosos; puede ser negativa.</p>',
          '<p><strong>Fixed investment</strong> (gross fixed capital formation, GFCF) is construction, machinery and equipment: what expands productive capacity. <strong>Inventories and other</strong> are the change in inventories and net purchases of valuables; it can be negative.</p>')],
        [tr('La tasa de inversión', 'The investment rate'), tr('<p>La inversión fija pasó de <strong>' + PM.pct(d.sh.fbcf[0], 1) + '</strong> del PIB en ' + A.pri + ' a <strong>' + PM.pct(d.sh.fbcf[u], 1) + '</strong> en ' + A.ult + '; el consumo de los hogares, de ' + PM.pct(d.sh.hogares[0], 1) + ' a ' + PM.pct(d.sh.hogares[u], 1) + '.</p>' +
          '<p>Una tasa de inversión que cae anticipa menos crecimiento: es la que agrega capacidad de producir.</p>',
          '<p>Fixed investment went from <strong>' + PM.pct(d.sh.fbcf[0], 1) + '</strong> of GDP in ' + A.pri + ' to <strong>' + PM.pct(d.sh.fbcf[u], 1) + '</strong> in ' + A.ult + '; household consumption, from ' + PM.pct(d.sh.hogares[0], 1) + ' to ' + PM.pct(d.sh.hogares[u], 1) + '.</p>' +
          '<p>A falling investment rate points to less growth ahead: it is what adds productive capacity.</p>')],
        [tr('¿Anual o trimestral?', 'Annual or quarterly?'), tr('<p>El año completo suma sus 4 trimestres: no tiene estación y se lee mejor. El trimestral muestra cada trimestre, con su estación (la inversión y el consumo pesan distinto según la época del año).</p>',
          '<p>The full year adds up its 4 quarters: it has no seasonality and reads better. The quarterly view shows each quarter, with its seasonality (investment and consumption weigh differently depending on the time of year).</p>')]
      ];
    }

    // En la imagen de descarga: cuadros para la pila y raya para el PIB, en el orden de las pastillas
    PM.leyendaImagen = function () {
      var pct = estado.medida === 'pct';
      return PILA.concat(['pib']).filter(function (k) { return activas.has(k); }).map(function (k) {
        return { name: k === 'pib' ? (pct ? tr('PIB = 100%', 'GDP = 100%') : tr('PIB', 'GDP')) : GASTO[k].nombre, itemStyle: { color: PM.col(GASTO[k].color) }, forma: k === 'pib' ? 'linea' : 'area' };
      });
    };
  })();
  </script>
