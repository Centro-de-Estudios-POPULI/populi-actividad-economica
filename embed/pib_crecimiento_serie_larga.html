<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PIB Bolivia - Serie larga</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --populi:#C71E1D;--populi-dark:#8B1A1A;--populi-light:#E8706B;--populi-gold:#EE9B00;
  --cream:#F5EFE0;--brown:#5C3D1E;--brown-dark:#3D2B1F;
  --navy:#0D1B2A;--navy-light:#1A2940;
  --slate:#475569;--slate-light:#64748B;
  --warm-white:#FAF8F3;--light-gray:#F1EDE5;
  --border:#E2DDD3;--dark-border:#2A3A50;
  --bg:var(--warm-white);--card:#FFFFFF;--text:var(--brown-dark);--muted:var(--slate-light);
  --shadow:0 1px 3px rgba(13,27,42,.04),0 4px 16px rgba(13,27,42,.06);
  --radius:12px;
  --ct-pib:#0A9396;--ct-agro:#0A9396;--ct-extract:#EE9B00;--ct-manuf:#005F73;
  --ct-elec:#9B2226;--ct-const:#C71E1D;--ct-comer:#94D2BD;--ct-trans:#005F73;
  --ct-aloja:#DF5D25;--ct-finan:#EE9B00;--ct-admin:#64748B;--ct-comun:#0A9396;
}
[data-theme="dark"]{
  --bg:#080808;--card:#141414;--text:#E2E8F0;--muted:#64748B;
  --border:#2A3A50;--light-gray:#1A1A1A;--cream:#1A2940;
}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
.embed-container{max-width:1200px;margin:0 auto;padding:20px 16px}
.section-title{
  font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;font-weight:700;
  color:var(--navy);display:flex;align-items:center;gap:10px;
}
[data-theme="dark"] .section-title{color:#fff}
.accent-bar{width:4px;height:26px;border-radius:2px;flex-shrink:0}
.section-subtitle{font-size:.78rem;color:var(--muted);padding-left:14px;margin-top:2px}
.chart-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;overflow:hidden;margin-top:12px;
}
[data-theme="dark"] .chart-card{background:#141414;border-color:var(--dark-border)}
#chart{width:100%;height:500px}
.chart-source{
  display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:0 2px;
}
.chart-source-text{font-size:.58rem;color:var(--muted);opacity:.6}
.chart-source-text a{color:var(--populi);font-weight:600;text-decoration:none}
.watermark{height:15px;width:auto;opacity:.18}
[data-theme="dark"] .watermark{opacity:.10}
</style>
</head>
<body>
<div class="embed-container">
  <div class="section-title">
    <span class="accent-bar" style="background:#0A9396"></span>
    Crecimiento del PIB de Bolivia
  </div>
  <div class="section-subtitle">Variación interanual trimestral (%). Base 1990 desde 2000-T1 y Base 2017 desde 2018-T1</div>
  <div class="chart-card">
    <div id="chart"></div>
    <div class="chart-source">
      <span class="chart-source-text">Fuente: <a>INE</a> &middot; Elaboraci&oacute;n: <a>Centro de Estudios POPULI</a></span>
      <svg viewBox="0 0 310 130" class="watermark"><text x="6" y="112" font-family="'Playfair Display'" font-size="145" font-weight="700" fill="#C71E1D">P</text><text x="92" y="87" font-family="'Playfair Display'" font-size="55" font-weight="400" font-style="italic" fill="#3D2B1F">opuli</text></svg>
    </div>
  </div>
</div>
<script>
(function(){
  /* ── Theme ─────────────────────────────────────── */
  var params=new URLSearchParams(window.location.search);
  if(params.get('theme')==='dark') document.documentElement.dataset.theme='dark';
  window.addEventListener('message',function(e){if(e.data&&e.data.theme) document.documentElement.dataset.theme=e.data.theme});
  function dk(){return document.documentElement.dataset.theme==='dark'}

  /* ── Chart ─────────────────────────────────────── */
  var chartDom=document.getElementById('chart');
  var chart=echarts.init(chartDom);

  function buildChart(){

    var labels=["2000-T1", "2000-T2", "2000-T3", "2000-T4", "2001-T1", "2001-T2", "2001-T3", "2001-T4", "2002-T1", "2002-T2", "2002-T3", "2002-T4", "2003-T1", "2003-T2", "2003-T3", "2003-T4", "2004-T1", "2004-T2", "2004-T3", "2004-T4", "2005-T1", "2005-T2", "2005-T3", "2005-T4", "2006-T1", "2006-T2", "2006-T3", "2006-T4", "2007-T1", "2007-T2", "2007-T3", "2007-T4", "2008-T1", "2008-T2", "2008-T3", "2008-T4", "2009-T1", "2009-T2", "2009-T3", "2009-T4", "2010-T1", "2010-T2", "2010-T3", "2010-T4", "2011-T1", "2011-T2", "2011-T3", "2011-T4", "2012-T1", "2012-T2", "2012-T3", "2012-T4", "2013-T1", "2013-T2", "2013-T3", "2013-T4", "2014-T1", "2014-T2", "2014-T3", "2014-T4", "2015-T1", "2015-T2", "2015-T3", "2015-T4", "2016-T1", "2016-T2", "2016-T3", "2016-T4", "2017-T1", "2017-T2", "2017-T3", "2017-T4", "2018-T1", "2018-T2", "2018-T3", "2018-T4", "2019-T1", "2019-T2", "2019-T3", "2019-T4", "2020-T1", "2020-T2", "2020-T3", "2020-T4", "2021-T1", "2021-T2", "2021-T3", "2021-T4", "2022-T1", "2022-T2", "2022-T3", "2022-T4", "2023-T1", "2023-T2", "2023-T3", "2023-T4", "2024-T1", "2024-T2", "2024-T3", "2024-T4", "2025-T1", "2025-T2", "2025-T3", "2025-T4"];
    var d90=[2.09, 4.84, 1.02, 1.98, -0.01, 0.9, 2.59, 3.17, 1.38, 3.86, 3.74, 0.9, 3.32, 3.24, 0.9, 3.37, 4.39, 3.65, 6.15, 2.66, 4.45, 3.98, 3.81, 5.46, 4.41, 3.87, 5.74, 5.19, 2.52, 4.09, 5.34, 6.1, 6.55, 6.89, 7.06, 4.19, 2.95, 2.2, 3.63, 4.63, 3.22, 3.78, 3.71, 5.66, 6.18, 4.26, 5.22, 5.29, 5.01, 4.39, 4.59, 6.43, 6.85, 7.08, 7.29, 6.01, 5.91, 4.8, 6.03, 5.18, 4.8, 5.25, 3.93, 5.41, 5.35, 3.23, 4.94, 3.69, 3.34, 3.79, 4.28, 5.23, 4.93, 4.85, 3.98, 3.27, 3.09, 2.64, 2.23, 1.06, 0.2, -24.74, -10.87, 0.96, -0.61, 23.12, 5.15, 0.51, 4.76, 4.58, 4.09, 1.33, 2.39, 2.03, 2.59, 5.11, 1.31, 3.64, 1.02, -2.6, null, null, null, null];
    var d17=[null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, 2.99, 6.56, 0.41, 1.58, 3.52, 1.14, 3.59, -2.18, -4.59, -25.9, -16.25, -2.7, -1.86, 27.35, 12.86, 4.78, 8.75, 4.55, 3.66, -1.65, -0.19, 3.59, 2.86, 3.79, -2.39, 0.85, -1.4, -1.7, -1.67, -2.77, -0.68, -1.14];
    chart.setOption({
      backgroundColor:'transparent',
      grid:{top:30,right:16,bottom:44,left:52},
      tooltip:{
      trigger:'axis',
      backgroundColor:dk()?'#080808':'rgba(13,27,42,.96)',
      borderColor:dk()?'#2A3A50':'#1A2940',
      borderWidth:1,
      textStyle:{fontFamily:'Inter',fontSize:12,color:'#fff'},
      padding:[12,16],
      extraCssText:'border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);',
      formatter:function(params){
        if(!params||!params.length) return '';
        var s='<div style="color:#E9D8A6;font-weight:600;margin-bottom:6px">'+params[0].axisValue+'</div>';
        params.forEach(function(p){
          if(p.value!=null){
            s+=p.marker+' <span style="color:#ccc">'+p.seriesName+'</span> '
              +'<span style="font-family:\'JetBrains Mono\';font-weight:700;color:#fff">'
              +p.value.toFixed(2)+' %</span><br/>';
          }
        });
        return s;
      }
    },
      legend:{
        data:['Base 1990','Base 2017'],
        bottom:4,
        textStyle:{fontFamily:'Inter',fontSize:11,color:dk()?'#64748B':'#94A3B8'}
      },
      xAxis:{
      type:'category',
      data:labels,
      boundaryGap:false,
      axisLine:{lineStyle:{color:dk()?'#2A3A50':'#E2DDD3'}},
      axisTick:{show:false},
      axisLabel:{
        fontFamily:'Inter',fontSize:10,fontWeight:500,
        color:dk()?'#64748B':'#94A3B8',
        rotate:45,
        interval:3
      }
    },
      yAxis:{
      type:'value',
      name:'%',
      nameTextStyle:{fontFamily:'Inter',fontSize:11,color:dk()?'#64748B':'#94A3B8',padding:[0,0,0,0]},
      splitLine:{lineStyle:{color:dk()?'#1E1E1E':'#F1F5F9',type:'dashed'}},
      axisLine:{show:false},
      axisTick:{show:false},
      axisLabel:{
        fontFamily:'JetBrains Mono',fontSize:11,
        color:dk()?'#64748B':'#94A3B8',
        formatter:'{value}%'
      }
    },
      series:[
        {
          name:'Base 1990',type:'line',data:d90,
          symbol:'none',z:1,
          lineStyle:{width:1.8,color:'#9CA3AF'},
          itemStyle:{color:'#9CA3AF'},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'#9CA3AF18'},
            {offset:1,color:'#9CA3AF02'}
          ])},
          connectNulls:false
        },
        {
          name:'Base 2017',type:'line',data:d17,
          symbol:'none',z:3,
          lineStyle:{width:2.5,color:'#0A9396'},
          itemStyle:{color:'#0A9396'},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'#0A939618'},
            {offset:1,color:'#0A939602'}
          ])},
          connectNulls:false,
          markLine:{
            silent:true,symbol:'none',
            lineStyle:{color:dk()?'#475569':'#94A3B8',type:'solid',width:1},
            data:[{yAxis:0}],
            label:{show:false}
          },
          markPoint:{
            data:[{
              coord:['2020-T2',-25.9],
              symbol:'pin',symbolSize:40,
              itemStyle:{color:'#C71E1D'},
              label:{show:true,formatter:'COVID-19',fontSize:9,fontWeight:700,color:'#fff'},
            }],
            animation:false
          }
        }
      ]
    },true);
  }

  buildChart();
  new MutationObserver(function(){buildChart()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('resize',function(){chart.resize()});
})();
</script>
</body>
</html>
