<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Carga ferroviaria total</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --populi:#C71E1D;--populi-dark:#8B1A1A;--populi-light:#E8706B;--populi-gold:#EE9B00;
  --cream:#F5EFE0;--brown:#5C3D1E;--brown-dark:#3D2B1F;
  --navy:#0D1B2A;--navy-light:#1A2940;
  --slate:#475569;--slate-light:#64748B;
  --warm-white:#FAF8F3;--light-gray:#F1EDE5;
  --border:#E2DDD3;--dark-border:#2A3A50;
  --bg:var(--warm-white);--card:#FFFFFF;--text:var(--brown-dark);--muted:var(--slate-light);
  --radius:12px;
}
[data-theme="dark"]{
  --bg:#080808;--card:#141414;--text:#E2E8F0;--muted:#64748B;
  --border:#2A3A50;--light-gray:#1A1A1A;--cream:#1A2940;
}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
.embed-container{max-width:1200px;margin:0 auto;padding:20px 16px}
.chart-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;overflow:hidden;
}
[data-theme="dark"] .chart-card{background:#141414;border-color:var(--dark-border)}
.section-title{
  font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;font-weight:700;
  color:var(--navy);display:flex;align-items:center;gap:10px;
}
[data-theme="dark"] .section-title{color:#fff}
.accent-bar{width:4px;height:26px;border-radius:2px;flex-shrink:0;background:#0A9396}
.section-subtitle{font-size:.78rem;color:var(--muted);padding-left:14px;margin-top:2px}
#chart{width:100%;height:480px;margin-top:12px}
.chart-source{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 4px 0;margin-top:8px;border-top:1px solid var(--border);
}
.chart-source-text{font-size:.72rem;color:var(--muted);letter-spacing:.01em}
.chart-source-text a{color:var(--populi);text-decoration:none;font-weight:600}
[data-theme="dark"] .chart-source-text a{color:#E9D8A6}
.watermark{width:80px;height:auto;opacity:.18}
[data-theme="dark"] .watermark text:first-child{fill:#E9D8A6}
[data-theme="dark"] .watermark text:last-child{fill:#64748B}
</style>
</head>
<body>
<div class="embed-container">
  <div class="chart-card">
    <div class="section-title">
      <span class="accent-bar"></span>Carga ferroviaria total
    </div>
    <div class="section-subtitle">Toneladas métricas, comparación mensual por año</div>
    <div id="chart"></div>
    <div class="chart-source">
      <span class="chart-source-text">Fuente: <a>INE</a> &middot; Elaboraci&oacute;n: <a>Centro de Estudios POPULI</a></span>
      <svg viewBox="0 0 310 130" class="watermark"><text x="6" y="112" font-family="'Playfair Display'" font-size="145" font-weight="700" fill="#C71E1D">P</text><text x="92" y="87" font-family="'Playfair Display'" font-size="55" font-weight="400" font-style="italic" fill="#3D2B1F">opuli</text></svg>
    </div>
  </div>
</div>
<script>
(function(){
  var params=new URLSearchParams(window.location.search);
  if(params.get('theme')==='dark') document.documentElement.dataset.theme='dark';
  window.addEventListener('message',function(e){if(e.data&&e.data.theme) document.documentElement.dataset.theme=e.data.theme});
  function dk(){return document.documentElement.dataset.theme==='dark'}

  /* ── Alto real hacia el contenedor ─────────────── */
  var _lastH=0;
  function reportHeight(force){
    if(window.parent===window) return;
    /* Medir el CONTENIDO, no el documento: scrollHeight nunca baja del alto del propio
       iframe, asi que reportaba el min-height vigente y el ajuste no hacia nada. */
    var bottom=0, kids=document.body.children;
    for(var i=0;i<kids.length;i++){
      var r=kids[i].getBoundingClientRect();
      if(r.height>0) bottom=Math.max(bottom, r.bottom);
    }
    var pad=parseFloat(getComputedStyle(document.body).paddingBottom)||0;
    var h=Math.ceil(bottom + window.scrollY + pad);
    if(h>0 && (force===true || Math.abs(h-_lastH)>2)){
      _lastH=h; window.parent.postMessage({populiEmbed:'height', height:h},'*');
    }
  }
  /* Reintentos: el primer aviso puede salir antes de que el contenedor escuche, y el
     grafico todavia puede crecer al montar ECharts o al cargar las fuentes. */
  window.addEventListener('load',function(){reportHeight(true)});
  [0,150,600,1600].forEach(function(ms){setTimeout(function(){reportHeight(true)},ms)});
  window.addEventListener('resize',function(){reportHeight(false)});
  window.addEventListener('message',function(e){
    if(e.data&&e.data.populiEmbed==='ask-height') reportHeight(true);
  });
  if(window.ResizeObserver) new ResizeObserver(function(){reportHeight(false)}).observe(document.body);

  var chartDom=document.getElementById('chart');
  var chart=echarts.init(chartDom);

  function buildChart(){

    var dark=dk();
    var yColors={'2026':['#C71E1D','#E8706B'],'2025':['#0A9396','#0A9396'],'2024':['#EE9B00','#EE9B00'],'2023':['#005F73','#94D2BD'],'2022':['#B9BEC0','#8A9699'],'2021':['#CFD3D4','#6E7A7D'],'2020':['#C71E1D','#E8706B']};
    var option={
      backgroundColor:'transparent',
      tooltip:{
        trigger:'axis',
        backgroundColor:dark?'#080808':'rgba(13,27,42,.96)',
        borderColor:dark?'#2A3A50':'#1A2940',
        textStyle:{color:'#E2E8F0',fontSize:12,fontFamily:'Inter'},
        extraCssText:'border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);',
        formatter:function(params){
          var month=params[0].axisValue;
          var s='<div style="color:#E9D8A6;font-weight:700;margin-bottom:6px;font-family:Playfair Display,serif">'+month+'</div>';
          params.sort(function(a,b){return parseInt(b.seriesName)-parseInt(a.seriesName)});
          params.forEach(function(p){
            if(p.value!=null){
              var c=yColors[p.seriesName];
              var color=c?(dark?c[1]:c[0]):p.color;
              s+='<div style="display:flex;align-items:center;gap:6px;margin:2px 0">';
              s+='<span style="display:inline-block;width:10px;height:3px;border-radius:1px;background:'+color+'"></span>';
              s+='<span style="color:#64748B;font-size:11px;min-width:32px">'+p.seriesName+'</span>';
              s+='<span style="font-family:JetBrains Mono;font-weight:600;color:#fff;font-size:12px">'+p.value.toLocaleString('es-BO',{maximumFractionDigits:1})+' TM</span>';
              s+='</div>';
            }
          });
          return s;
        }
      },
      legend:{
        data:["2026", "2025", "2024", "2023", "2022", "2021", "2020"],
        bottom:8,
        textStyle:{color:dark?'#64748B':'#64748B',fontSize:11,fontFamily:'JetBrains Mono',fontWeight:500},
        itemWidth:18,itemHeight:3,itemGap:14,
        type:'scroll'
      },
      grid:{left:65,right:20,top:20,bottom:55},
      xAxis:{
        type:'category',
        data:["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"],
        axisLine:{lineStyle:{color:dark?'#2A3A50':'#E2DDD3'}},
        axisTick:{show:false},
        axisLabel:{fontFamily:'Inter',fontSize:10,fontWeight:500,color:dark?'#64748B':'#64748B'}
      },
      yAxis:{
        type:'value',min:'dataMin',
        name:'Toneladas metricas',
        nameTextStyle:{fontFamily:'Inter',fontSize:10,color:dark?'#64748B':'#64748B',padding:[0,0,0,0]},
        splitLine:{lineStyle:{color:dark?'#141414':'#F1F5F9',type:'dashed'}},
        axisLine:{show:false},
        axisTick:{show:false},
        axisLabel:{fontFamily:'JetBrains Mono',fontSize:11,color:dark?'#64748B':'#64748B',formatter:function(v){return (v/1000).toFixed(0)+'k'}}
      },
      series:[
      {
        name:'2026',type:'line',
        data:[186084.89, 170663.24, 202993.84, 213736.51, 222014.73, 219013.49, null, null, null, null, null, null],
        symbol:'none',
        connectNulls:false,
        lineStyle:{width:3,color:dark?'#E8706B':'#C71E1D',type:'solid',opacity:1.0},
        itemStyle:{color:dark?'#E8706B':'#C71E1D'},
        emphasis:{lineStyle:{width:4}},
        markPoint:{
          data:[{
            coord:[5,219013.49],
            symbol:'circle',symbolSize:8,
            itemStyle:{color:dark?'#E8706B':'#C71E1D',borderColor:'#fff',borderWidth:2},
            label:{show:false}
          }]
        },
        z:10
      },
      {
        name:'2025',type:'line',
        data:[175885.39, 127588.84, 138390.98, 212975.17, 249773.47, 224620.63, 286855.36, 230651.0, 227427.65, 207068.27, 178860.35, 198507.5],
        symbol:'none',
        connectNulls:false,
        lineStyle:{width:2.5,color:dark?'#0A9396':'#0A9396',type:'solid',opacity:0.9},
        itemStyle:{color:dark?'#0A9396':'#0A9396'},
        emphasis:{lineStyle:{width:3.5}},
        z:9
      },
      {
        name:'2024',type:'line',
        data:[169789.02, 167789.5, 155522.05, 198730.93, 210209.98, 207248.53, 260123.03, 208511.8, 166662.82, 153241.47, 150624.46, 179220.71],
        symbol:'none',
        connectNulls:false,
        lineStyle:{width:2,color:dark?'#EE9B00':'#EE9B00',type:'solid',opacity:0.8},
        itemStyle:{color:dark?'#EE9B00':'#EE9B00'},
        emphasis:{lineStyle:{width:3}},
        z:8
      },
      {
        name:'2023',type:'line',
        data:[195205.18, 166682.3, 230217.99, 243609.51, 280727.74, 259006.61, 251899.08, 259343.59, 165859.18, 214242.25, 195508.13, 158550.16],
        symbol:'none',
        connectNulls:false,
        lineStyle:{width:1.8,color:dark?'#94D2BD':'#005F73',type:'solid',opacity:0.7},
        itemStyle:{color:dark?'#94D2BD':'#005F73'},
        emphasis:{lineStyle:{width:2.8}},
        z:7
      },
      {
        name:'2022',type:'line',
        data:[208851.11, 203394.54, 255035.29, 276217.54, 289958.85, 275833.66, 285317.97, 235365.03, 238856.79, 150574.11, 154354.81, 199552.53],
        symbol:'none',
        connectNulls:false,
        lineStyle:{width:1.5,color:dark?'#8A9699':'#B9BEC0',type:'solid',opacity:0.6},
        itemStyle:{color:dark?'#8A9699':'#B9BEC0'},
        emphasis:{lineStyle:{width:2.5}},
        z:6
      },
      {
        name:'2021',type:'line',
        data:[161777.67, 188685.65, 226428.19, 248738.83, 256999.03, 240576.5, 231748.71, 211274.78, 174439.05, 192004.76, 193982.55, 173514.61],
        symbol:'none',
        connectNulls:false,
        lineStyle:{width:1.2,color:dark?'#6E7A7D':'#CFD3D4',type:'solid',opacity:0.5},
        itemStyle:{color:dark?'#6E7A7D':'#CFD3D4'},
        emphasis:{lineStyle:{width:2.2}},
        z:5
      },
      {
        name:'2020',type:'line',
        data:[190082.7, 182019.13, 217141.46, 103150.64, 130491.98, 170028.1, 193236.11, 177089.47, 171138.03, 184140.35, 176185.6, 197400.28],
        symbol:'none',
        connectNulls:false,
        lineStyle:{width:1.8,color:dark?'#E8706B':'#C71E1D',type:'dashed',opacity:0.7},
        itemStyle:{color:dark?'#E8706B':'#C71E1D'},
        emphasis:{lineStyle:{width:2.8}},
        z:4
      }
      ]
    };
    chart.setOption(option,true);
  }

  buildChart();
  new MutationObserver(function(){buildChart()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('resize',function(){chart.resize()});
})();
</script>
</body>
</html>
