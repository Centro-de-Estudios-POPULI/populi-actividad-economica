<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carga Ferroviaria · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <script src="ind_mensual.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Carga Ferroviaria</div>
      <div class="sec-sub" id="sub">Toneladas de carga transportadas por tren por mes, un año por línea</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Red</span><div class="hz-grp" id="b-serie"></div></div>
      <div class="hz-item"><span class="hz-lbl">Vista</span><div class="hz-grp" id="b-vista"></div></div>
      <div class="hz-item"><span class="hz-lbl">Medida</span><div class="hz-grp" id="b-extra"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando carga ferroviaria…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  IND.armar({
    archivo: 'ind_ferroviario.json',
    tipo: 'flujo',
    unidad: 't',
    umbrales: [3, 10],
    fuente: 'INE — Flujo del transporte ferroviario',
    series: [
      { k: 'total', boton: 'Total', corto: 'Carga total', mide: 'Toneladas de carga transportadas por tren', acum: 'los trenes transportaron {v} de carga' },
      { k: 'oriental', boton: 'Oriental', corto: 'Red Oriental', mide: 'Toneladas de carga de la Red Oriental', acum: 'la Red Oriental transportó {v} de carga' },
      { k: 'andina', boton: 'Andina', corto: 'Red Andina', mide: 'Toneladas de carga de la Red Andina', acum: 'la Red Andina transportó {v} de carga' }
    ],
    preguntas: function (A) {
      // participación de la Red Oriental en la carga del año en curso: sale del dato
      var D = A.D, f = A.fin(), tot = 0, ori = 0;
      D.meses.forEach(function (k, i) {
        if (+k.slice(0, 4) !== f.y || D.series.total[i] == null) return;
        tot += D.series.total[i]; ori += D.series.oriental[i];
      });
      var cuota = tot ? PM.pct(ori / tot * 100, 0) : null;
      return [
        ['¿Qué mide?', '<p>Las <strong>toneladas de carga</strong> que transportan por mes las dos redes ferroviarias del país: la <strong>Red Oriental</strong>, que une Santa Cruz con las fronteras de Brasil (Puerto Quijarro) y Argentina (Yacuiba), y la <strong>Red Andina</strong>, en el occidente, que une La Paz, Oruro y Potosí con las salidas a Chile y Argentina.</p>' +
          '<p>Los datos los reportan las dos empresas ferroviarias al INE; la serie empieza en ' + A.primeroAnio('total') + '.</p>'],
        ['¿Por qué adelanta al PIB?', 'Por tren viaja carga pesada y de poco valor por tonelada: soya y sus derivados, minerales, combustibles, cemento. Su volumen anticipa las <strong>exportaciones</strong> de la agroindustria y de la minería y la actividad del <strong>transporte</strong>, antes de que lleguen las cifras de comercio exterior y del PIB.'],
        ['¿Por qué dos redes?', 'No están conectadas entre sí y mueven cosas distintas. ' + (cuota ? 'En ' + f.y + ' la <strong>Red Oriental</strong> llevó el ' + cuota + ' de la carga: ' : 'La <strong>Red Oriental</strong> lleva la mayor parte de la carga: ') +
          'la agroindustria de Santa Cruz hacia la hidrovía y los puertos del Atlántico. La <strong>Red Andina</strong> mueve sobre todo minerales hacia los puertos del Pacífico.'],
        ['Notas del INE', 'La carga total es la suma de las dos redes. Las cifras ' + (A.prelim ? 'de ' + A.prelim + ' en adelante ' : '') + 'son <strong>preliminares</strong> (p), sujetas a revisión.']
      ];
    }
  });
  </script>
</body>
</html>
