    :root{
      --populi:#8B1A1A;--populi-dark:#6B0300;--populi-light:#C00000;--populi-gold:#D4A017;
      --cream:#F5EFE0;--brown:#5C3D1E;--brown-dark:#3D2B1F;
      --navy:#0D1B2A;--navy-light:#1A2940;
      --slate:#475569;--slate-light:#64748B;
      --warm-white:#FAF8F3;--light-gray:#F1EDE5;
      --border:#E2DDD3;--dark-border:#2A3A50;
      --bg:var(--warm-white);--card:#FFFFFF;--text:var(--brown-dark);--muted:var(--slate-light);
      --accent:#0D9488;--radius:12px;
    }
    [data-theme="dark"]{--bg:#080808;--card:#141414;--text:#E2E8F0;--muted:#64748B;--border:#2A3A50;--light-gray:#1A1A1A;--cream:#1A2940}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
    .embed-container{max-width:1200px;margin:0 auto;padding:20px 16px}
    .section-header{margin-bottom:16px}
    .section-title{font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px;line-height:1.15}
    [data-theme="dark"] .section-title{color:#fff}
    .accent-bar{width:4px;height:26px;background:var(--accent);border-radius:2px;flex-shrink:0}
    .section-subtitle{font-size:.78rem;color:var(--muted);padding-left:14px;margin-top:2px}
    [data-theme="dark"] .section-subtitle{color:rgba(255,255,255,.4)}

    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    @media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
    .kpi-card{background:var(--warm-white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden;cursor:default;transition:transform .2s,box-shadow .2s}
    [data-theme="dark"] .kpi-card{background:#141414;border-color:var(--dark-border)}
    .kpi-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
    .kpi-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
    .kpi-card[data-s="pib"]::after{background:var(--accent)}
    .kpi-card[data-s="best"]::after{background:#059669}
    .kpi-card[data-s="worst"]::after{background:#C71E1D}
    .kpi-card[data-s="count"]::after{background:#D97706}
    .kpi-label{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
    [data-theme="dark"] .kpi-label{color:rgba(255,255,255,.4)}
    .kpi-value{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700}
    .kpi-sub{font-size:.58rem;color:var(--muted);margin-top:2px}

    .main-grid{display:grid;grid-template-columns:3fr 2fr;grid-template-rows:580px;gap:16px}
    @media(max-width:900px){.main-grid{grid-template-columns:1fr;grid-template-rows:480px auto}}
    @media(max-width:500px){.main-grid{grid-template-rows:380px auto}.section-title{font-size:1.2rem}.kpi-value{font-size:1rem}}
    @media(min-width:1100px){.main-grid{grid-template-rows:600px}}

    .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;height:100%;overflow:hidden}
    [data-theme="dark"] .chart-card{background:#141414;border-color:var(--dark-border)}
    .chart-controls{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
    .toggle-group{display:flex;gap:4px}
    .view-btn{padding:4px 12px;border:1.5px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:.65rem;font-weight:600;color:var(--muted);transition:all .2s}
    [data-theme="dark"] .view-btn{border-color:var(--dark-border);color:#94A3B8}
    .view-btn:hover,.view-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(13,148,136,.06)}
    [data-theme="dark"] .view-btn:hover,[data-theme="dark"] .view-btn.active{border-color:#14B8A6;color:#14B8A6;background:rgba(13,148,136,.1)}
    .range-btn{padding:4px 10px;border:1.5px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:.65rem;font-weight:600;color:var(--muted);transition:all .2s}
    [data-theme="dark"] .range-btn{border-color:var(--dark-border);color:#94A3B8}
    .range-btn:hover,.range-btn.active{border-color:var(--populi);color:var(--populi)}
    [data-theme="dark"] .range-btn:hover,[data-theme="dark"] .range-btn.active{border-color:var(--populi-light);color:var(--populi-light)}
    .chart-area{flex:1;min-height:0}
    .chart-source{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:0 2px}
    .chart-source-text{font-size:.58rem;color:var(--muted);opacity:.6}
    .chart-source-text a{color:var(--populi);font-weight:600;text-decoration:none}
    .watermark{height:15px;width:auto;opacity:.18}
    [data-theme="dark"] .watermark{opacity:.10}

    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:100%}
    [data-theme="dark"] .panel{background:#141414;border-color:var(--dark-border)}
    .panel-header{background:var(--navy);padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
    [data-theme="dark"] .panel-header{background:var(--navy-light)}
    .panel-header-title{font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.8)}
    .panel-header-date{font-family:'JetBrains Mono',monospace;font-size:.56rem;font-weight:600;color:var(--populi-light);background:rgba(199,30,29,.15);padding:2px 8px;border-radius:5px}
    .panel-body{padding:14px;flex:1;overflow-y:auto}
    .panel-block{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    [data-theme="dark"] .panel-block{border-color:var(--dark-border)}
    .panel-block:last-of-type{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .panel-label{display:inline-flex;align-items:center;gap:4px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;padding:2px 9px 2px 6px;border-radius:4px;border-left:3px solid}
    .panel-val{font-family:'JetBrains Mono',monospace;font-size:.92rem;font-weight:700;margin-bottom:3px}
    .panel-desc{font-size:.66rem;line-height:1.55;color:var(--slate-light)}
    [data-theme="dark"] .panel-desc{color:rgba(255,255,255,.45)}
    .panel-desc strong{color:var(--navy)}
    [data-theme="dark"] .panel-desc strong{color:#E2E8F0}
    .delta-tag{font-family:'JetBrains Mono',monospace;font-weight:600;padding:1px 5px;border-radius:4px;font-size:.82em;white-space:nowrap}
    .dt-teal{background:rgba(13,148,136,.08);color:#0D9488}
    .dt-red{background:rgba(199,30,29,.08);color:#C71E1D}
    .dt-green{background:rgba(5,150,105,.08);color:#059669}

    .ctx-box{background:var(--cream);border-radius:6px;padding:8px 10px;border-left:3px solid var(--populi);margin-top:6px}
    [data-theme="dark"] .ctx-box{background:var(--navy-light)}
    .ctx-box p{font-size:.66rem;line-height:1.55;color:var(--slate-light)}
    [data-theme="dark"] .ctx-box p{color:#94A3B8}
    .ctx-box p strong{color:var(--navy)}
    [data-theme="dark"] .ctx-box p strong{color:#E2E8F0}

    .cb-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)}
    [data-theme="dark"] .cb-row{border-color:var(--dark-border)}
    .cb-row:last-child{border-bottom:none}
    .cb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .cb-name{font-size:.62rem;font-weight:600;flex:1;color:var(--text)}
    [data-theme="dark"] .cb-name{color:#CBD5E1}
    .cb-val{font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:700}

    [data-theme="dark"] .panel-footer{border-color:var(--dark-border)}
    .ampliar-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px 0;border-radius:8px;font-family:'Inter',sans-serif;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--populi);background:rgba(139,26,26,.06);border:1.5px solid rgba(139,26,26,.15);transition:all .2s;text-decoration:none;cursor:pointer}

    .ampliar-btn svg{width:13px;height:13px}

    .edu-box{background:var(--cream);border-radius:8px;padding:10px 12px;border-left:3px solid var(--populi);margin-top:4px;cursor:pointer;transition:all .2s}
    [data-theme="dark"] .edu-box{background:var(--navy-light)}
    .edu-box:hover{transform:translateY(-1px)}
    .edu-box-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .edu-box-title{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--populi)}
    [data-theme="dark"] .edu-box-title{color:var(--populi-light)}
    .edu-box-arrow{font-size:.6rem;color:var(--muted);transition:transform .2s}
    .edu-box.open .edu-box-arrow{transform:rotate(180deg)}
    .edu-box-content{display:none;margin-top:8px}
    .edu-box.open .edu-box-content{display:block}
    .edu-box-content p{font-size:.66rem;line-height:1.6;color:var(--slate-light);margin-bottom:6px}
    .edu-box-content p:last-child{margin-bottom:0}
    [data-theme="dark"] .edu-box-content p{color:#94A3B8}
    .edu-box-content p strong{color:var(--navy)}
    [data-theme="dark"] .edu-box-content p strong{color:#E2E8F0}

     acum:[0.22,0.27,0.27,0.17,0.35,0.26,0.15,0.05,-0.51,-1.03,-1.24,-1.16,-0.49,0.24,0.61,0.74,0.81,0.78,0.79,0.66,0.15,0.18,0.2,0.19,0.08,0.06,0.05,0.11,0.31,0.29,0.18,0.17]},
    {n:'Financieras',c:'#F59E0B',
     ia:[1.35,0.78,0.12,-0.46,0.11,0.61,0.51,1.27,0.31,-1.57,-0.87,-1.26,-0.88,0.28,1.31,1.44,1.72,1.32,0.44,-0.73,-0.52,0.14,0.25,2.3,0.84,0.57,0.25,-1.39,-1.13,-0.69,-0.4,0.03],
     m12:[null,null,null,0.43,0.14,0.11,0.2,0.63,0.67,0.1,-0.25,-0.86,-1.15,-0.73,-0.19,0.54,1.22,1.45,1.22,0.67,0.13,-0.16,-0.2,0.52,0.86,0.96,0.96,0.08,-0.39,-0.72,-0.89,-0.55],
     acum:[1.35,1.05,0.73,0.43,0.11,0.38,0.42,0.63,0.31,-0.67,-0.74,-0.86,-0.88,-0.35,0.21,0.54,1.72,1.51,1.14,0.67,-0.52,-0.18,-0.04,0.52,0.84,0.7,0.55,0.08,-1.13,-0.9,-0.73,-0.55]},
    {n:'Adm. Pública',c:'#64748B',
     ia:[-1.34,1.88,0.23,0.29,0.01,-0.09,0.14,0.45,0.01,-0.33,-0.07,-0.08,0.58,0.28,-0.09,0.72,1.33,-1.11,0.96,0.31,-0.76,2.2,0.33,0.08,0.51,0.34,0.11,0.46,0.14,0.36,0.76,-0.21],
     m12:[null,null,null,0.29,0.6,0.11,0.09,0.13,0.12,0.06,0.01,-0.12,0.01,0.17,0.17,0.39,0.58,0.19,0.46,0.36,-0.15,0.7,0.54,0.49,0.8,0.32,0.26,0.35,0.26,0.27,0.43,0.27],
     acum:[-1.34,0.32,0.29,0.29,0.01,-0.04,0.02,0.13,0.01,-0.17,-0.13,-0.12,0.58,0.45,0.26,0.39,1.33,0.06,0.37,0.36,-0.76,0.75,0.61,0.49,0.51,0.42,0.32,0.35,0.14,0.25,0.42,0.27]},
    {n:'Comunales',c:'#14B8A6',
     ia:[0.35,0.32,-0.58,0.35,-0.04,-0.27,0.71,-0.23,0.68,-1.52,-0.86,0.5,-0.69,1.91,0.16,-1.09,-0.44,0.2,0.65,0.37,0.49,0.17,0.07,0.07,-0.1,0.03,0.08,0.29,0.33,0.02,-0.06,-0.19],
     m12:[null,null,null,0.1,0.01,-0.14,0.19,0.05,0.22,-0.11,-0.51,-0.33,-0.67,0.12,0.41,-0.01,0.06,-0.29,-0.15,0.2,0.43,0.42,0.27,0.2,0.05,0.02,0.02,0.07,0.18,0.17,0.14,0.02],
     acum:[0.35,0.33,0.01,0.1,-0.04,-0.16,0.14,0.05,0.68,-0.46,-0.6,-0.33,-0.69,0.49,0.38,-0.01,-0.44,-0.11,0.15,0.2,0.49,0.33,0.24,0.2,-0.1,-0.03,0.0,0.07,0.33,0.17,0.09,0.02]}
  ];

  var RES={
    ia:[0.56,0.5,0.23,0.34,0.56,0.05,-0.12,-0.87,-1.13,-2.96,-1.87,-0.63,-0.61,2.78,1.21,0.65,1.3,0.66,-0.24,-0.72,0.29,-0.28,0.19,-0.36,-1.38,-0.16,-0.42,-0.3,-0.8,-1.34,-1.01,-0.32],
    m12:[null,null,null,0.39,0.42,0.29,0.2,-0.09,-0.49,-1.28,-1.74,-1.69,-1.56,-0.28,0.56,0.92,1.44,0.94,0.56,0.25,-0.01,-0.23,-0.13,-0.02,-0.47,-0.4,-0.58,-0.54,-0.43,-0.72,-0.88,-0.88],
    acum:[0.56,0.54,0.43,0.39,0.56,0.29,0.17,-0.09,-1.13,-2.08,-1.99,-1.69,-0.61,0.93,1.02,0.92,1.3,0.98,0.56,0.25,0.29,0.0,0.08,-0.02,-1.38,-0.74,-0.64,-0.54,-0.8,-1.08,-1.05,-0.88]
  };

  var VIEWS=[
    {key:'ia',label:'Interanual',desc:'Contribución al crecimiento trimestral vs. mismo trimestre año anterior'},
    {key:'m12',label:'12 Meses',desc:'Contribución al crecimiento a 12 meses'},
    {key:'acum',label:'Acumulada',desc:'Contribución al crecimiento acumulado desde T1'}
  ];
  var RANGES=[{label:'3A',trim:12},{label:'5A',trim:20},{label:'Todo',trim:0}];
  var curView=0,curRange=0,chart=null,curIdx=-1;

  function fp(v){return v==null?'—':(v>=0?'+':'')+v.toFixed(2)+'%'}
  function fpp(v){return v==null?'—':(v>=0?'+':'')+v.toFixed(2)+' pp'}
  function fq(l){var p=l.split('-');var r={T1:'I',T2:'II',T3:'III',T4:'IV'};return r[p[1]]+' Trim. '+p[0]}

  function init(){
    document.getElementById('app').innerHTML=buildHTML();
    buildControls();
    chart=echarts.init(document.getElementById('chart'));
    buildChart();
    updatePanel(LABELS.length-1);
    buildKPIs();
    buildEdu();
    window.addEventListener('resize',function(){chart&&chart.resize()});
    new MutationObserver(function(){buildChart();updatePanel(curIdx);buildKPIs()})
      .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }

  function buildHTML(){
    var d=dk();
    return '<div class="section-header">'
      +'<h2 class="section-title"><span class="accent-bar"></span>Contribución Sectorial al Crecimiento</h2>'
      +'<p class="section-subtitle">Puntos porcentuales de contribución al crecimiento del PIB · Base 2017</p></div>'
      +'<div class="kpi-grid" id="kpis"></div>'
      +'<div class="main-grid">'
      +'<div class="chart-card">'
      +'<div class="chart-controls"><div class="toggle-group" id="views"></div>'
      +'<div class="toggle-group" id="ranges"></div></div>'
      +'<div class="chart-area" id="chart"></div>'
      +'<div class="chart-source"><span class="chart-source-text">'
      +'Fuente: <a href="https://www.ine.gob.bo" target="_blank">INE Bolivia</a> · '
      +'Elaboración: <a href="https://populi.org.bo" target="_blank">Centro de Estudios POPULI</a></span>'
      +'<svg viewBox="0 0 310 130" xmlns="http://www.w3.org/2000/svg" class="watermark">'
      +'<text x="6" y="112" font-family="\'Playfair Display\',Georgia,serif" font-size="145" font-weight="700" fill="'+(d?'#C00000':'#8B1A1A')+'">P</text>'
      +'<text x="92" y="87" font-family="\'Playfair Display\',Georgia,serif" font-size="55" font-weight="400" font-style="italic" letter-spacing="1" fill="'+(d?'#F5EFE0':'#3D2B1F')+'">opuli</text></svg></div>'
      +'</div>'
      +'<div class="panel">'
      +'<div class="panel-header"><span class="panel-header-title">Lectura del indicador</span>'
      +'<span class="panel-header-date" id="panel-date"></span></div>'
      +'<div class="panel-body" id="panel-body"></div>'
      +'<div class="panel-footer"><a href="https://populi.org.bo/monitor-actividad-economica" target="_blank" class="ampliar-btn"><span>Ampliar análisis</span>'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      +'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a></div>'
      +'</div></div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px" id="edu"></div>';
  }

  function buildControls(){
    var vEl=document.getElementById('views');
    VIEWS.forEach(function(v,i){
      var b=document.createElement('button');
      b.className='view-btn'+(i===curView?' active':'');
      b.textContent=v.label;
      b.addEventListener('click',function(){curView=i;
        document.querySelectorAll('.view-btn').forEach(function(x){x.classList.remove('active')});
        b.classList.add('active');buildChart();updatePanel(curIdx);buildKPIs()});
      vEl.appendChild(b);
    });
    var rEl=document.getElementById('ranges');
    RANGES.forEach(function(r,i){
      var b=document.createElement('button');
      b.className='range-btn'+(i===curRange?' active':'');
      b.textContent=r.label;
      b.addEventListener('click',function(){curRange=i;
        document.querySelectorAll('.range-btn').forEach(function(x){x.classList.remove('active')});
        b.classList.add('active');buildChart()});
      rEl.appendChild(b);
    });
  }

  function getSlice(){
    var trim=RANGES[curRange].trim;
    var si=trim>0?Math.max(0,LABELS.length-trim):0;
    return{si:si,labels:LABELS.slice(si)};
  }

  function buildKPIs(){
    var k=VIEWS[curView].key;
    var li=LABELS.length-1;
    var pv=PIB[k][li];
    var bestS=null,bestV=-999,worstS=null,worstV=999,posCount=0;
    S.forEach(function(s){
      var v=s[k][li];if(v==null)return;
      if(v>bestV){bestV=v;bestS=s}
      if(v<worstV){worstV=v;worstS=s}
      if(v>0)posCount++;
    });
    document.getElementById('kpis').innerHTML=
      '<div class="kpi-card" data-s="pib"><div class="kpi-label">Crecimiento PIB</div>'
      +'<div class="kpi-value" style="color:var(--accent)">'+fp(pv)+'</div>'
      +'<div class="kpi-sub">'+VIEWS[curView].label+' · '+fq(LABELS[li])+'</div></div>'
      +'<div class="kpi-card" data-s="best"><div class="kpi-label">Mayor contribución</div>'
      +'<div class="kpi-value" style="color:'+(bestS?bestS.c:'#000')+'">'+fpp(bestV)+'</div>'
      +'<div class="kpi-sub">'+(bestS?bestS.n:'—')+'</div></div>'
      +'<div class="kpi-card" data-s="worst"><div class="kpi-label">Mayor resta</div>'
      +'<div class="kpi-value" style="color:'+(worstS?worstS.c:'#000')+'">'+fpp(worstV)+'</div>'
      +'<div class="kpi-sub">'+(worstS?worstS.n:'—')+'</div></div>'
      +'<div class="kpi-card" data-s="count"><div class="kpi-label">Aportan positivo</div>'
      +'<div class="kpi-value" style="color:#D97706">'+posCount+' <span style="font-size:.7rem;font-weight:400">de 11</span></div>'
      +'<div class="kpi-sub">Sectores que suman al crecimiento</div></div>';
  }

  function buildChart(){
    var d=dk();
    var k=VIEWS[curView].key;
    var sl=getSlice();
    var labels=sl.labels;var si=sl.si;

    var series=[];
    S.forEach(function(s){
      series.push({
        name:s.n,type:'bar',stack:'contrib',
        data:s[k].slice(si),
        itemStyle:{color:s.c},
        emphasis:{focus:'series'},
        barMaxWidth:28
      });
    });
    series.push({
      name:'Otros',type:'bar',stack:'contrib',
      data:RES[k].slice(si),
      itemStyle:{color:d?'#333':'#D1D5DB'},
      emphasis:{focus:'series'},
      barMaxWidth:28
    });
    series.push({
      name:'PIB Total',type:'line',
      data:PIB[k].slice(si),
      symbol:'circle',symbolSize:4,z:10,
      lineStyle:{width:2.5,color:d?'#E2E8F0':'#0D1B2A'},
      itemStyle:{color:d?'#E2E8F0':'#0D1B2A',borderColor:d?'#141414':'#fff',borderWidth:1.5},
      connectNulls:true
    });

    chart.setOption({
      backgroundColor:'transparent',
      grid:{top:24,right:12,bottom:44,left:48},
      legend:{show:false},
      tooltip:{
        trigger:'axis',
        backgroundColor:d?'#080808':'rgba(13,27,42,.96)',
        borderColor:d?'#2A3A50':'#1A2940',
        textStyle:{fontFamily:'Inter',fontSize:11,color:'#fff'},
        padding:[12,16],
        extraCssText:'border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);max-height:420px;overflow-y:auto;',
        formatter:function(params){
          if(!params.length)return'';
          var idx=params[0].dataIndex;
          updatePanel(idx+si);
          var lbl=labels[idx];
          var html='<div style="font-weight:700;margin-bottom:6px;color:#E9D8A6;font-size:12px">'+fq(lbl)+'</div>';
          var pibP=params.find(function(p){return p.seriesName==='PIB Total'});
          if(pibP&&pibP.value!=null){
            html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)">'
              +'<span style="width:10px;height:2px;background:'+(d?'#E2E8F0':'#fff')+';display:inline-block"></span>'
              +'<span style="font-size:10px;color:rgba(255,255,255,.6)">PIB Total</span>'
              +'<span style="font-family:\'JetBrains Mono\';font-weight:700;font-size:12px;margin-left:auto">'+fp(pibP.value)+'</span></div>';
          }
          var items=params.filter(function(p){return p.seriesName!=='PIB Total'&&p.value!=null&&Math.abs(p.value)>=0.01})
            .sort(function(a,b){return b.value-a.value});
          items.forEach(function(p){
            html+='<div style="display:flex;align-items:center;gap:6px;margin:2px 0">'
              +'<span style="width:8px;height:8px;border-radius:50%;background:'+p.color+';display:inline-block"></span>'
              +'<span style="font-size:10px;color:rgba(255,255,255,.6);flex:1">'+p.seriesName+'</span>'
              +'<span style="font-family:\'JetBrains Mono\';font-weight:700;font-size:11px;color:'+(p.value>=0?'#34D399':'#F87171')+'">'+fpp(p.value)+'</span></div>';
          });
          return html;
        }
      },
      xAxis:{
        type:'category',data:labels,
        axisLine:{lineStyle:{color:d?'#2A3A50':'#E2DDD3'}},
        axisTick:{show:false},
        axisLabel:{fontFamily:'Inter',fontSize:9,fontWeight:500,color:d?'#64748B':'#94A3B8',
          formatter:function(v,i){
            if(i===0||i===labels.length-1)return v;
            var step=Math.max(1,Math.round(labels.length/8));
            return i%step===0?v:'';
          },showMinLabel:true,showMaxLabel:true,rotate:35}
      },
      yAxis:{
        type:'value',
        splitLine:{lineStyle:{color:d?'#1E1E1E':'#F1F5F9',type:'dashed'}},
        axisLine:{show:false},axisTick:{show:false},
        axisLabel:{fontFamily:'JetBrains Mono',fontSize:10,color:d?'#64748B':'#94A3B8',
          formatter:function(v){return(v>=0?'+':'')+v+'%'}}
      },
      series:series
    },true);
  }

  function updatePanel(globalIdx){
    if(globalIdx<0||globalIdx>=LABELS.length)globalIdx=LABELS.length-1;
    curIdx=globalIdx;
    var d=dk();
    var k=VIEWS[curView].key;
    var lbl=LABELS[globalIdx];
    var pv=PIB[k][globalIdx];

    document.getElementById('panel-date').textContent=fq(lbl);

    var items=[];
    S.forEach(function(s){items.push({n:s.n,c:s.c,v:s[k][globalIdx]})});
    items.push({n:'Otros',c:d?'#555':'#D1D5DB',v:RES[k][globalIdx]});
    items.sort(function(a,b){return(b.v||0)-(a.v||0)});

    var pos=items.filter(function(x){return x.v!=null&&x.v>0});
    var neg=items.filter(function(x){return x.v!=null&&x.v<0});

    var html='<div class="panel-block">'
      +'<div class="panel-label" style="color:#0D9488;background:rgba(13,148,136,.08);border-left-color:#0D9488">PIB Total — '+VIEWS[curView].label+'</div>'
      +'<div class="panel-val" style="color:#0D9488">'+fp(pv)+'</div>'
      +'<p class="panel-desc">Descomposición del crecimiento en <strong>contribuciones sectoriales</strong> (puntos porcentuales).</p></div>';

    if(pos.length){
      html+='<div class="panel-block"><div style="font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#059669;margin-bottom:4px">&#9650; Aportan al crecimiento</div>';
      pos.forEach(function(x){
        html+='<div class="cb-row"><span class="cb-dot" style="background:'+x.c+'"></span>'
          +'<span class="cb-name">'+x.n+'</span>'
          +'<span class="cb-val" style="color:'+(d?'#34D399':'#059669')+'">'+fpp(x.v)+'</span></div>';
      });
      html+='</div>';
    }
    if(neg.length){
      html+='<div class="panel-block"><div style="font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#C71E1D;margin-bottom:4px">&#9660; Restan al crecimiento</div>';
      neg.forEach(function(x){
        html+='<div class="cb-row"><span class="cb-dot" style="background:'+x.c+'"></span>'
          +'<span class="cb-name">'+x.n+'</span>'
          +'<span class="cb-val" style="color:'+(d?'#F87171':'#C71E1D')+'">'+fpp(x.v)+'</span></div>';
      });
      html+='</div>';
    }

    var best=items[0],worst=items[items.length-1];
    var analysis='';
    if(pv!=null&&pv<0){
      analysis='<strong>Economía en contracción.</strong> El PIB cae <span class="delta-tag dt-red">'+fp(pv)+'</span>. ';
      if(worst&&worst.v!=null)analysis+='El principal lastre es <strong>'+worst.n+'</strong> restando <span class="delta-tag dt-red">'+fpp(worst.v)+'</span>.';
      if(pos.length>0)analysis+=' Sin embargo, '+pos.length+' sector'+(pos.length>1?'es aún aportan':' aún aporta')+' positivamente.';
    } else if(pv!=null){
      analysis='<strong>Economía en expansión.</strong> El PIB crece <span class="delta-tag dt-teal">'+fp(pv)+'</span>. ';
      if(best&&best.v!=null)analysis+='El principal motor es <strong>'+best.n+'</strong> aportando <span class="delta-tag dt-green">'+fpp(best.v)+'</span>.';
    } else {
      analysis='Datos no disponibles para este trimestre en la medida seleccionada.';
    }
    html+='<div class="ctx-box"><p>'+analysis+'</p></div>';

    document.getElementById('panel-body').innerHTML=html;
  }

  function buildEdu(){
    var items=[
      {t:'¿Qué es la contribución sectorial?',
       c:'<p>Mide <strong>cuántos puntos porcentuales</strong> aporta cada sector al crecimiento total del PIB. Si el PIB crece 3% y Manufactura contribuye 0.8 pp, significa que Manufactura explica casi un cuarto del crecimiento total.</p>'},
      {t:'¿Por qué no suman exactamente?',
       c:'<p>En <strong>bolivianos encadenados</strong>, la suma de los componentes no es exactamente igual al total. Esto es una propiedad conocida de las medidas de volumen encadenadas (no-aditividad). La categoría "Otros" captura esta diferencia estadística más los impuestos netos sobre productos.</p>'},
      {t:'¿Cómo leer las barras apiladas?',
       c:'<p>Las barras <strong>por encima de cero</strong> son sectores que aportan positivamente. Las <strong>por debajo de cero</strong> restan al crecimiento. La línea oscura muestra el crecimiento total del PIB. La diferencia visual entre la barra neta y la línea es la discrepancia estadística.</p>'}
    ];
    document.getElementById('edu').innerHTML=items.map(function(e){
      return '<div class="edu-box" onclick="this.classList.toggle(\'open\')">'
        +'<div class="edu-box-toggle"><span class="edu-box-title">'+e.t+'</span>'
        +'<span class="edu-box-arrow">&#9660;</span></div>'
        +'<div class="edu-box-content">'+e.c+'</div></div>';
    }).join('');
  }

  init();
})();
</script>
</body>
</html>
