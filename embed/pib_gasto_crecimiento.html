<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Growth of spending · Populi">Crecimiento del gasto · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <style>
    /* Ranking del período en el panel de lectura: barras que salen de la base (100 o 0) hacia cada lado.
       El mismo de pib_crecimiento_sectores.html. */
    .rk { margin: 4px 0 10px; }
    .rk-t { font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
    .rk-f { display: grid; grid-template-columns: minmax(0, 1fr) 38% 3.9rem; align-items: center; gap: 8px; padding: 2px 4px; }
    .rk-f.pib { border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 3px; }
    .rk-f.sel { background: var(--suave); box-shadow: inset 2px 0 0 var(--acento); }
    .rk-n { font-size: .68rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rk-f.pib .rk-n { font-weight: 700; color: var(--tinta); }
    .rk-b { position: relative; height: 9px; }
    .rk-b::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--tenue); }
    .rk-b i { position: absolute; top: 0; bottom: 0; }
    .rk-v { font: 600 .68rem/1.3 'JetBrains Mono', monospace; text-align: right; white-space: nowrap; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title" data-en='<span class="accent-bar"></span>Growth and level of spending'><span class="accent-bar"></span>Crecimiento y nivel del gasto</div>
      <div class="sec-sub" id="sub"></div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl" data-en="View">Vista</span><div class="hz-grp" id="b-vista"></div></div>
      <div class="hz-item" id="item-medida"><span class="hz-lbl" data-en="Measure">Medida</span><div class="hz-grp" id="b-medida"></div></div>
      <div class="hz-item" id="item-base"><span class="hz-lbl" data-en="Base year">Año base</span><div class="hz-grp" id="b-base"></div></div>
      <div class="hz-item"><span class="hz-lbl" data-en="Scale">Escala</span><div class="hz-grp" id="b-escala"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span data-en="Loading the growth of spending…">Cargando el crecimiento del gasto…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t" data-en="Reading the indicator">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C, NB = ' ';
    var tr = PM.t;   // tr('castellano', 'inglés'): con ?lang=en el gráfico sale en inglés (acá T son los trimestres)
    // ── Nombres de los componentes del gasto en inglés: UN solo diccionario, idéntico en los tres gráficos del PIB por
    // tipo de gasto. Las claves son los nombres exactos de data/pib_gasto.json (nombre, nombre_largo) y los que arma
    // cada gráfico (GASTO y BLOQUES). N() se aplica sólo donde el nombre se MUESTRA; los datos se buscan por su clave. ──
    var EN = {
      'PIB': 'GDP',
      'Producto interno bruto (a precios de mercado)': 'Gross domestic product (at market prices)',
      'Consumo de los hogares': 'Household consumption',
      'Gasto de consumo final de los hogares e instituciones sin fines de lucro (ISFLSH)': 'Final consumption expenditure of households and non-profit institutions serving households (NPISH)',
      'Hogares': 'Households',
      'Consumo del gobierno': 'Government consumption',
      'Gasto de consumo final de la administración pública': 'Final consumption expenditure of general government',
      'Gobierno': 'Government',
      'Formación bruta de capital': 'Gross capital formation',
      'Formación bruta de capital (inversión fija + variación de existencias + objetos valiosos)': 'Gross capital formation (fixed investment + change in inventories + valuables)',
      'Inversión fija (FBCF)': 'Fixed investment (GFCF)',
      'Formación bruta de capital fijo': 'Gross fixed capital formation',
      'Inversión fija': 'Fixed investment',
      'Existencias y otros': 'Inventories and other',
      'Variación de existencias y adquisición menos disposición de objetos valiosos (FBK − FBCF)': 'Change in inventories and acquisitions less disposals of valuables (GCF − GFCF)',
      'Existencias': 'Inventories',
      'Exportaciones': 'Exports',
      'Exportaciones de bienes y servicios': 'Exports of goods and services',
      'Importaciones': 'Imports',
      'Importaciones de bienes y servicios': 'Imports of goods and services',
      'Consumo': 'Consumption',
      'Inversión': 'Investment',
      'Sector externo neto': 'Net external sector'
    };
    var N = function (s) { return PM.en && EN[s] != null ? EN[s] : s; };
    // Mapa de colores del PIB por tipo de gasto: IDÉNTICO en composición, crecimiento y contribución, en el ORDEN DE
    // RAMPA de la marca (populi-marca/paleta.py, rampa(6); README, regla 7). En ESTE gráfico de paneles no se usan:
    // los paneles son los de pib_crecimiento_sectores.html (la lámina «Cada actividad contra su punto de partida» del
    // deck): el nombre en tinta, la línea en tinta, y el color dice SÓLO arriba o abajo de la referencia.
    var GASTO = {
      hogares: { nombre: N('Consumo de los hogares'), corto: N('Hogares'), color: C.rojo },
      gobierno: { nombre: N('Consumo del gobierno'), corto: N('Gobierno'), color: C.oro },
      fbcf: { nombre: N('Inversión fija'), corto: N('Inversión fija'), color: C.menta },
      existencias: { nombre: N('Existencias y otros'), corto: N('Existencias'), color: C.turquesa },
      exportaciones: { nombre: N('Exportaciones'), corto: N('Exportaciones'), color: C.petroleo },
      importaciones: { nombre: N('Importaciones'), corto: N('Importaciones'), color: C.tinta },
      pib: { nombre: N('PIB'), corto: N('PIB'), color: C.tinta }
    };
    var ARRIBA = { claro: '#0A9396', oscuro: '#94D2BD' }, ABAJO = { claro: '#C71E1D', oscuro: '#E8706B' }, PIB = C.tinta;
    // Un orden fijo, el de la identidad del gasto (el PIB, ancla, primero): no cambia con la medida ni el año base
    var PANELES = ['pib', 'hogares', 'gobierno', 'fbcf', 'exportaciones', 'importaciones'];
    var MIN = { pib: tr('el PIB', 'GDP'), hogares: tr('el consumo de los hogares', 'household consumption'), gobierno: tr('el consumo del gobierno', 'government consumption'), fbcf: tr('la inversión fija', 'fixed investment'), exportaciones: tr('las exportaciones', 'exports'), importaciones: tr('las importaciones', 'imports') };
    var MEDIDAS = { c4: tr('4 trimestres', '4 quarters'), var: tr('Trimestral', 'Quarterly'), anual: tr('Anual', 'Annual') };
    var FRENTE = { c4: tr('frente a los 4 trimestres anteriores', 'versus the previous 4 quarters'), var: tr('frente al mismo trimestre del año anterior', 'versus the same quarter of the previous year'), anual: tr('frente al año anterior', 'versus the previous year') };
    var estado = { vista: 'crec', medida: 'c4', base: '2019', escala: 'propia', idx: null, k: null };
    // «Comparar con el PIB» es UNA pastilla: el molde no deja apagar la última encendida, así que el conjunto lleva
    // una clave fija sin pastilla (como en el gráfico de actividades)
    var activas = new Set(['pib', '_fija']);
    var J, M, T, S4 = {}, DAT = {}, grafico, geo = [], hoverG = null;

    PM.cargar(['pib_gasto.json']).then(function (r) {
      J = r[0]; M = J.metadata; T = J.trimestres;
      // año móvil de cada componente: la suma de sus 4 trimestres (en encadenados sirve para compararlo consigo mismo)
      PANELES.forEach(function (k) {
        var q = J.nivel[k];
        S4[k] = q.map(function (_, i) { if (i < 3) return null; var s = 0; for (var j = i - 3; j <= i; j++) { if (q[j] == null) return null; s += q[j]; } return s; });
      });
      var bases = ['2017', '2019', String(+T[T.length - 1].slice(0, 4) - 1)].filter(function (a) { return T.indexOf(a + '-T4') >= 0; });
      if (bases.indexOf(estado.base) < 0) estado.base = bases[0];
      PM.botonera(document.getElementById('b-vista'), [['crec', tr('Crecimiento', 'Growth')], ['nivel', tr('Nivel (base = 100)', 'Level (base = 100)')]],
        estado.vista, function (v) { estado.vista = v; todo(); });
      PM.botonera(document.getElementById('b-medida'), Object.keys(MEDIDAS).map(function (k) { return [k, MEDIDAS[k]]; }),
        estado.medida, function (v) { estado.medida = v; todo(); });
      PM.botonera(document.getElementById('b-base'), bases.map(function (a) { return [a, a]; }),
        estado.base, function (v) { estado.base = v; todo(); });
      PM.botonera(document.getElementById('b-escala'), [['propia', tr('Por panel', 'Per panel')], ['comun', tr('Común', 'Shared')]],
        estado.escala, function (v) { estado.escala = v; grafico.redibujar(); });
      PM.pastillas(document.getElementById('pastillas'), [{ k: 'pib', nombre: tr('Comparar con el PIB', 'Compare with GDP'), color: { claro: C.pizarra, oscuro: C.gris }, forma: 'punteada' }],
        activas, function () { grafico.redibujar(); });
      datos(); controles(); cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      // ¿sobre qué panel está el cursor? Se mide en la fase de captura, antes de que ECharts arme el tooltip
      var donde = function (e) {
        var b = el.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
        hoverG = null;
        geo.forEach(function (g, j) { if (x >= g.x0 && x <= g.x1 && y >= g.y0 && y <= g.y1) hoverG = j; });
      };
      el.addEventListener('pointermove', donde, true);
      el.addEventListener('pointerdown', donde, true);
      panel(estado.idx, null);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx, estado.k); });
      PM.preguntas(document.getElementById('preguntas'), preguntas());
      document.getElementById('fuente').innerHTML = tr(
        'Fuente: <a href="' + M.url + '" target="_blank" rel="noopener">INE — PIB trimestral por tipo de gasto, año de referencia 2017</a> · Elaboración: Centro de Estudios POPULI · Datos al: ',
        'Source: <a href="' + M.url + '" target="_blank" rel="noopener">INE (National Statistics Institute) — Quarterly GDP by type of spending, reference year 2017</a> · Analysis: Centro de Estudios POPULI · Data as of: ') + PM.fecha(M.ultimo);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function todo() { datos(); controles(); cifras(); grafico.redibujar(); panel(estado.idx, estado.k); }
    var nivel = function () { return estado.vista === 'nivel'; };
    var ref = function () { return nivel() ? 100 : 0; };
    // en las medidas de año (4 trimestres, nivel) el IV trimestre es el dato del año: lleva su punto; en la anual, cada año
    var anual = function () { return nivel() || estado.medida !== 'var'; };

    // Las claves y los valores de la vista activa: {K, X (años decimales), v: {comp: [..]}}
    function datos() {
      var K = [], v = {}, i0, med = estado.medida;
      if (nivel()) {
        var ib = T.indexOf(estado.base + '-T4');
        i0 = 3; K = T.slice(i0);
        PANELES.forEach(function (k) { v[k] = S4[k].slice(i0).map(function (x) { return x == null ? null : x / S4[k][ib] * 100; }); });
      } else if (med === 'anual') {
        // el año completo: la variación acumulada al IV trimestre
        T.forEach(function (k, i) { if (PM.periodo(k).t === 4 && J.var_acum.pib[i] != null) K.push(k.slice(0, 4)); });
        PANELES.forEach(function (k) { v[k] = K.map(function (a) { return J.var_acum[k][T.indexOf(a + '-T4')]; }); });
      } else if (med === 'var') {
        i0 = 0; while (J.var.pib[i0] == null) i0++;
        K = T.slice(i0);
        PANELES.forEach(function (k) { v[k] = J.var[k].slice(i0); });
      } else {
        // 4 trimestres: el año móvil frente al año móvil de un año antes
        i0 = 7; K = T.slice(i0);
        PANELES.forEach(function (k) { v[k] = S4[k].slice(i0).map(function (x, j) { var a = S4[k][i0 + j - 4]; return x == null || a == null ? null : (x / a - 1) * 100; }); });
      }
      // cada período en el eje X como año decimal («2025-T4» → 2025,75; «2025» → 2025): permite el cruce interpolado
      var X = K.map(function (k) { var p = PM.periodo(k); return p.f === 'a' ? p.a : p.a + (p.t - 1) / 4; });
      DAT = { K: K, X: X, v: v, anualFrec: med === 'anual' && !nivel() };
      estado.idx = K.length - 1;
    }

    var per = function (k) { return PM.fecha(k); };
    function controles() {
      var crec = !nivel();
      document.getElementById('item-medida').style.display = crec ? '' : 'none';
      document.getElementById('item-base').style.display = crec ? 'none' : '';
      document.getElementById('sub').textContent = crec
        ? tr('Cuánto creció cada destino de la producción ' + FRENTE[estado.medida] + ', en %: sobre el cero, crece; debajo, cae. La raya gris repite el PIB',
          'How much each use of output grew ' + FRENTE[estado.medida] + ', in %: above zero, it grows; below, it falls. The gray line repeats GDP')
        : tr('Cada destino de la producción frente a ' + estado.base + ' (= 100), con la suma de los últimos 4 trimestres: sobre la raya punteada, más que ese año. La raya gris repite el PIB',
          'Each use of output versus ' + estado.base + ' (= 100), with the sum of the last 4 quarters: above the dashed line, more than in that year. The gray line repeats GDP');
    }

    function fmt(v) { return v == null ? '—' : nivel() ? PM.num(v, 1) : PM.pct(v, 1, true); }
    function lado(v) { return v == null ? PIB : v >= ref() ? ARRIBA : ABAJO; }

    function cifras() {
      var n = DAT.K.length - 1, v = DAT.v, f = per(DAT.K[n]), R = ref();
      var comps = PANELES.slice(1).filter(function (k) { return v[k][n] != null; });
      var orden = comps.slice().sort(function (a, b) { return v[b][n] - v[a][n]; }), hi = orden[0], lo = orden[orden.length - 1];
      var pa = PM.periodo(DAT.K[n]), med = estado.medida;
      // la línea chica dice qué período mide la cifra; el color, de qué lado de la referencia está (no el componente)
      var linea = nivel() ? f + ' · ' + estado.base + ' = 100' : med === 'anual' ? tr('año ' + DAT.K[n], 'year ' + DAT.K[n]) : med === 'c4' ? (pa.t === 4 ? tr('año ' + pa.a, 'year ' + pa.a) : tr('4 trim. a ' + f, '4 qtrs. to ' + f)) : tr(f + ' vs. T' + pa.t + NB + (pa.a - 1), f + ' vs. Q' + pa.t + NB + (pa.a - 1));
      var serie = function (k) { return PM.ultimos(v[k], 12); };
      var kpi = function (k, rot, delta) { return PM.kpi({ color: lado(v[k][n]), rotulo: rot, valor: fmt(v[k][n]), delta: delta, tono: v[k][n] < R ? 'malo' : 'bueno', serie: serie(k) }); };
      document.getElementById('kpis').innerHTML =
        kpi('pib', tr('PIB', 'GDP'), linea) +
        kpi('hogares', N('Consumo de los hogares'), linea) +
        // el rótulo dice la verdad según el signo: si hasta el mayor cae, «lo que menos cayó»; si hasta el menor crece, «lo que menos creció»
        kpi(hi, nivel() ? tr('Más arriba', 'Highest') : v[hi][n] < 0 ? tr('Lo que menos cayó', 'Fell the least') : tr('Lo que más creció', 'Grew the most'), GASTO[hi].nombre) +
        kpi(lo, nivel() ? tr('Más abajo', 'Lowest') : v[lo][n] > 0 ? tr('Lo que menos creció', 'Grew the least') : tr('Lo que más cayó', 'Fell the most'), GASTO[lo].nombre);
    }

    // Escala redondeada (la de los paneles de actividades y del deck): poco aire y más divisiones en la común; con el
    // 12% de holgura de un panel suelto el redondeo no se come el rango.
    function escala(vals, base, aire, divs) {
      var v = vals.filter(function (x) { return x != null; });
      var lo = Math.min.apply(null, v.concat([base])), hi = Math.max.apply(null, v.concat([base])), r = (hi - lo) || 1;
      lo -= r * aire; hi += r * aire;
      var paso = Math.pow(10, Math.floor(Math.log10((hi - lo) / divs)));
      [1, 2, 2.5, 5, 10].some(function (m) { if ((hi - lo) / (paso * m) <= divs) { paso *= m; return true; } return false; });
      return { lo: Math.floor(lo / paso + 1e-9) * paso, hi: Math.ceil(hi / paso - 1e-9) * paso, paso: paso };
    }
    // Corta la serie por el signo respecto de la base e inserta el cruce interpolado: sin eso el relleno inventa un
    // escalón en el período en que la línea atraviesa la base.
    function cortar(pts, base) {
      var aug = [];
      for (var i = 0; i < pts.length; i++) {
        aug.push(pts[i]);
        if (i < pts.length - 1) {
          var y0 = pts[i][1], y1 = pts[i + 1][1];
          if ((y0 - base) * (y1 - base) < 0) { var t = (base - y0) / (y1 - y0); aug.push([pts[i][0] + t * (pts[i + 1][0] - pts[i][0]), base]); }
        }
      }
      return { arriba: aug.map(function (p) { return [p[0], Math.max(p[1], base)]; }), abajo: aug.map(function (p) { return [p[0], Math.min(p[1], base)]; }) };
    }
    var medidor;
    function ancho(t, fuente) { medidor = medidor || document.createElement('canvas').getContext('2d'); medidor.font = fuente; return medidor.measureText(t).width; }

    function opciones() {
      var el = document.getElementById('chart'), ch = echarts.getInstanceByDom(el);
      // Durante la descarga el molde dibuja el lienzo fuera de pantalla con un tamaño fijo: se usa ESE tamaño y no se
      // toca el alto del div (lo restaura el molde). Se reconoce por el corrimiento a −40000 px.
      var exp = el.style.left === '-40000px', chico = PM.pequeno(), dk = PM.dk(), R = ref();
      // columnas por el ancho REAL del lienzo (las mismas medidas que los paneles de actividades): tres con el panel
      // de lectura al costado (PC), dos en el teléfono; seis paneles en la imagen de descarga: tres columnas
      var W = el.clientWidth, cols = exp ? 3 : W >= 900 ? 4 : W >= 470 ? 3 : 2;
      var n = PANELES.length, filas = Math.ceil(n / cols);
      // cabeza de cada panel: el nombre y DEBAJO la cifra grande (como la lámina del deck)
      var fN = chico ? 11 : 11.5, fC = chico ? 16 : 18, CAB = Math.round(fN + 4 + fC + 15);   // +15: aire entre la cifra y el primer rótulo del eje
      var EJE = 18, SEPY = chico ? 14 : 16, SEPX = chico ? 14 : 18, izq = chico ? 10 : 2, der = chico ? 12 : 8, alto;
      if (exp) alto = Math.floor((el.clientHeight - filas * (CAB + EJE) - (filas - 1) * SEPY) / filas);
      else {
        // ⛔ ECharts no agranda el lienzo si sólo cambia el alto del div: se fija el alto y se llama resize()
        alto = cols === 2 ? 92 : cols === 3 ? 108 : 96;
        var H = filas * (CAB + alto + EJE) + (filas - 1) * SEPY;
        if (Math.abs(el.clientHeight - H) > 1) el.style.height = H + 'px';
        if (ch && Math.abs(ch.getHeight() - el.clientHeight) > 1) ch.resize();
      }
      var conPib = activas.has('pib'), X = DAT.X, pts = {};
      PANELES.forEach(function (k) { pts[k] = DAT.v[k].map(function (y, i) { return [X[i], y]; }).filter(function (p) { return p[1] != null; }); });
      var todos = []; PANELES.forEach(function (k) { pts[k].forEach(function (p) { todos.push(p[1]); }); });
      var comun = escala(todos, R, 0.05, 5);
      var esc = PANELES.map(function (k) {
        if (estado.escala === 'comun') return comun;
        var v = pts[k].map(function (p) { return p[1]; });
        if (conPib && k !== 'pib') v = v.concat(pts.pib.map(function (p) { return p[1]; }));
        return escala(v, R, 0.12, 3);
      });
      // margen del eje Y: el número más ancho de TODOS los paneles (todos miden lo mismo); ese número queda al ras del
      // nombre del panel y los números van alineados a la derecha, pegados al dibujo
      var fA = chico ? 9.5 : 10, fuenteEje = '500 ' + fA + 'px ' + PM.mono(), MARG = 6, gut = 0;
      var dec = function (s) { return Math.abs(s.paso - Math.round(s.paso)) > 1e-9 ? 1 : 0; };
      esc.forEach(function (s) { for (var v = s.lo; v <= s.hi + s.paso / 2; v += s.paso) gut = Math.max(gut, ancho(PM.num(v, dec(s)), fuenteEje)); });
      gut = Math.ceil(gut) + MARG;
      var cw = (W - izq - der - (cols - 1) * SEPX) / cols, plotW = cw - gut;
      // años del eje: el paso que deja un rótulo cada ~38 px del ancho real del panel
      var x0a = X[0], x1a = X[X.length - 1], span = Math.floor(x1a) - Math.ceil(x0a), caben = Math.max(2, Math.floor(plotW / 38));
      var paso = [1, 2, 3, 4, 5].filter(function (t) { return Math.floor(span / t) + 1 <= caben; })[0] || 5;
      var pz = dk ? '#8A9699' : '#5C6B70', tinta = PM.col(C.tinta), card = PM.var('--card') || '#ffffff';
      var grilla = dk ? '#2A3A50' : '#E2DDD3', lineaEje = dk ? '#3A4549' : '#C9CDCE';
      var fNom = '700 ' + fN + 'px ' + PM.inter(), fCif = '700 ' + fC + 'px ' + PM.mono();
      geo = [];
      var grid = [], xAxis = [], yAxis = [], series = [], graphic = [];
      PANELES.forEach(function (k, g) {
        var r = Math.floor(g / cols), c = g % cols, x0 = izq + c * (cw + SEPX), y0 = r * (CAB + alto + EJE + SEPY);
        geo.push({ k: k, x0: x0, x1: x0 + cw, y0: y0, y1: y0 + CAB + alto + EJE });
        grid.push({ left: Math.round(x0 + gut), top: y0 + CAB, width: Math.floor(plotW), height: alto, containLabel: false });
        // marcas en cada período; sólo se rotulan los años del paso elegido
        xAxis.push({ type: 'value', gridIndex: g, min: x0a, max: x1a, interval: DAT.anualFrec ? 1 : 0.25,
          axisLine: { onZero: false, lineStyle: { color: lineaEje } }, axisTick: { show: false }, splitLine: { show: false },
          axisLabel: { fontFamily: PM.mono(), fontSize: fA, fontWeight: 600, color: dk ? 'rgba(226,232,240,.75)' : 'rgba(0,18,25,.7)', margin: 6,
            showMinLabel: false, showMaxLabel: false,
            formatter: function (v) { var y = Math.round(v); return Math.abs(v - y) < 1e-6 && y % paso === 0 ? String(y) : ''; } },
          axisPointer: { show: true, type: 'line', snap: true, label: { show: false }, lineStyle: { color: dk ? 'rgba(226,232,240,.32)' : 'rgba(0,18,25,.22)', width: 1 } } });
        var s = esc[g], d = dec(s);
        yAxis.push({ type: 'value', gridIndex: g, min: s.lo, max: s.hi, interval: s.paso,
          axisLine: { show: false }, axisTick: { show: false },
          splitLine: { lineStyle: { color: grilla, type: [3, 3], opacity: dk ? 0.7 : 1 } },
          axisLabel: { color: pz, fontFamily: PM.mono(), fontSize: fA, fontWeight: 500, margin: MARG, align: 'right', formatter: function (v) { return PM.num(v, d); } } });
        var dat = pts[k], cut = cortar(dat, R);
        // áreas por signo: el color va acá, no en la línea
        var area = function (datos, col, id) {
          return { type: 'line', id: id + g, xAxisIndex: g, yAxisIndex: g, data: datos, silent: true, symbol: 'none', z: 1,
            lineStyle: { width: 0 }, areaStyle: { origin: R, color: PM.tinte(col === C.turquesa), opacity: 1 }, tooltip: { show: false }, emphasis: { disabled: true } };
        };
        series.push(area(cut.arriba, C.turquesa, 'arr'), area(cut.abajo, C.rojo, 'aba'));
        if (conPib && k !== 'pib') series.push({ type: 'line', id: 'pib' + g, name: '_pib' + g, xAxisIndex: g, yAxisIndex: g, data: pts.pib, silent: true, z: 2,
          symbol: 'none', lineStyle: { width: 1, color: pz, type: [5, 4] }, tooltip: { show: false }, emphasis: { disabled: true } });
        // la serie: TINTA, con el punto hueco en el cierre de cada año y en el último dato
        var ult = dat.length - 1;
        series.push({ type: 'line', id: 'l' + g, name: GASTO[k].nombre, xAxisIndex: g, yAxisIndex: g, z: 4,
          data: dat.map(function (p, j) {
            var cierre = DAT.anualFrec || (anual() && Math.abs(p[0] % 1 - 0.75) < 1e-6) || j === ult;
            return cierre ? { value: p, symbol: 'circle', symbolSize: j === ult ? 7 : 5 } : { value: p, symbol: 'none' };
          }),
          showSymbol: true, symbol: 'none', lineStyle: { width: 1.5, color: tinta, cap: 'round', join: 'round' },
          itemStyle: { color: card, borderColor: tinta, borderWidth: 1.25 }, emphasis: { disabled: true },
          markLine: { silent: true, symbol: 'none', animation: false, label: { show: false },
            lineStyle: { color: dk ? 'rgba(226,232,240,.7)' : 'rgba(0,18,25,.65)', width: 0.9, type: [4, 3] }, data: [{ yAxis: R }] } });
        // cabeza: el nombre en tinta y, debajo, la cifra del último dato en el color de su lado de la referencia
        var nom = k === 'pib' ? tr('Producto interno bruto', 'Gross domestic product') : GASTO[k].nombre;
        if (ancho(nom, fNom) > cw) nom = GASTO[k].corto;
        var v = dat[ult][1];
        graphic.push({ type: 'text', silent: true, x: x0, y: y0, style: { text: nom, font: fNom, fill: tinta, align: 'left', verticalAlign: 'top' } });
        graphic.push({ type: 'text', silent: true, x: x0, y: y0 + fN + 4, style: { text: fmt(v), font: fCif, fill: PM.col(lado(v)), align: 'left', verticalAlign: 'top' } });
      });
      return {
        animationDuration: 450,
        grid: grid, xAxis: xAxis, yAxis: yAxis, series: series, graphic: graphic,
        // el cursor en un panel marca el mismo período en los seis
        axisPointer: { link: [{ xAxisIndex: 'all' }] },
        tooltip: PM.tooltip(function (ps) {
          var g = hoverG != null ? hoverG : 0, k = PANELES[g];
          var p = ps.filter(function (q) { return q.seriesId === 'l' + g; })[0] || ps.filter(function (q) { return /^l\d+$/.test(q.seriesId); })[0];
          if (!p) return '';
          var i = DAT.X.indexOf(p.value[0]);
          if (i < 0) { var dm = Infinity; DAT.X.forEach(function (x, j) { if (Math.abs(x - p.value[0]) < dm) { dm = Math.abs(x - p.value[0]); i = j; } }); }
          var v = DAT.v[k][i], pv = DAT.v.pib[i];
          if (v == null) return '';
          panel(i, k);
          var h = PM.ttTitulo(GASTO[k].nombre + ' · ' + per(DAT.K[i]), nivel() ? tr('Cuatro trimestres · ' + estado.base + ' = 100', 'Four quarters · ' + estado.base + ' = 100') : tr('Crecimiento ' + FRENTE[estado.medida], 'Growth ' + FRENTE[estado.medida]));
          h += PM.ttFila(PIB, GASTO[k].nombre, fmt(v), 'linea');
          if (k !== 'pib' && pv != null) h += PM.ttFila(pz, tr('PIB', 'GDP'), fmt(pv), 'punteada');
          var dif = v - R;
          return h + PM.ttTotal(nivel() ? tr('Frente a ' + estado.base, 'Versus ' + estado.base) : (dif >= 0 ? tr('Crece', 'Growing') : tr('Cae', 'Falling')), nivel() ? PM.pct(dif, 1, true) : PM.pct(Math.abs(dif), 1));
        }, chico ? {
          axisPointer: { type: 'line' },
          // en el teléfono el lienzo es más alto que la pantalla: el vidrio va justo encima del panel tocado (o debajo,
          // en la primera fila), no arriba de todo el lienzo, donde quedaría fuera de la vista
          position: function (pt, params, dom, rect, size) {
            var w = size.contentSize[0], h = size.contentSize[1], Wv = size.viewSize[0], g = geo[hoverG != null ? hoverG : 0];
            var y = g.y0 - h - 6 >= 0 ? g.y0 - h - 6 : g.y1 + 6;
            return [Math.min(Math.max(pt[0] - w / 2, 4), Math.max(4, Wv - w - 4)), y];
          }
        } : { axisPointer: { type: 'line' } })
      };
    }

    // Panel de lectura: el RANKING de los seis en el período bajo el cursor, con barras que salen de la referencia
    // (el mismo de los paneles de actividades), y la historia del período con la conclusión calculada
    function panel(i, k) {
      if (i == null || !DAT.K || i < 0 || i >= DAT.K.length || DAT.v.pib[i] == null) return;
      estado.idx = i; estado.k = k && k !== 'pib' ? k : null;
      var v = DAT.v, f = per(DAT.K[i]), R = ref(), pib = v.pib[i];
      var fil = PANELES.slice(1).map(function (c) { return { k: c, v: v[c][i] }; }).filter(function (x) { return x.v != null; }).sort(function (a, b) { return b.v - a.v; });
      var filas = [{ k: 'pib', v: pib }].concat(fil);
      var tope = Math.max.apply(null, filas.map(function (x) { return Math.abs(x.v - R); })) || 1;
      var titulo = nivel() ? tr('Nivel · ' + estado.base + ' = 100', 'Level · ' + estado.base + ' = 100') : { c4: tr('Crecimiento de 4 trimestres', '4-quarter growth'), var: tr('Variación interanual', 'Year-on-year change'), anual: tr('Crecimiento del año', 'Growth for the year') }[estado.medida];
      var html = '<div class="rk"><div class="rk-t">' + titulo + '</div>' + filas.map(function (x) {
        var dv = x.v - R, w = Math.abs(dv) / tope * 50, col = PM.col(lado(x.v));
        var barra = '<i style="background:' + (x.k === 'pib' ? PM.col(PIB) : col) + ';' + (dv >= 0 ? 'left:50%' : 'left:' + (50 - w) + '%') + ';width:' + w + '%"></i>';
        return '<div class="rk-f' + (x.k === 'pib' ? ' pib' : '') + (x.k === estado.k ? ' sel' : '') + '"><span class="rk-n">' + GASTO[x.k].nombre +
          '</span><span class="rk-b">' + barra + '</span><span class="rk-v" style="color:' + (x.k === 'pib' ? PM.col(PIB) : PM.tx(lado(x.v))) + '">' + fmt(x.v) + '</span></div>';
      }).join('') + '</div>';
      var sube = fil.filter(function (o) { return o.v > R; }), baja = fil.filter(function (o) { return o.v <= R; }).reverse();
      var t;
      if (nivel()) {
        var d = pib - 100;
        t = tr('En los 4 trimestres a <strong>' + f + '</strong> la economía produjo ' + (Math.abs(d) < 0.05 ? 'lo mismo que' : PM.pct(Math.abs(d), 1) + (d > 0 ? ' más' : ' menos') + ' que') + ' en ' + estado.base + '.',
          'In the 4 quarters to <strong>' + f + '</strong> the economy produced ' + (Math.abs(d) < 0.05 ? 'the same as' : PM.pct(Math.abs(d), 1) + (d > 0 ? ' more' : ' less') + ' than') + ' in ' + estado.base + '.');
        if (sube.length) t += tr(' Lo que más se alejó hacia arriba: ' + MIN[sube[0].k] + ' (' + PM.dt(ARRIBA, fmt(sube[0].v)) + ')', ' Furthest above: ' + MIN[sube[0].k] + ' (' + PM.dt(ARRIBA, fmt(sube[0].v)) + ')');
        if (baja.length) t += tr((sube.length ? '; hacia abajo, ' : ' Lo que más se alejó hacia abajo: ') + MIN[baja[0].k] + ' (' + PM.dt(ABAJO, fmt(baja[0].v)) + ')', (sube.length ? '; furthest below, ' : ' Furthest below: ') + MIN[baja[0].k] + ' (' + PM.dt(ABAJO, fmt(baja[0].v)) + ')');
        t += '.';
      } else {
        // umbrales del PIB: ≤ −0,5% cae · < 0,5% casi no cambia · en adelante crece
        t = tr('En <strong>' + f + '</strong> el PIB ' + (pib <= -0.5 ? '<strong>cayó</strong>' : pib < 0.5 ? '<strong>casi no cambió</strong>' : '<strong>creció</strong>') + ' (' + PM.dt(lado(pib), fmt(pib)) + ').',
          'In <strong>' + f + '</strong> GDP ' + (pib <= -0.5 ? '<strong>fell</strong>' : pib < 0.5 ? '<strong>barely changed</strong>' : '<strong>grew</strong>') + ' (' + PM.dt(lado(pib), fmt(pib)) + ').');
        if (sube.length) t += tr(' Lo que más creció fue ' + MIN[sube[0].k] + ' (' + PM.dt(ARRIBA, fmt(sube[0].v)) + ')', ' What grew the most was ' + MIN[sube[0].k] + ' (' + PM.dt(ARRIBA, fmt(sube[0].v)) + ')');
        if (baja.length) t += tr((sube.length ? '; lo que más cayó, ' : ' Lo que más cayó fue ') + MIN[baja[0].k] + ' (' + PM.dt(ABAJO, fmt(baja[0].v)) + ')', (sube.length ? '; what fell the most, ' : ' What fell the most was ') + MIN[baja[0].k] + ' (' + PM.dt(ABAJO, fmt(baja[0].v)) + ')');
        t += '.';
        var im = v.importaciones[i];
        if (im != null && im >= 1) t += tr(' Que crezcan las importaciones no resta PIB por sí mismo: lo importado ya estaba dentro del consumo y la inversión (ver «Una identidad no explica causas»).',
          ' Growing imports do not subtract from GDP by themselves: what is imported was already within consumption and investment (see “An identity does not explain causes”).');
      }
      document.getElementById('panel-fecha').textContent = f;
      document.getElementById('panel').innerHTML = html + PM.ctx(t);
    }

    function preguntas() {
      return [
        [tr('¿Cómo se lee?', 'How do you read it?'), tr('<p>Cada panel es un destino de lo que produce el país, con el <strong>PIB primero</strong>: el consumo de los hogares, el del gobierno, la inversión fija, las exportaciones y las importaciones. La línea es el componente; el relleno <strong>turquesa</strong> marca cuándo está sobre la referencia (el cero en el crecimiento, el 100 en el nivel) y el <strong>rojo</strong> cuándo está debajo. La raya gris punteada repite el PIB.</p>' +
          '<p>El cursor sobre un período lo marca en los seis paneles, y la lectura de la derecha los ordena para ese período.</p>',
          '<p>Each panel is one use of what the country produces, with <strong>GDP first</strong>: household consumption, government consumption, fixed investment, exports and imports. The line is the component; the <strong>turquoise</strong> fill marks when it is above the reference (zero for growth, 100 for the level) and the <strong>red</strong> fill when it is below. The dashed gray line repeats GDP.</p>' +
          '<p>Hovering over a period marks it in all six panels, and the reading on the right ranks them for that period.</p>')],
        [tr('4 trimestres, trimestral o anual', '4 quarters, quarterly or annual'), tr('<p><strong>4 trimestres</strong> compara lo de los últimos 4 trimestres con los 4 anteriores: no tiene estación y es la lectura más limpia. <strong>Trimestral</strong> es la tasa que publica el INE (cada trimestre frente al mismo del año anterior). <strong>Anual</strong>, el año calendario completo.</p>',
          '<p><strong>4 quarters</strong> compares the last 4 quarters with the previous 4: it has no seasonality and is the cleanest reading. <strong>Quarterly</strong> is the rate published by the INE (each quarter versus the same quarter of the previous year). <strong>Annual</strong>, the full calendar year.</p>')],
        [tr('¿Qué responde «Nivel (base = 100)»?', 'What does “Level (base = 100)” answer?'), tr('<p>Si cada componente está por encima o por debajo de donde estaba en el año base. Con 2019, el último año antes de la pandemia: ¿quién se recuperó y quién no?</p>' +
          '<p>Se calcula con los valores a precios constantes de cada componente (bolivianos encadenados de 2017): sirven para comparar un componente consigo mismo, no para sumar componentes entre sí.</p>',
          '<p>Whether each component is above or below where it was in the base year. With 2019, the last year before the pandemic: who recovered and who did not?</p>' +
          '<p>It is calculated with each component’s values at constant prices (chained 2017 bolivianos): they are useful for comparing a component with itself, not for adding components together.</p>')],
        [tr('¿Qué es la inversión fija?', 'What is fixed investment?'), tr('<p>Lo que se gasta en construcción, maquinaria y equipo: la <strong>formación bruta de capital fijo</strong> (FBCF) de las cuentas nacionales. Es la que amplía la capacidad de producir.</p>' +
          '<p>La formación bruta de capital total suma además la variación de existencias, una partida chica y volátil sin tasa propia: aparece en la contribución al crecimiento.</p>',
          '<p>What is spent on construction, machinery and equipment: the <strong>gross fixed capital formation</strong> (GFCF) of the national accounts. It is what expands productive capacity.</p>' +
          '<p>Total gross capital formation also adds the change in inventories, a small and volatile item with no rate of its own: it appears in the contribution to growth.</p>')],
        [tr('Una identidad no explica causas', 'An identity does not explain causes'), tr('<p>Esta descomposición sale de una <strong>identidad contable</strong>: PIB = C + I + G + X − M. Se cumple siempre, por definición, y por eso no dice qué causó qué. Que un componente «sume» o «reste» puntos describe cómo se reparte la cuenta, no qué movió al PIB.</p>' +
          '<p>El caso típico son las importaciones. Llevan signo menos porque lo importado ya está contado dentro del consumo, la inversión y las exportaciones, y no se produjo en el país: el signo sólo evita contarlo como producción nacional. Importar más no resta PIB por sí mismo. Si un arancel recorta las importaciones, también recorta el consumo y la inversión que se hacían con ellas; el efecto neto depende de cómo responda cada componente.</p>' +
          '<p>Ante un cambio, la pregunta útil es qué lo causó (precios, política, un shock externo) y «¿y después qué?», sin suponer que el resto de la identidad queda quieto. Lo explica Brian Albrecht en <a href="https://www.economicforces.xyz/p/never-reason-from-an-accounting-identity-c4f" target="_blank" rel="noopener">«Never Reason from an Accounting Identity»</a> (Economic Forces, 2026).</p>',
          '<p>This breakdown comes from an <strong>accounting identity</strong>: GDP = C + I + G + X − M. It always holds, by definition, and for that reason it does not say what caused what. That a component “adds” or “subtracts” points describes how the arithmetic is split, not what moved GDP.</p>' +
          '<p>The typical case is imports. They carry a minus sign because what is imported is already counted within consumption, investment and exports, and was not produced in the country: the sign merely avoids counting it as domestic production. Importing more does not subtract from GDP by itself. If a tariff cuts imports, it also cuts the consumption and investment that were made with them; the net effect depends on how each component responds.</p>' +
          '<p>Faced with a change, the useful question is what caused it (prices, policy, an external shock) and “and then what?”, without assuming that the rest of the identity stays put. Brian Albrecht explains it in <a href="https://www.economicforces.xyz/p/never-reason-from-an-accounting-identity-c4f" target="_blank" rel="noopener">“Never Reason from an Accounting Identity”</a> (Economic Forces, 2026).</p>')],
        [tr('¿Escala por panel o común?', 'Per-panel or shared scale?'), tr('<p><strong>Por panel</strong>, cada componente usa su propia escala: se ve bien la forma de cada uno. <strong>Común</strong>, todos comparten la misma: se ve cuál se mueve más (la inversión y el comercio exterior oscilan mucho más que el consumo).</p>',
          '<p><strong>Per panel</strong>, each component uses its own scale: the shape of each one is clearly visible. <strong>Shared</strong>, they all use the same one: you can see which moves the most (investment and foreign trade swing much more than consumption).</p>')]
      ];
    }

    // Imagen: los paneles llevan su nombre; la leyenda explica los rellenos y la raya del PIB
    PM.leyendaImagen = function () {
      var b = nivel() ? estado.base : null;
      return [{ name: b ? tr('Sobre ' + b, 'Above ' + b) : tr('Crece', 'Growing'), color: PM.tinte(true), forma: 'area' },
              { name: b ? tr('Bajo ' + b, 'Below ' + b) : tr('Cae', 'Falling'), color: PM.tinte(false), forma: 'area' }]
        .concat(activas.has('pib') ? [{ name: tr('PIB', 'GDP'), color: PM.dk() ? '#8A9699' : '#5C6B70', forma: 'punteada' }] : []);
    };
    // Datos: el eje X es numérico (años decimales), así que la tabla se declara
    PM.tablaDatos = function () {
      var u = nivel() ? tr('índice de 4 trimestres, ' + estado.base + ' = 100', '4-quarter index, ' + estado.base + ' = 100') : { c4: tr('crecimiento de 4 trimestres, %', '4-quarter growth, %'), var: tr('variación interanual, %', 'year-on-year change, %'), anual: tr('crecimiento del año, %', 'growth for the year, %') }[estado.medida];
      return { cols: [tr('Período (' + u + ')', 'Period (' + u + ')')].concat(PANELES.map(function (k) { return GASTO[k].nombre; })),
        filas: DAT.K.map(function (k, i) { return [k].concat(PANELES.map(function (c) { return DAT.v[c][i] == null ? null : +DAT.v[c][i].toFixed(3); })); }) };
    };
  })();
  </script>
</body>
</html>
