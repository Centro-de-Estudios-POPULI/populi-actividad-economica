<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Crecimiento PIB por gasto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --populi:#C71E1D;--populi-dark:#8B1A1A;--populi-light:#E8706B;--populi-gold:#EE9B00;
  --cream:#F5EFE0;--brown:#5C3D1E;--brown-dark:#3D2B1F;
  --navy:#0D1B2A;--navy-light:#1A2940;
  --slate:#475569;--slate-light:#64748B;
  --warm-white:#FAF8F3;--light-gray:#F1EDE5;
  --border:#E2DDD3;--dark-border:#2A3A50;
  --bg:var(--warm-white);--card:#FFFFFF;--text:var(--brown-dark);--muted:var(--slate-light);
  --shadow:0 1px 3px rgba(13,27,42,.04),0 4px 16px rgba(13,27,42,.06);
  --radius:12px;
  --ct-pib:#0A9396;--ct-agro:#0A9396;--ct-extract:#EE9B00;--ct-manuf:#005F73;
  --ct-elec:#9B2226;--ct-const:#C71E1D;--ct-comer:#94D2BD;--ct-trans:#005F73;
  --ct-aloja:#DF5D25;--ct-finan:#EE9B00;--ct-admin:#64748B;--ct-comun:#0A9396;
}
[data-theme="dark"]{
  --bg:#080808;--card:#141414;--text:#E2E8F0;--muted:#64748B;
  --border:#2A3A50;--light-gray:#1A1A1A;--cream:#1A2940;
}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
.embed-container{max-width:1200px;margin:0 auto;padding:20px 16px}
.section-title{
  font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;font-weight:700;
  color:var(--navy);display:flex;align-items:center;gap:10px;
}
[data-theme="dark"] .section-title{color:#fff}
.accent-bar{width:4px;height:26px;border-radius:2px;flex-shrink:0}
.section-subtitle{font-size:.78rem;color:var(--muted);padding-left:14px;margin-top:2px}
.chart-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;overflow:hidden;margin-top:12px;
}
[data-theme="dark"] .chart-card{background:#141414;border-color:var(--dark-border)}
#chart{width:100%;height:460px}
.chart-source{
  display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:0 2px;
}
.chart-source-text{font-size:.58rem;color:var(--muted);opacity:.6}
.chart-source-text a{color:var(--populi);font-weight:600;text-decoration:none}
.watermark{height:15px;width:auto;opacity:.18}
[data-theme="dark"] .watermark{opacity:.10}
</style>
</head>
<body>
<div class="embed-container">
  <div class="section-title">
    <span class="accent-bar" style="background:#0A9396"></span>
    Crecimiento del PIB por componente de gasto
  </div>
  <div class="section-subtitle">Variación interanual (%) de cada componente de gasto</div>
  <div class="chart-card">
    <div id="chart"></div>
    <div class="chart-source">
      <span class="chart-source-text">Fuente: <a>INE</a> &middot; Elaboraci&oacute;n: <a>Centro de Estudios POPULI</a></span>
      <svg viewBox="0 0 310 130" class="watermark"><text x="6" y="112" font-family="'Playfair Display'" font-size="145" font-weight="700" fill="#C71E1D">P</text><text x="92" y="87" font-family="'Playfair Display'" font-size="55" font-weight="400" font-style="italic" fill="#3D2B1F">opuli</text></svg>
    </div>
  </div>
</div>
<script>
(function(){
  /* ── Theme ─────────────────────────────────────── */
  var params=new URLSearchParams(window.location.search);
  if(params.get('theme')==='dark') document.documentElement.dataset.theme='dark';
  window.addEventListener('message',function(e){if(e.data&&e.data.theme) document.documentElement.dataset.theme=e.data.theme});
  function dk(){return document.documentElement.dataset.theme==='dark'}

  /* ── Alto real hacia el contenedor ─────────────── */
  var _lastH=0;
  function reportHeight(force){
    if(window.parent===window) return;
    /* Medir el CONTENIDO, no el documento: scrollHeight nunca baja del alto del propio
       iframe, asi que reportaba el min-height vigente y el ajuste no hacia nada. */
    var bottom=0, kids=document.body.children;
    for(var i=0;i<kids.length;i++){
      var r=kids[i].getBoundingClientRect();
      if(r.height>0) bottom=Math.max(bottom, r.bottom);
    }
    var pad=parseFloat(getComputedStyle(document.body).paddingBottom)||0;
    var h=Math.ceil(bottom + window.scrollY + pad);
    if(h>0 && (force===true || Math.abs(h-_lastH)>2)){
      _lastH=h; window.parent.postMessage({populiEmbed:'height', height:h},'*');
    }
  }
  /* Reintentos: el primer aviso puede salir antes de que el contenedor escuche, y el
     grafico todavia puede crecer al montar ECharts o al cargar las fuentes. */
  window.addEventListener('load',function(){reportHeight(true)});
  [0,150,600,1600].forEach(function(ms){setTimeout(function(){reportHeight(true)},ms)});
  window.addEventListener('resize',function(){reportHeight(false)});
  window.addEventListener('message',function(e){
    if(e.data&&e.data.populiEmbed==='ask-height') reportHeight(true);
  });
  if(window.ResizeObserver) new ResizeObserver(function(){reportHeight(false)}).observe(document.body);

  /* ── Chart ─────────────────────────────────────── */
  var chartDom=document.getElementById('chart');
  var chart=echarts.init(chartDom);

  function buildChart(){

    var labels=["2018-T1", "2018-T2", "2018-T3", "2018-T4", "2019-T1", "2019-T2", "2019-T3", "2019-T4", "2020-T1", "2020-T2", "2020-T3", "2020-T4", "2021-T1", "2021-T2", "2021-T3", "2021-T4", "2022-T1", "2022-T2", "2022-T3", "2022-T4", "2023-T1", "2023-T2", "2023-T3", "2023-T4", "2024-T1", "2024-T2", "2024-T3", "2024-T4", "2025-T1", "2025-T2", "2025-T3", "2025-T4"];
    var zeroLine=new Array(labels.length).fill(0);
    chart.setOption({
      backgroundColor:'transparent',
      grid:{top:30,right:16,bottom:70,left:52},
      tooltip:{
      trigger:'axis',
      backgroundColor:dk()?'#080808':'rgba(13,27,42,.96)',
      borderColor:dk()?'#2A3A50':'#1A2940',
      borderWidth:1,
      textStyle:{fontFamily:'Inter',fontSize:12,color:'#fff'},
      padding:[12,16],
      extraCssText:'border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);',
      formatter:function(params){
        if(!params||!params.length) return '';
        var s='<div style="color:#E9D8A6;font-weight:600;margin-bottom:6px">'+params[0].axisValue+'</div>';
        params.forEach(function(p){
          if(p.value!=null){
            s+=p.marker+' <span style="color:#ccc">'+p.seriesName+'</span> '
              +'<span style="font-family:\'JetBrains Mono\';font-weight:700;color:#fff">'
              +p.value.toFixed(2)+' %</span><br/>';
          }
        });
        return s;
      }
    },
      legend:{
        data:["PIB Total", "Consumo Gobierno", "Consumo Hogares", "FBK", "Exportaciones", "Importaciones"],bottom:4,type:'scroll',
        textStyle:{fontFamily:'Inter',fontSize:10,color:dk()?'#64748B':'#64748B'}
      },
      xAxis:{
      type:'category',
      data:labels,
      boundaryGap:false,
      axisLine:{lineStyle:{color:dk()?'#2A3A50':'#E2DDD3'}},
      axisTick:{show:false},
      axisLabel:{
        fontFamily:'Inter',fontSize:10,fontWeight:500,
        color:dk()?'#64748B':'#64748B',
        rotate:45,
        interval:1
      }
    },
      yAxis:{
      type:'value',
      name:'%',
      nameTextStyle:{fontFamily:'Inter',fontSize:11,color:dk()?'#64748B':'#64748B',padding:[0,0,0,0]},
      splitLine:{lineStyle:{color:dk()?'#141414':'#F1F5F9',type:'dashed'}},
      axisLine:{show:false},
      axisTick:{show:false},
      axisLabel:{
        fontFamily:'JetBrains Mono',fontSize:11,
        color:dk()?'#64748B':'#64748B',
        formatter:'{value}%'
      }
    },
      series:[{
          name:'PIB Total',type:'line',data:[2.99, 6.56, 0.41, 1.58, 3.52, 1.14, 3.59, -2.18, -4.59, -25.9, -16.25, -2.7, -1.86, 27.35, 12.86, 4.78, 8.75, 4.55, 3.66, -1.65, -0.19, 3.59, 2.86, 3.79, -2.39, 0.85, -1.4, -1.7, -1.67, -2.77, -0.68, -1.14],
          symbol:'none',z:10,
          lineStyle:{width:2.5,color:'#0A9396',},
          itemStyle:{color:'#0A9396'},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'#0A939618'},{offset:1,color:'#0A939602'}
          ])}
        },{
          name:'Consumo Gobierno',type:'line',data:[-1.95, 9.69, 5.64, 0.49, 2.85, 1.25, -0.06, 3.03, -2.9, -3.56, -1.01, -1.25, 4.38, 3.13, 2.63, 7.39, 1.03, -1.09, 5.48, 1.12, 4.37, 9.88, 1.65, 0.92, 0.48, -0.49, -0.76, 3.2, -0.8, -1.41, 4.24, -2.54],
          symbol:'none',z:2,
          lineStyle:{width:1.8,color:'#005F73',},
          itemStyle:{color:'#005F73'},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'#005F7318'},{offset:1,color:'#005F7302'}
          ])}
        },{
          name:'Consumo Hogares',type:'line',data:[1.86, 4.48, 1.19, 4.94, 6.18, 4.17, 3.15, -5.7, -2.99, -24.95, -14.62, -1.6, -5.43, 23.83, 11.93, 4.31, 6.79, 6.44, 8.14, 2.19, 4.45, 1.73, 0.11, 4.27, -1.12, 5.12, 1.91, 0.78, 4.55, -0.23, 1.94, 0.54],
          symbol:'none',z:2,
          lineStyle:{width:1.8,color:'#0A9396',},
          itemStyle:{color:'#0A9396'},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'#0A939618'},{offset:1,color:'#0A939602'}
          ])}
        },{
          name:'FBK',type:'line',data:[-2.62, 8.23, -1.89, 13.59, 16.6, 13.36, 11.01, -17.86, -32.79, -66.31, -42.79, -16.0, -9.29, 99.24, 21.11, 4.74, 9.76, -3.48, 6.36, 6.58, 17.59, 12.12, 2.64, -5.48, -4.33, -6.21, -1.89, -2.17, -17.61, -2.51, -14.04, -10.75],
          symbol:'none',z:2,
          lineStyle:{width:1.8,color:'#EE9B00',},
          itemStyle:{color:'#EE9B00'},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'#EE9B0018'},{offset:1,color:'#EE9B0002'}
          ])}
        },{
          name:'Exportaciones',type:'line',data:[9.44, 3.21, -2.1, -1.74, -5.68, -6.31, 4.81, 13.11, -2.64, -42.11, -32.17, -16.67, 7.39, 85.37, 48.51, 27.22, 24.28, 21.45, 9.79, -7.96, -15.46, -11.46, -4.01, -1.02, -11.34, -9.14, -17.36, -19.85, -10.36, -0.24, 9.28, 29.41],
          symbol:'none',z:2,
          lineStyle:{width:1.8,color:'#0A9396',},
          itemStyle:{color:'#0A9396'},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'#0A939618'},{offset:1,color:'#0A939602'}
          ])}
        },{
          name:'Importaciones',type:'line',data:[-1.05, 2.77, 0.86, 14.43, 6.09, 6.03, 1.37, -13.65, -18.41, -53.17, -33.66, -15.63, -5.66, 73.54, 28.82, 17.66, 8.29, 16.07, 26.17, 10.13, 12.38, -5.85, -10.2, -9.08, -8.78, -9.0, -12.95, -10.85, -4.38, 10.18, 10.79, 19.63],
          symbol:'none',z:2,
          lineStyle:{width:1.8,color:'#C71E1D',},
          itemStyle:{color:'#C71E1D'},
          areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'#C71E1D18'},{offset:1,color:'#C71E1D02'}
          ])}
        },{
      type:'line',data:new Array(labels.length).fill(0),
      symbol:'none',lineStyle:{color:dk()?'#475569':'#E2DDD3',width:0.8},
      silent:true,name:''
    },{
      type:'line',data:zeroLine,
      symbol:'none',lineStyle:{color:dk()?'#475569':'#E2DDD3',width:0.8},
      silent:true,name:''
    }]
    },true);
  }

  buildChart();
  new MutationObserver(function(){buildChart()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('resize',function(){chart.resize()});
})();
</script>
</body>
</html>
