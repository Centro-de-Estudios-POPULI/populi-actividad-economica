    .embed-container{max-width:1200px;margin:0 auto;padding:20px 16px}
    .section-header{margin-bottom:16px}
    .section-title{font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px;line-height:1.15}
    [data-theme="dark"] .section-title{color:#fff}
    .accent-bar{width:4px;height:26px;background:var(--accent);border-radius:2px;flex-shrink:0}
    .section-subtitle{font-size:.78rem;color:var(--muted);padding-left:14px;margin-top:2px}
    [data-theme="dark"] .section-subtitle{color:rgba(255,255,255,.4)}

    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    @media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
    .kpi-card{background:var(--warm-white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden;cursor:default;transition:transform .2s,box-shadow .2s}
    [data-theme="dark"] .kpi-card{background:#141414;border-color:var(--dark-border)}
    .kpi-card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
    .kpi-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
    .kpi-card[data-s="pib"]::after{background:var(--accent)}
    .kpi-card[data-s="best"]::after{background:#059669}
    .kpi-card[data-s="worst"]::after{background:#C71E1D}
    .kpi-card[data-s="count"]::after{background:#D97706}
    .kpi-label{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
    [data-theme="dark"] .kpi-label{color:rgba(255,255,255,.4)}
    .kpi-value{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700}
    .kpi-sub{font-size:.58rem;color:var(--muted);margin-top:2px}

    .main-grid{display:grid;grid-template-columns:3fr 2fr;grid-template-rows:580px;gap:16px}
    @media(max-width:900px){.main-grid{grid-template-columns:1fr;grid-template-rows:480px auto}}
    @media(max-width:500px){.main-grid{grid-template-rows:380px auto}.section-title{font-size:1.2rem}.kpi-value{font-size:1rem}}
    @media(min-width:1100px){.main-grid{grid-template-rows:600px}}

    .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;height:100%;overflow:hidden}
    [data-theme="dark"] .chart-card{background:#141414;border-color:var(--dark-border)}
    .chart-controls{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
    .toggle-group{display:flex;gap:4px}
    .view-btn{padding:4px 12px;border:1.5px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:.65rem;font-weight:600;color:var(--muted);transition:all .2s}
    [data-theme="dark"] .view-btn{border-color:var(--dark-border);color:#94A3B8}
    .view-btn:hover,.view-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(13,148,136,.06)}
    [data-theme="dark"] .view-btn:hover,[data-theme="dark"] .view-btn.active{border-color:#14B8A6;color:#14B8A6;background:rgba(13,148,136,.1)}

    .watermark{height:15px;width:auto;opacity:.18}

    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:100%}

    .edu-box-arrow{font-size:.6rem;color:var(--muted);transition:transform .2s}

    .edu-box.open .edu-box-content{display:block}

    .edu-box-content p strong{color:var(--navy)}
    [data-theme="dark"] .edu-box-content p strong{color:#E2E8F0}

</head>

      +'<div class="panel-footer"><a href="https://populi.org.bo/monitor-actividad-economica" target="_blank" class="ampliar-btn"><span>Ampliar análisis</span>'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      +'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a></div>'
      +'</div></div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px" id="edu"></div>';
  }

  function buildControls(){
    var vEl=document.getElementById('views');
    VIEWS.forEach(function(v,i){
      var b=document.createElement('button');
      b.className='view-btn'+(i===curView?' active':'');
      b.textContent=v.label;
      b.addEventListener('click',function(){curView=i;
        document.querySelectorAll('.view-btn').forEach(function(x){x.classList.remove('active')});
        b.classList.add('active');buildChart();updatePanel(curIdx);buildKPIs()});
      vEl.appendChild(b);
    });
    var rEl=document.getElementById('ranges');
    RANGES.forEach(function(r,i){
      var b=document.createElement('button');
      b.className='range-btn'+(i===curRange?' active':'');
      b.textContent=r.label;
      b.addEventListener('click',function(){curRange=i;
        document.querySelectorAll('.range-btn').forEach(function(x){x.classList.remove('active')});
        b.classList.add('active');buildChart();updatePanel(curIdx);buildKPIs()});
      rEl.appendChild(b);
    });
  }

  function getSlice(){
    var trim=RANGES[curRange].trim;
    var si=trim>0?Math.max(0,LABELS.length-trim):0;
    return{si:si,labels:LABELS.slice(si)};
  }

  function buildKPIs(){
    var k=VIEWS[curView].key;
    var li=LABELS.length-1;
    var pv=PIB[k][li];
    var bestS=null,bestV=-999,worstS=null,worstV=999,posCount=0;
    G.forEach(function(s){
      var v=s[k][li];if(v==null)return;
      if(v>bestV){bestV=v;bestS=s}
      if(v<worstV){worstV=v;worstS=s}
      if(v>0)posCount++;
    });
    document.getElementById('kpis').innerHTML=
      '<div class="kpi-card" data-s="pib"><div class="kpi-label">Crecimiento PIB</div>'
      +'<div class="kpi-value" style="color:var(--accent)">'+fp(pv)+'</div>'
      +'<div class="kpi-sub">'+VIEWS[curView].label+' · '+fq(LABELS[li])+'</div></div>'
      +'<div class="kpi-card" data-s="best"><div class="kpi-label">Mayor contribución</div>'
      +'<div class="kpi-value" style="color:'+(bestS?bestS.c:'#000')+'">'+fpp(bestV)+'</div>'
      +'<div class="kpi-sub">'+(bestS?bestS.n:'—')+'</div></div>'
      +'<div class="kpi-card" data-s="worst"><div class="kpi-label">Mayor resta</div>'
      +'<div class="kpi-value" style="color:'+(worstS?worstS.c:'#000')+'">'+fpp(worstV)+'</div>'
      +'<div class="kpi-sub">'+(worstS?worstS.n:'—')+'</div></div>'
      +'<div class="kpi-card" data-s="count"><div class="kpi-label">Aportan positivo</div>'
      +'<div class="kpi-value" style="color:#D97706">'+posCount+' <span style="font-size:.7rem;font-weight:400">de 5</span></div>'
      +'<div class="kpi-sub">Componentes que suman al crecimiento</div></div>';
  }

  function buildChart(){
    var d=dk();
    var k=VIEWS[curView].key;
    var sl=getSlice();
    var labels=sl.labels;var si=sl.si;

    var series=[];
    G.forEach(function(s){
      series.push({
        name:s.n,type:'bar',stack:'contrib',
        data:s[k].slice(si),
        itemStyle:{color:s.c},
        emphasis:{focus:'series'},
        barMaxWidth:28
      });
    });
    series.push({
      name:'PIB Total',type:'line',smooth:0.3,
      data:PIB[k].slice(si),
      symbol:'circle',symbolSize:4,z:10,
      lineStyle:{width:2.5,color:d?'#E2E8F0':'#0D1B2A'},
      itemStyle:{color:d?'#E2E8F0':'#0D1B2A',borderColor:d?'#141414':'#fff',borderWidth:1.5},
      connectNulls:true
    });

    chart.setOption({
      backgroundColor:'transparent',
      grid:{top:24,right:12,bottom:44,left:48},
      legend:{show:true,bottom:2,itemWidth:12,itemHeight:2,itemGap:10,
        type:'scroll',pageIconSize:10,pageTextStyle:{fontSize:9},
        textStyle:{fontFamily:'Inter',fontSize:9,color:d?'#94A3B8':'#64748B',padding:[0,0,0,2]},
        itemStyle:{borderWidth:0}},
      tooltip:{
        trigger:'axis',
        backgroundColor:d?'#080808':'rgba(13,27,42,.96)',
        borderColor:d?'#2A3A50':'#1A2940',
        textStyle:{fontFamily:'Inter',fontSize:11,color:'#fff'},
        padding:[12,16],
        extraCssText:'border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);max-height:420px;overflow-y:auto;',
        formatter:function(params){
          if(!params.length)return'';
          var idx=params[0].dataIndex;
          updatePanel(idx+si);
          var lbl=labels[idx];
          var html='<div style="font-weight:700;margin-bottom:6px;color:#E9D8A6;font-size:12px">'+fq(lbl)+'</div>';
          var pibP=params.find(function(p){return p.seriesName==='PIB Total'});
          if(pibP&&pibP.value!=null){
            html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)">'
              +'<span style="width:10px;height:2px;background:'+(d?'#E2E8F0':'#fff')+';display:inline-block"></span>'
              +'<span style="font-size:10px;color:rgba(255,255,255,.6)">PIB Total</span>'
              +'<span style="font-family:\'JetBrains Mono\';font-weight:700;font-size:12px;margin-left:auto">'+fp(pibP.value)+'</span></div>';
          }
          var items=params.filter(function(p){return p.seriesName!=='PIB Total'&&p.value!=null&&Math.abs(p.value)>=0.01})
            .sort(function(a,b){return b.value-a.value});
          items.forEach(function(p){
            html+='<div style="display:flex;align-items:center;gap:6px;margin:2px 0">'
              +'<span style="width:8px;height:8px;border-radius:50%;background:'+p.color+';display:inline-block"></span>'
              +'<span style="font-size:10px;color:rgba(255,255,255,.6);flex:1">'+p.seriesName+'</span>'
              +'<span style="font-family:\'JetBrains Mono\';font-weight:700;font-size:11px;color:'+(p.value>=0?'#34D399':'#F87171')+'">'+fpp(p.value)+'</span></div>';
          });
          return html;
        }
      },
      xAxis:{
        type:'category',data:labels,
        axisLine:{lineStyle:{color:d?'#2A3A50':'#E2DDD3'}},
        axisTick:{show:false},
        axisLabel:{fontFamily:'Inter',fontSize:9,fontWeight:500,color:d?'#64748B':'#94A3B8',
          formatter:function(v,i){
            if(i===0||i===labels.length-1)return v;
            var step=Math.max(1,Math.round(labels.length/8));
            return i%step===0?v:'';
          },showMinLabel:true,showMaxLabel:true,rotate:35}
      },
      yAxis:{
        type:'value',
        splitLine:{lineStyle:{color:d?'#1E1E1E':'#F1F5F9',type:'dashed'}},
        axisLine:{show:false},axisTick:{show:false},
        axisLabel:{fontFamily:'JetBrains Mono',fontSize:10,color:d?'#64748B':'#94A3B8',
          formatter:function(v){return(v>=0?'+':'')+v+'%'}}
      },
      series:series
    },true);
  }

  function updatePanel(globalIdx){
    if(globalIdx<0||globalIdx>=LABELS.length)globalIdx=LABELS.length-1;
    curIdx=globalIdx;
    var d=dk();
    var k=VIEWS[curView].key;
    var lbl=LABELS[globalIdx];
    var pv=PIB[k][globalIdx];

    document.getElementById('panel-date').textContent=fq(lbl);

    var items=[];
    G.forEach(function(s){items.push({n:s.n,c:s.c,v:s[k][globalIdx]})});
    items.sort(function(a,b){return(b.v||0)-(a.v||0)});

    var pos=items.filter(function(x){return x.v!=null&&x.v>0});
    var neg=items.filter(function(x){return x.v!=null&&x.v<0});

    var html='<div class="panel-block">'
      +'<div class="panel-label" style="color:#0D9488;background:rgba(13,148,136,.08);border-left-color:#0D9488">PIB Total — '+VIEWS[curView].label+'</div>'
      +'<div class="panel-val" style="color:#0D9488">'+fp(pv)+'</div>'
      +'<p class="panel-desc">Descomposición del crecimiento en <strong>contribuciones por componente de gasto</strong> (puntos porcentuales).</p></div>';

    if(pos.length){
      html+='<div class="panel-block"><div style="font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#059669;margin-bottom:4px">&#9650; Aportan al crecimiento</div>';
      pos.forEach(function(x){
        var note='';
        if(x.n==='Importaciones') note=' <span style="font-size:.5rem;color:var(--muted)">(caen)</span>';
        html+='<div class="cb-row"><span class="cb-dot" style="background:'+x.c+'"></span>'
          +'<span class="cb-name">'+x.n+note+'</span>'
          +'<span class="cb-val" style="color:'+(d?'#34D399':'#059669')+'">'+fpp(x.v)+'</span></div>';
      });
      html+='</div>';
    }
    if(neg.length){
      html+='<div class="panel-block"><div style="font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#C71E1D;margin-bottom:4px">&#9660; Restan al crecimiento</div>';
      neg.forEach(function(x){
        var note='';
        if(x.n==='Importaciones') note=' <span style="font-size:.5rem;color:var(--muted)">(crecen)</span>';
        html+='<div class="cb-row"><span class="cb-dot" style="background:'+x.c+'"></span>'
          +'<span class="cb-name">'+x.n+note+'</span>'
          +'<span class="cb-val" style="color:'+(d?'#F87171':'#C71E1D')+'">'+fpp(x.v)+'</span></div>';
      });
      html+='</div>';
    }

    var best=items[0],worst=items[items.length-1];
    var analysis='';
    if(pv!=null&&pv<0){
      analysis='<strong>Economía en contracción.</strong> El PIB cae <span class="delta-tag dt-red">'+fp(pv)+'</span>. ';
      if(worst&&worst.v!=null)analysis+='El principal lastre es <strong>'+worst.n+'</strong> restando <span class="delta-tag dt-red">'+fpp(worst.v)+'</span>.';
      if(pos.length>0)analysis+=' Sin embargo, '+pos.length+' componente'+(pos.length>1?'s aún aportan':' aún aporta')+' positivamente.';
    } else if(pv!=null){
      analysis='<strong>Economía en expansión.</strong> El PIB crece <span class="delta-tag dt-teal">'+fp(pv)+'</span>. ';
      if(best&&best.v!=null)analysis+='El principal motor es <strong>'+best.n+'</strong> aportando <span class="delta-tag dt-green">'+fpp(best.v)+'</span>.';
    } else {
      analysis='Datos no disponibles para este trimestre en la medida seleccionada.';
    }

    var demInt=((items.find(function(x){return x.n==='Consumo Privado'})||{}).v||0)
      +((items.find(function(x){return x.n==='Consumo Público'})||{}).v||0)
      +((items.find(function(x){return x.n==='Inversión'})||{}).v||0);
    var demExt=((items.find(function(x){return x.n==='Exportaciones'})||{}).v||0)
      +((items.find(function(x){return x.n==='Importaciones'})||{}).v||0);
    if(pv!=null){
      analysis+='<br><br><strong>Demanda interna</strong> (C+G+I): <span class="delta-tag '+(demInt>=0?'dt-teal':'dt-red')+'">'+fpp(demInt)+'</span>. ';
      analysis+='<strong>Sector externo neto</strong> (X−M): <span class="delta-tag '+(demExt>=0?'dt-teal':'dt-red')+'">'+fpp(demExt)+'</span>.';
    }
    html+='<div class="ctx-box"><p>'+analysis+'</p></div>';

    document.getElementById('panel-body').innerHTML=html;
  }

  function buildEdu(){
    var items=[
      {t:'¿Qué es la contribución por gasto?',
       c:'<p>Mide <strong>cuántos puntos porcentuales</strong> aporta cada componente del gasto al crecimiento total del PIB. Si el PIB crece 3% y el Consumo Privado contribuye 2.1 pp, significa que el consumo de hogares explica el 70% del crecimiento total.</p>'
        +'<p>La identidad del gasto es: <strong>PIB = C + G + I + X − M</strong>, donde C es consumo privado, G consumo público, I inversión, X exportaciones y M importaciones.</p>'},
      {t:'¿Por qué importaciones aparecen con signo invertido?',
       c:'<p>En la identidad del gasto, las importaciones se <strong>restan</strong> del PIB. Por eso, cuando las importaciones <strong>crecen</strong>, su contribución al crecimiento es <strong>negativa</strong> (restan al PIB). Cuando <strong>caen</strong>, su contribución es <strong>positiva</strong> (suman al PIB).</p>'
        +'<p>En el panel, cuando las importaciones aparecen en la sección verde significa que cayeron; si aparecen en la sección roja, significa que crecieron.</p>'},
      {t:'Demanda interna vs. sector externo',
       c:'<p>La <strong>demanda interna</strong> (C+G+I) refleja el gasto doméstico en consumo e inversión. El <strong>sector externo neto</strong> (X−M) refleja la contribución del comercio internacional.</p>'
        +'<p>Cuando la demanda interna lidera, el crecimiento depende del mercado interno. Cuando el sector externo domina, el crecimiento está más expuesto a shocks de precios internacionales y términos de intercambio.</p>'}
    ];
    document.getElementById('edu').innerHTML=items.map(function(e){
      return '<div class="edu-box" onclick="this.classList.toggle(\'open\')">'
        +'<div class="edu-box-toggle"><span class="edu-box-title">'+e.t+'</span>'
        +'<span class="edu-box-arrow">&#9660;</span></div>'
        +'<div class="edu-box-content">'+e.c+'</div></div>';
    }).join('');
  }

  init();
})();
</script>
</body>
</html>
