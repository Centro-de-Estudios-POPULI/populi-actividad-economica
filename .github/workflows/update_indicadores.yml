name: Actualizar Indicadores Adelantados

on:
  schedule:
    # Lunes 10:00 UTC (06:00 Bolivia) — semanal
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos del INE
        run: python scripts/scrape_indicadores.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ embed/ scripts/.file_hashes.json
          if git diff --cached --quiet; then
            echo "Sin cambios — nada que commitear"
          else
            git commit -m "auto: actualizar indicadores adelantados $(date -u +%Y-%m-%d)"
            git push
          fi
